<html lang="ru">
<head>

<title>Ironbound RTS v2.0 - The Great Finish</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d14;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e6edf3;touch-action:none}
canvas#game{position:absolute;left:0;top:0;width:100%;height:100%;display:block}

#rotate-overlay{
    display:none;position:fixed;inset:0;background:#090d14;z-index:9999;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px
}
#rotate-overlay svg{width:64px;height:64px;fill:#ffe45c;margin-bottom:16px;animation:spin 2s ease-in-out infinite alternate}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(-90deg)}}

@media (orientation: portrait){
    #rotate-overlay{display:flex}
}

#top-bar{
    position:fixed;top:0;left:0;right:0;height:40px;
    background:linear-gradient(180deg,rgba(11,16,25,.96) 0%,rgba(9,13,20,.85) 100%);
    border-bottom:1px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    user-select:none;z-index:20;font-size:12px;pointer-events:none
}
.res-group{display:flex;gap:14px;align-items:center}
.res-item{display:flex;align-items:center;gap:5px;font-weight:700;letter-spacing:.3px}
.res-icon{width:12px;height:12px;border-radius:3px;display:inline-block;box-shadow:0 0 6px rgba(0,0,0,.5)}
.icon-food{background:#2ecc71;box-shadow:0 0 6px rgba(46,204,113,.5)}
.icon-wood{background:#e67e22;box-shadow:0 0 6px rgba(230,126,34,.5)}
.icon-gold{background:#f1c40f;box-shadow:0 0 6px rgba(241,196,15,.5)}
.icon-pop{background:#9b59b6;box-shadow:0 0 6px rgba(155,89,182,.5)}

#meta-group{display:flex;gap:8px;align-items:center;font-weight:600}
.badge{background:rgba(255,255,255,.07);padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.12);font-size:11px}
.badge-gold{color:#ffe45c;border-color:rgba(255,228,92,.35)}
.badge-alert{color:#ff4d4d;border-color:rgba(255,77,77,.4);animation:pulse-red 1.2s infinite alternate}
@keyframes pulse-red{from{box-shadow:0 0 0 rgba(255,77,77,0)}to{box-shadow:0 0 8px rgba(255,77,77,.6)}}

#groups-hud{
    position:fixed;left:10px;top:48px;display:flex;flex-direction:column;gap:6px;z-index:20;pointer-events:none
}
.group-badge{
    width:36px;height:36px;background:rgba(8,12,18,.8);border:1px solid rgba(255,255,255,.2);
    border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#9aa0a6;cursor:pointer;pointer-events:auto;
    transition:all .15s ease
}
.group-badge:hover{border-color:#ffe45c;color:#ffe45c}
.group-badge.active{border-color:#ffe45c;color:#ffe45c;background:rgba(255,228,92,.18);box-shadow:0 0 8px rgba(255,228,92,.3)}
.group-badge span{font-size:8px;color:#cbd5e1;line-height:1}

#bottom-bar{
    position:fixed;bottom:0;left:0;right:0;height:124px;
    background:linear-gradient(0deg,rgba(8,12,18,.98) 0%,rgba(13,18,27,.9) 100%);
    border-top:1px solid rgba(255,255,255,.14);
    display:flex;justify-content:space-between;align-items:stretch;
    user-select:none;z-index:20;pointer-events:none;padding:0 8px
}

#minimap-wrapper{
    width:156px;height:100%;display:flex;align-items:center;justify-content:center;
    pointer-events:auto
}
#minimap{
    border:1px solid rgba(255,255,255,.25);background:#05070a;
    width:146px;height:104px;cursor:crosshair;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.6)
}

#panel-selection{
    flex:1;max-width:380px;padding:8px 12px;display:flex;gap:12px;align-items:center;
    pointer-events:none
}
#portrait-box{
    width:56px;height:56px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.18);border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;
    font-size:24px;color:#8ab4f8;flex-shrink:0;box-shadow:inset 0 0 8px rgba(0,0,0,.5)
}
#portrait-box.enemy{border-color:rgba(255,71,87,.6);color:#ff4757}
#entity-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#entity-header{display:flex;align-items:center;gap:6px}
#entity-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#entity-tag{font-size:9px;padding:1px 4px;border-radius:3px;font-weight:700;text-transform:uppercase}
.tag-player{background:rgba(56,189,248,.2);color:#38bdf8;border:1px solid rgba(56,189,248,.4)}
.tag-enemy{background:rgba(255,71,87,.2);color:#ff4757;border:1px solid rgba(255,71,87,.4)}
#entity-hp-wrap{width:160px;height:7px;background:rgba(0,0,0,.7);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.16);display:none;position:relative}
#entity-hp-fill{height:100%;background:#2ecc71;width:100%;transition:width .1s linear}
#entity-hp-fill.enemy{background:#ff4757}
#entity-desc{font-size:11px;color:#9aa0a6;line-height:1.25}

#panel-actions{
    width:260px;padding:6px 0;display:flex;align-items:center;justify-content:flex-end;
    pointer-events:auto
}
.actions-grid{
    display:grid;grid-template-columns:repeat(4,56px);grid-template-rows:repeat(2,52px);gap:6px
}
.hud-btn{
    width:56px;height:52px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
    border-radius:6px;color:#e6edf3;font-size:9.5px;font-weight:600;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    user-select:none;touch-action:manipulation;position:relative;transition:all .12s ease
}
.hud-btn:hover:not(:disabled){background:rgba(255,255,255,.15);border-color:#ffe45c;color:#fff}
.hud-btn:active:not(:disabled){background:rgba(255,228,92,.25);border-color:#ffe45c;color:#ffe45c;transform:scale(.97)}
.hud-btn:disabled{opacity:.35;cursor:not-allowed;border-color:rgba(255,255,255,.08);filter:grayscale(80%)}
.hud-btn kbd{font-size:8px;background:rgba(0,0,0,.6);padding:1px 3px;border-radius:3px;color:#ffe45c;font-weight:700}
.hud-btn .btn-cost{font-size:7.5px;color:#94a3b8;font-weight:600}

#end-screen{
    position:fixed;inset:0;background:rgba(6,9,14,.94);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;backdrop-filter:blur(6px)
}
#end-title{font-size:48px;font-weight:900;letter-spacing:3px;margin:0 0 12px;text-transform:uppercase}
#end-stats{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
    padding:18px 26px;border-radius:8px;min-width:320px;line-height:1.9;
    font-size:13px;margin-bottom:20px;box-shadow:0 12px 32px rgba(0,0,0,.6)
}
#restart-btn{
    padding:14px 38px;font-size:16px;font-weight:800;color:#090d14;
    background:#ffe45c;border:none;border-radius:6px;cursor:pointer;
    box-shadow:0 4px 16px rgba(255,228,92,.4);transition:transform .15s ease, background .15s ease
}
#restart-btn:hover{background:#fff085;transform:scale(1.04)}
#restart-btn:active{transform:scale(.97)}

// ----------------------------------------------------
// 5. Sound System (Web Audio API Procedural Synthesizer)
// ----------------------------------------------------
class SoundSystem {
    constructor(){
        this.ctx = null
        this.lastAlertTime = -99
    }

    init(){
        if(!this.ctx){
            const AudioCtx = window.AudioContext || window.webkitAudioContext
            if(AudioCtx) this.ctx = new AudioCtx()
        }
        if(this.ctx && this.ctx.state === 'suspended'){
            this.ctx.resume()
        }
    }

    tone(freq, type, duration, gainVal = 0.08, ramp = true){
        this.init()
        if(!this.ctx) return
        try{
            const osc = this.ctx.createOscillator()
            const g = this.ctx.createGain()
            osc.type = type
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime)
            g.gain.setValueAtTime(gainVal, this.ctx.currentTime)
            if(ramp){
                g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration)
            }
            osc.connect(g)
            g.connect(this.ctx.destination)
            osc.start()
            osc.stop(this.ctx.currentTime + duration)
        }catch(e){}
    }

    playWorkerSelect(){
        this.init()
        if(!this.ctx) return
        try{
            const now = this.ctx.currentTime
            const osc = this.ctx.createOscillator()
            const g = this.ctx.createGain()
            osc.type = 'sine'
            osc.frequency.setValueAtTime(740, now)
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.08)
            g.gain.setValueAtTime(0.05, now)
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.08)
            osc.connect(g)
            g.connect(this.ctx.destination)
            osc.start(now)
            osc.stop(now + 0.08)
        }catch(e){}
    }

    playInfantrySelect(){
        this.tone(480, 'triangle', 0.06, 0.06)
        setTimeout(() => this.tone(620, 'triangle', 0.05, 0.05), 40)
    }

    playHeavySelect(){
        this.init()
        if(!this.ctx) return
        try{
            const now = this.ctx.currentTime
            const osc = this.ctx.createOscillator()
            const g = this.ctx.createGain()
            osc.type = 'sawtooth'
            osc.frequency.setValueAtTime(140, now)
            osc.frequency.exponentialRampToValueAtTime(70, now + 0.14)
            g.gain.setValueAtTime(0.09, now)
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.14)
            osc.connect(g)
            g.connect(this.ctx.destination)
            osc.start(now)
            osc.stop(now + 0.14)
        }catch(e){}
    }

    playBuildingSelect(){
        this.tone(280, 'triangle', 0.08, 0.07)
    }

    playOrderConfirmation(){
        this.tone(480, 'sine', 0.05, 0.04)
        setTimeout(() => this.tone(720, 'sine', 0.07, 0.05), 45)
    }

    playAttackOrder(){
        this.tone(320, 'sawtooth', 0.08, 0.07)
        setTimeout(() => this.tone(220, 'sawtooth', 0.09, 0.08), 50)
    }

    playErrorBuzz(){
        this.tone(130, 'square', 0.15, 0.06)
    }

    playBuild(){
        this.tone(220, 'triangle', 0.12, 0.1)
        setTimeout(() => this.tone(330, 'triangle', 0.09, 0.09), 70)
    }

    playAttackHit(){
        this.tone(180, 'sawtooth', 0.06, 0.07)
    }

    playCannonFire(){
        this.init()
        if(!this.ctx) return
        try{
            const now = this.ctx.currentTime
            const osc = this.ctx.createOscillator()
            const g = this.ctx.createGain()
            osc.type = 'square'
            osc.frequency.setValueAtTime(110, now)
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.22)
            g.gain.setValueAtTime(0.12, now)
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.22)
            osc.connect(g)
            g.connect(this.ctx.destination)
            osc.start(now)
            osc.stop(now + 0.22)
        }catch(e){}
    }

    playCannonImpact(){
        this.tone(85, 'triangle', 0.25, 0.14)
    }

    playSpawn(){
        this.tone(520, 'sine', 0.08, 0.06)
        setTimeout(() => this.tone(780, 'sine', 0.12, 0.06), 70)
    }

    playAttackAlert(currentTime){
        if(currentTime - this.lastAlertTime < 5) return
        this.lastAlertTime = currentTime
        this.tone(440, 'sawtooth', 0.12, 0.09)
        setTimeout(() => this.tone(350, 'sawtooth', 0.15, 0.09), 110)
    }

    playVictory(){
        const notes = [440, 554, 659, 880]
        notes.forEach((freq, idx) => {
            setTimeout(() => this.tone(freq, 'triangle', 0.32, 0.13), idx * 120)
        })
    }

    playDefeat(){
        const notes = [440, 392, 349, 261]
        notes.forEach((freq, idx) => {
            setTimeout(() => this.tone(freq, 'sawtooth', 0.35, 0.14), idx * 130)
        })
    }
}

// ----------------------------------------------------
// Particles, Projectiles & Ground Rings
// ----------------------------------------------------
class ParticleSystem {
    constructor(){
        this.particles = []
        this.orderRings = []
        this.minimapPings = []
    }

    emit(x, y, color, count = 6, speed = 1.5, life = 0.4, radius = 2.5){
        for(let i = 0; i < count; i++){
            const angle = Math.random() * Math.PI * 2
            const spd = (Math.random() * 0.7 + 0.3) * speed
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                color, life, maxLife: life, radius
            })
        }
    }

    addOrderRing(x, y, color = '#38bdf8'){
        this.orderRings.push({x, y, color, radius: 2, maxRadius: 16, life: 0.35, maxLife: 0.35})
    }

    addMinimapPing(tileX, tileY, color = '#ff4757'){
        this.minimapPings.push({x: tileX, y: tileY, color, life: 1.8, maxLife: 1.8})
    }

    update(dt){
        for(const p of this.particles){
            p.x += p.vx * dt * 60
            p.y += p.vy * dt * 60
            p.life -= dt
        }
        this.particles = this.particles.filter(p => p.life > 0)

        for(const r of this.orderRings){
            r.life -= dt
            r.radius += (r.maxRadius - r.radius) * dt * 10
        }
        this.orderRings = this.orderRings.filter(r => r.life > 0)

        for(const m of this.minimapPings){
            m.life -= dt
        }
        this.minimapPings = this.minimapPings.filter(m => m.life > 0)
    }

    draw(ctx){
        for(const r of this.orderRings){
            const alpha = Math.max(0, r.life / r.maxLife)
            ctx.save()
            ctx.globalAlpha = alpha
            ctx.strokeStyle = r.color
            ctx.lineWidth = 2
            ctx.beginPath()
            ctx.arc(r.x * TILE_SIZE, r.y * TILE_SIZE, r.radius, 0, Math.PI * 2)
            ctx.stroke()
            ctx.restore()
        }

        for(const p of this.particles){
            const alpha = Math.max(0, p.life / p.maxLife)
            ctx.save()
            ctx.globalAlpha = alpha
            ctx.fillStyle = p.color
            ctx.beginPath()
            ctx.arc(p.x * TILE_SIZE, p.y * TILE_SIZE, p.radius, 0, Math.PI * 2)
            ctx.fill()
            ctx.restore()
        }
    }
}

// ----------------------------------------------------
// Tile & Map System
// ----------------------------------------------------
class Tile {
    constructor(x, y, type){
        this.x = x
        this.y = y
        this.type = type
        this.building = null
        this.resourceType = null
        this.resourceAmount = 0

        if(type === TILE_TYPES.FOREST){
            this.resourceType = 'wood'
            this.resourceAmount = 800
        }
        if(type === TILE_TYPES.GOLD){
            this.resourceType = 'gold'
            this.resourceAmount = 1200
        }
    }

    isWalkable(isWorkerGathering = false){
        if(this.type === TILE_TYPES.WATER) return false
        if(this.building){
            if(isWorkerGathering && this.building.type === BUILDING_TYPES.MINE) return true
            return false
        }
        return true
    }
}

class GameMap {
    constructor(width, height){
        this.width = width
        this.height = height
        this.tiles = []
        this.generate()
    }

    generate(){
        this.tiles = Array.from({length: this.height}, (_, y) =>
            Array.from({length: this.width}, (_, x) => {
                const r = Math.random()
                let type = TILE_TYPES.LAND
                if(r < 0.12) type = TILE_TYPES.WATER
                else if(r < 0.25) type = TILE_TYPES.FOREST
                else if(r < 0.29) type = TILE_TYPES.GOLD
                return new Tile(x, y, type)
            })
        )

        // Clear safe open area around player and enemy bases
        this.makeSafeArea(6, 6, 8)
        this.makeSafeArea(this.width - 7, this.height - 7, 8)

        // Guarantee accessible resource clusters near player base
        this.placeCluster(11, 6, TILE_TYPES.GOLD, 2)
        this.placeCluster(6, 11, TILE_TYPES.FOREST, 3)

        // Guarantee accessible resource clusters near enemy base
        this.placeCluster(this.width - 12, this.height - 7, TILE_TYPES.GOLD, 2)
        this.placeCluster(this.width - 7, this.height - 12, TILE_TYPES.FOREST, 3)
    }

    placeCluster(cx, cy, type, radius){
        for(let y = cy - radius; y <= cy + radius; y++){
            for(let x = cx - radius; x <= cx + radius; x++){
                if(this.inBounds(x, y)){
                    const tile = this.getTile(x, y)
                    tile.type = type
                    tile.building = null
                    tile.resourceType = type === TILE_TYPES.FOREST ? 'wood' : 'gold'
                    tile.resourceAmount = type === TILE_TYPES.FOREST ? 800 : 1200
                }
            }
        }
    }

    makeSafeArea(cx, cy, r){
        for(let y = cy - r; y <= cy + r; y++){
            for(let x = cx - r; x <= cx + r; x++){
                if(this.inBounds(x, y)){
                    const d = Math.hypot(x - cx, y - cy)
                    if(d <= r){
                        const tile = this.getTile(x, y)
                        tile.type = TILE_TYPES.LAND
                        tile.resourceType = null
                        tile.resourceAmount = 0
                    }
                }
            }
        }
    }

    inBounds(x, y){
        return x >= 0 && y >= 0 && x < this.width && y < this.height
    }

    getTile(x, y){
        if(!this.inBounds(x, y)) return null
        return this.tiles[y][x]
    }
}

class Player {
    constructor(name, team){
        this.name = name
        this.team = team
        this.resources = {
            food: 300,
            wood: 250,
            gold: 200
        }
        this.buildings = []
        this.units = []
        this.defeated = false
        this.stats = {
            workersCreated: 1,
            infantryCreated: 0,
            heavyCreated: 0,
            buildingsBuilt: 1,
            enemiesKilled: 0,
            gathered: {food: 0, wood: 0, gold: 0}
        }
    }

    get population(){
        return this.units.filter(u => u.hp > 0).length
    }

    get queuedUnitsCount(){
        let count = 0
        for(const b of this.buildings) count += b.productionQueue.length
        return count
    }

    get maxPopulation(){
        let cap = 0
        for(const b of this.buildings){
            if(b.underConstruction) continue
            if(b.type === BUILDING_TYPES.TOWN_HALL){
                if(b.level === 3) cap += 24
                else if(b.level === 2) cap += 16
                else cap += 10
            }
            if(b.type === BUILDING_TYPES.FARM) cap += 6
        }
        return Math.min(75, cap)
    }

    canAfford(cost){
        if(!cost) return true
        return Object.entries(cost).every(([r, v]) => (this.resources[r] || 0) >= v)
    }

    spend(cost){
        if(!this.canAfford(cost)) return false
        for(const [r, v] of Object.entries(cost)) this.resources[r] -= v
        return true
    }

    addResource(type, amount){
        this.resources[type] = (this.resources[type] || 0) + amount
        if(this.stats.gathered[type] !== undefined) this.stats.gathered[type] += amount
    }
}

class Building {
    constructor(game, x, y, owner, constructionTime = 5){
        this.game = game
        this.x = x
        this.y = y
        this.owner = owner
        this.type = 'building'
        this.maxHp = 500
        this.hp = 50
        this.underConstruction = true
        this.constructionTime = constructionTime
        this.constructionProgress = 0
        this.productionQueue = []
        this.productionProgress = 0
    }

    update(dt){
        if(this.underConstruction){
            this.constructionProgress += dt
            const p = Math.min(1, this.constructionProgress / this.constructionTime)
            this.hp = Math.max(1, Math.floor(this.maxHp * (0.1 + 0.9 * p)))

            if(Math.random() < 0.2){
                this.game.particles.emit(this.x + 0.5, this.y + 0.5, '#d2b48c', 1, 0.8, 0.3, 2)
            }

            if(this.constructionProgress >= this.constructionTime){
                this.underConstruction = false
                this.hp = this.maxHp
                this.game.sounds.playBuild()
                this.game.particles.emit(this.x + 0.5, this.y + 0.5, '#2ecc71', 10, 2, 0.5, 3)
            }
        }
    }
}

class TownHall extends Building {
    constructor(game, x, y, owner, instant = false){
        super(game, x, y, owner, 8)
        this.type = BUILDING_TYPES.TOWN_HALL
        this.level = 1
        this.maxLevel = 3
        this.maxHp = 1200
        this.isUpgrading = false
        this.upgradeProgress = 0
        this.upgradeDuration = 0
        this.upgradeCosts = {1: {wood: 200, gold: 150}, 2: {wood: 350, gold: 300}}
        this.upgradeTimes = {1: 10, 2: 15}

        if(instant){
            this.underConstruction = false
            this.hp = this.maxHp
            this.constructionProgress = this.constructionTime
        }else{
            this.hp = 120
        }
    }

    canUpgrade(){
        if(this.underConstruction || this.isUpgrading || this.level >= this.maxLevel) return false
        if(this.productionQueue.length > 0) return false
        return this.owner.canAfford(this.upgradeCosts[this.level])
    }

    startUpgrade(){
        if(!this.canUpgrade()) return false
        if(!this.owner.spend(this.upgradeCosts[this.level])) return false
        this.isUpgrading = true
        this.upgradeProgress = 0
        this.upgradeDuration = this.upgradeTimes[this.level]
        this.game.sounds.playBuild()
        return true
    }

    update(dt){
        super.update(dt)
        if(this.isUpgrading){
            this.upgradeProgress += dt
            if(Math.random() < 0.2){
                this.game.particles.emit(this.x + 0.5, this.y + 0.5, '#9b59b6', 1, 0.8, 0.4, 2)
            }
            if(this.upgradeProgress >= this.upgradeDuration){
                this.isUpgrading = false
                this.level++
                if(this.level === 2){
                    this.maxHp = 1800
                    this.hp = Math.min(this.maxHp, this.hp + 600)
                }else if(this.level === 3){
                    this.maxHp = 2600
                    this.hp = Math.min(this.maxHp, this.hp + 800)
                }
                this.game.sounds.playSpawn()
                this.game.particles.emit(this.x + 0.5, this.y + 0.5, '#f1c40f', 15, 2.5, 0.6, 3)
            }
        }
    }
}

// ----------------------------------------------------
// Units (Worker, Infantry, Heavy) & Soft-Push Physics
// ----------------------------------------------------
class Unit {
    constructor(game, x, y, owner){
        this.game = game
        this.x = x
        this.y = y
        this.owner = owner
        this.selected = false
        this.path = []
        this.pathIndex = 0
        this.moveSpeed = 3
        this.radius = 0.28
        this.target = null
        this.targetType = null
        this.state = 'idle'
        this.hp = this.maxHp = 100
        this.repathTimer = 0
        this.aggroScanTimer = Math.random() * 0.5
    }

    get tileX(){
        return Math.floor(this.x)
    }

    get tileY(){
        return Math.floor(this.y)
    }

    setPath(path){
        this.path = path || []
        this.pathIndex = 0
        this.state = this.path.length ? 'moving' : 'idle'
    }

    // Step 2: Soft-separation physics to eliminate unit stacking
    applySeparation(dt){
        const searchRadius = 0.65
        let pushX = 0
        let pushY = 0

        for(const other of this.game.units){
            if(other === this || other.hp <= 0) continue
            const dx = this.x - other.x
            const dy = this.y - other.y
            const dist = Math.hypot(dx, dy)

            if(dist > 0.0001 && dist < searchRadius){
                const force = (searchRadius - dist) / searchRadius
                pushX += (dx / dist) * force
                pushY += (dy / dist) * force
            }
        }

        if(pushX !== 0 || pushY !== 0){
            const pushSpeed = 1.4 * dt
            const newX = this.x + pushX * pushSpeed
            const newY = this.y + pushY * pushSpeed
            const tX = Math.floor(newX)
            const tY = Math.floor(newY)

            if(this.game.map.inBounds(tX, tY)){
                const tile = this.game.map.getTile(tX, tY)
                if(tile && tile.isWalkable()){
                    this.x = newX
                    this.y = newY
                }
            }
        }
    }

    moveAlongPath(dt){
        if(this.pathIndex >= this.path.length){
            if(this.state === 'moving') this.state = 'idle'
            return true
        }

        const node = this.path[this.pathIndex]
        const tx = node.x + 0.5
        const ty = node.y + 0.5
        const dx = tx - this.x
        const dy = ty - this.y
        const dist = Math.hypot(dx, dy)

        if(dist < 0.08){
            this.x = tx
            this.y = ty
            this.pathIndex++
            return this.pathIndex >= this.path.length
        }

        const step = this.moveSpeed * dt
        this.x += (dx / dist) * Math.min(step, dist)
        this.y += (dy / dist) * Math.min(step, dist)
        return false
    }
}

class Worker extends Unit {
    constructor(game, x, y, owner){
        super(game, x, y, owner)
        this.type = UNIT_TYPES.WORKER
        this.maxHp = this.hp = 75
        this.moveSpeed = 2.8
        this.carrying = {type: null, amount: 0}
        this.workTarget = null
        this.returnTarget = null
        this.gatherTimer = 0
        this.damage = 6
        this.attackRange = 0.8
        this.attackCooldown = 0
        this.attackInterval = 1.1
    }

    get maxCarry(){
        const th = this.findTownHall()
        if(th && th.level === 3) return 80
        if(th && th.level === 2) return 65
        return 50
    }

    get gatherRateMultiplier(){
        const th = this.findTownHall()
        if(th && th.level === 3) return 1.4
        if(th && th.level === 2) return 1.2
        return 1.0
    }

    commandGather(tile){
        if(!tile || !tile.resourceType || tile.resourceAmount <= 0) return false
        this.workTarget = tile
        this.returnTarget = tile
        this.target = null
        this.carrying = {type: null, amount: 0}
        this.moveToTile(tile.x, tile.y)
        return true
    }

    moveToTile(x, y){
        const path = this.game.findPath(this.tileX, this.tileY, x, y, true)
        this.setPath(path)
    }

    findTownHall(){
        return this.owner.buildings.find(b => b.type === BUILDING_TYPES.TOWN_HALL && !b.underConstruction)
    }

    // Step 1: Autonomous resource relocation upon node depletion
    findNearbyResource(resourceType, originTile, radius = 7){
        let nearest = null
        let bestDist = Infinity
        for(let dy = -radius; dy <= radius; dy++){
            for(let dx = -radius; dx <= radius; dx++){
                const nx = originTile.x + dx
                const ny = originTile.y + dy
                const t = this.game.map.getTile(nx, ny)
                if(t && t.resourceType === resourceType && t.resourceAmount > 0){
                    const d = Math.hypot(this.x - (nx + 0.5), this.y - (ny + 0.5))
                    if(d < bestDist){
                        bestDist = d
                        nearest = t
                    }
                }
            }
        }
        return nearest
    }

    update(dt){
        this.applySeparation(dt)

        if(this.state === 'moving'){
            const arrived = this.moveAlongPath(dt)
            if(arrived && this.workTarget) this.state = 'gathering'
            return
        }

        if(this.state === 'gathering'){
            if(!this.workTarget || this.workTarget.resourceAmount <= 0){
                const rType = this.workTarget ? this.workTarget.resourceType : (this.carrying.type || 'wood')
                const nextTile = this.findNearbyResource(rType, this.workTarget || {x: this.tileX, y: this.tileY})
                if(nextTile){
                    this.commandGather(nextTile)
                }else{
                    this.workTarget = null
                    this.state = 'idle'
                }
                return
            }

            this.gatherTimer += dt * this.gatherRateMultiplier
            if(this.gatherTimer >= 1){
                this.gatherTimer = 0
                const amount = Math.min(10, this.workTarget.resourceAmount)
                this.workTarget.resourceAmount -= amount
                this.carrying.type = this.workTarget.resourceType
                this.carrying.amount += amount

                if(this.carrying.amount >= this.maxCarry || this.workTarget.resourceAmount <= 0){
                    const townHall = this.findTownHall()
                    if(townHall){
                        const oldTarget = this.workTarget
                        this.workTarget = null
                        this.moveToTile(townHall.x, townHall.y)
                        this.state = 'returning'
                        this.returnTarget = oldTarget
                    }else{
                        this.state = 'idle'
                    }
                }
            }
            return
        }

        if(this.state === 'returning'){
            const arrived = this.moveAlongPath(dt)
            if(arrived){
                if(this.carrying.type && this.carrying.amount){
                    this.owner.addResource(this.carrying.type, this.carrying.amount)
                }
                const returnedType = this.carrying.type
                this.carrying = {type: null, amount: 0}

                if(this.returnTarget && this.returnTarget.resourceAmount > 0){
                    this.workTarget = this.returnTarget
                    this.moveToTile(this.workTarget.x, this.workTarget.y)
                    this.state = 'moving'
                }else{
                    const nextTile = this.findNearbyResource(returnedType || 'wood', this.returnTarget || {x: this.tileX, y: this.tileY})
                    if(nextTile){
                        this.commandGather(nextTile)
                    }else{
                        this.returnTarget = null
                        this.state = 'idle'
                    }
                }
            }
        }
    }
}

class CombatUnit extends Unit {
    constructor(game, x, y, owner){
        super(game, x, y, owner)
        this.damage = 20
        this.attackRange = 1.2
        this.attackCooldown = 0
        this.attackInterval = 1.0
        this.aggroRange = 4.5
        this.lastTargetTile = {x: -1, y: -1}
    }

    commandMove(x, y){
        this.target = null
        this.targetType = null
        const path = this.game.findPath(this.tileX, this.tileY, x, y, false)
        this.setPath(path)
    }

    commandAttack(target){
        if(!target || target.owner === this.owner || target.hp <= 0) return
        this.target = target
        this.targetType = target instanceof Unit ? 'unit' : 'building'
        this.path = []
        this.pathIndex = 0
        this.state = 'attacking'
        this.repathTimer = 0
    }

    getTargetPosition(){
        if(this.target instanceof Unit) return {x: this.target.x, y: this.target.y}
        return {x: this.target.x + 0.5, y: this.target.y + 0.5}
    }

    getTargetRange(){
        return this.target instanceof Unit ? this.attackRange : this.attackRange + 0.35
    }

    // Step 2: 4.5-tile idle aggro scan
    scanForAggro(dt){
        this.aggroScanTimer -= dt
        if(this.aggroScanTimer > 0) return
        this.aggroScanTimer = 0.5

        if(this.state !== 'idle') return

        const candidates = [...this.game.units, ...this.game.buildings].filter(
            t => t.owner !== this.owner && t.hp > 0
        )

        let best = null
        let bestDist = this.aggroRange

        for(const c of candidates){
            const pos = c instanceof Unit ? {x: c.x, y: c.y} : {x: c.x + 0.5, y: c.y + 0.5}
            const dist = Math.hypot(pos.x - this.x, pos.y - this.y)
            if(dist <= bestDist){
                bestDist = dist
                best = c
            }
        }

        if(best){
            this.commandAttack(best)
        }
    }

    update(dt){
        this.applySeparation(dt)
        if(this.attackCooldown > 0) this.attackCooldown -= dt
        if(this.repathTimer > 0) this.repathTimer -= dt

        if(this.state === 'idle'){
            this.scanForAggro(dt)
            return
        }

        if(this.state === 'moving'){
            this.moveAlongPath(dt)
            return
        }

        if(this.state === 'attacking' || this.state === 'chasing'){
            if(!this.target || this.target.hp <= 0){
                this.target = null
                this.targetType = null
                this.state = 'idle'
                return
            }

            const pos = this.getTargetPosition()
            const dist = Math.hypot(pos.x - this.x, pos.y - this.y)
            const range = this.getTargetRange()

            if(dist > range){
                const tx = Math.floor(pos.x)
                const ty = Math.floor(pos.y)

                // Step 2: Throttled chase pathfinding
                if(this.repathTimer <= 0 && (tx !== this.lastTargetTile.x || ty !== this.lastTargetTile.y || this.path.length === 0)){
                    this.repathTimer = 0.35
                    this.lastTargetTile = {x: tx, y: ty}
                    const path = this.game.findPath(this.tileX, this.tileY, tx, ty, false)
                    if(path && path.length){
                        this.path = path
                        this.pathIndex = 0
                        this.state = 'chasing'
                    }else{
                        this.state = 'idle'
                    }
                }

                if(this.state === 'chasing'){
                    this.moveAlongPath(dt)
                }
                return
            }

            this.state = 'attacking'
            if(this.attackCooldown <= 0){
                this.performAttack(this.target)
                this.attackCooldown = this.attackInterval
            }
        }
    }

    performAttack(target){
        this.game.combat.attack(this, target)
    }
}
