// ----------------------------------------------------
// Step 3: Combat System & Rock-Paper-Scissors Matrix
// ----------------------------------------------------
class CombatSystem {
    constructor(game){
        this.game = game
        this.damageLog = []
        this.projectiles = []
    }

    launchProjectile(attacker, targetX, targetY, targetRef){
        this.game.sounds.playCannonFire()
        this.projectiles.push({
            attacker,
            startX: attacker.x,
            startY: attacker.y,
            targetX,
            targetY,
            targetRef,
            progress: 0,
            duration: 0.55
        })
    }

    attack(attacker, target){
        if(!attacker || !target || target.hp <= 0) return
        if(attacker.owner === target.owner) return

        let damage = attacker.damage || 10

        // Step 3: Explicit Rock-Paper-Scissors Matrix
        if(attacker.type === UNIT_TYPES.HEAVY && target instanceof Building){
            damage *= 1.75 // Siege bonus vs structures
        }else if(attacker.type === UNIT_TYPES.INFANTRY && target.type === UNIT_TYPES.HEAVY){
            damage *= 1.30 // Infantry flanks and counters Heavy
        }else if(attacker.type === UNIT_TYPES.HEAVY && target.type === UNIT_TYPES.INFANTRY){
            damage *= 1.15 // Concussive shell hits infantry
        }else if(target instanceof Building){
            damage *= 0.75 // General resistance vs light arms
        }

        damage = Math.round(damage)
        target.hp -= damage
        this.game.sounds.playAttackHit()

        const tx = target instanceof Unit ? target.x : target.x + 0.5
        const ty = target instanceof Unit ? target.y : target.y + 0.5
        this.game.particles.emit(tx, ty, target instanceof Unit ? '#e74c3c' : '#f39c12', 6, 1.8, 0.35, 2.5)

        this.damageLog.push({x: tx, y: ty, amount: damage, time: 1.0})

        // Step 2 & 5: Offscreen alert and idle auto-retaliate
        if(target.owner === this.game.player){
            this.game.particles.addMinimapPing(Math.floor(tx), Math.floor(ty))
            this.game.sounds.playAttackAlert(this.game.gameTime)
        }

        if(target instanceof CombatUnit && target.state === 'idle'){
            target.commandAttack(attacker)
        }

        if(target.hp <= 0){
            if(attacker && attacker.owner) attacker.owner.stats.enemiesKilled++
            this.destroy(target)
        }
    }

    destroy(target){
        target.hp = 0
        const tx = target instanceof Unit ? target.x : target.x + 0.5
        const ty = target instanceof Unit ? target.y : target.y + 0.5
        this.game.particles.emit(tx, ty, '#ff4757', 16, 2.5, 0.6, 3)

        if(target instanceof Unit){
            target.state = 'dead'
            target.target = null
        }

        if(target instanceof Building){
            const tile = this.game.map.getTile(target.x, target.y)
            if(tile && tile.building === target) tile.building = null

            const index = target.owner.buildings.indexOf(target)
            if(index >= 0) target.owner.buildings.splice(index, 1)

            const globalIndex = this.game.buildings.indexOf(target)
            if(globalIndex >= 0) this.game.buildings.splice(globalIndex, 1)

            // Step 3: HQ Win Condition
            if(target.type === BUILDING_TYPES.TOWN_HALL){
                target.owner.defeated = true
            }
        }
    }

    update(dt){
        for(const hit of this.damageLog) hit.time -= dt
        this.damageLog = this.damageLog.filter(hit => hit.time > 0)

        // Projectile ballistics
        for(const p of this.projectiles){
            p.progress += dt / p.duration
            if(p.progress >= 1){
                this.game.sounds.playCannonImpact()
                this.game.particles.emit(p.targetX, p.targetY, '#f59e0b', 12, 2.2, 0.45, 3)

                // Splash damage on impact point
                const radius = 1.1
                const targets = [...this.game.units, ...this.game.buildings].filter(
                    t => t.owner !== p.attacker.owner && t.hp > 0
                )

                for(const t of targets){
                    const tx = t instanceof Unit ? t.x : t.x + 0.5
                    const ty = t instanceof Unit ? t.y : t.y + 0.5
                    const dist = Math.hypot(tx - p.targetX, ty - p.targetY)
                    if(dist <= radius){
                        const falloff = 1 - (dist / radius) * 0.4
                        const dmg = Math.round((p.attacker.damage || 45) * falloff)
                        t.hp -= dmg
                        this.damageLog.push({x: tx, y: ty, amount: dmg, time: 1.0})
                        if(t.hp <= 0){
                            p.attacker.owner.stats.enemiesKilled++
                            this.destroy(t)
                        }
                    }
                }
            }
        }
        this.projectiles = this.projectiles.filter(p => p.progress < 1)
    }

    drawProjectiles(ctx){
        for(const p of this.projectiles){
            const curX = p.startX + (p.targetX - p.startX) * p.progress
            const curY = p.startY + (p.targetY - p.startY) * p.progress
            const arcHeight = Math.sin(p.progress * Math.PI) * 1.5

            ctx.save()
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,.3)'
            ctx.beginPath()
            ctx.arc(curX * TILE_SIZE, curY * TILE_SIZE, 3, 0, Math.PI * 2)
            ctx.fill()

            // Projectile
            ctx.fillStyle = '#1e293b'
            ctx.strokeStyle = '#f59e0b'
            ctx.lineWidth = 1.5
            ctx.beginPath()
            ctx.arc(curX * TILE_SIZE, (curY - arcHeight) * TILE_SIZE, 4.5, 0, Math.PI * 2)
            ctx.fill()
            ctx.stroke()
            ctx.restore()
        }
    }
}

// ----------------------------------------------------
// Building System & Production
// ----------------------------------------------------
class BuildingSystem {
    constructor(game){
        this.game = game
        this.costs = {
            [BUILDING_TYPES.TOWN_HALL]: {wood: 150, gold: 100},
            [BUILDING_TYPES.BARRACKS]: {wood: 120, gold: 50},
            [BUILDING_TYPES.FARM]: {wood: 70},
            [BUILDING_TYPES.MINE]: {wood: 100}
        }
    }

    // Step 1: Collision check preventing builds on FOREST or WATER
    canPlace(type, x, y, player, checkRadius = true){
        const map = this.game.map
        if(!map.inBounds(x, y)) return false
        const tile = map.getTile(x, y)
        if(!tile || tile.building) return false

        // Impassable terrain check
        if(tile.type === TILE_TYPES.WATER) return false
        if(tile.type === TILE_TYPES.FOREST) return false

        // Gold vein check: only Mine can be placed on gold
        if(type === BUILDING_TYPES.MINE){
            if(tile.type !== TILE_TYPES.GOLD) return false
        }else{
            if(tile.type === TILE_TYPES.GOLD) return false
        }

        const occupiedByUnit = this.game.units.some(u => u.hp > 0 && u.tileX === x && u.tileY === y)
        if(occupiedByUnit) return false

        if(checkRadius){
            let nearExisting = false
            for(const b of player.buildings){
                const d = Math.hypot(b.x - x, b.y - y)
                if(d <= MAX_BUILD_DISTANCE){
                    nearExisting = true
                    break
                }
            }
            if(!nearExisting) return false
        }
        return true
    }

    create(type, x, y, owner, ignoreRadius = false){
        if(!this.canPlace(type, x, y, owner, !ignoreRadius)) return null
        const cost = this.costs[type]
        if(!owner.spend(cost)) return null

        let building = null
        if(type === BUILDING_TYPES.TOWN_HALL) building = new TownHall(this.game, x, y, owner)
        if(type === BUILDING_TYPES.BARRACKS) building = new Barracks(this.game, x, y, owner)
        if(type === BUILDING_TYPES.FARM) building = new Farm(this.game, x, y, owner)
        if(type === BUILDING_TYPES.MINE) building = new Mine(this.game, x, y, owner)

        if(!building) return null

        owner.buildings.push(building)
        owner.stats.buildingsBuilt++
        this.game.map.getTile(x, y).building = building
        this.game.sounds.playBuild()
        return building
    }
}

class ProductionSystem {
    constructor(game){
        this.game = game
        this.times = {
            [UNIT_TYPES.WORKER]: 5,
            [UNIT_TYPES.INFANTRY]: 6,
            [UNIT_TYPES.HEAVY]: 9
        }
        this.costs = {
            [UNIT_TYPES.WORKER]: {food: 50},
            [UNIT_TYPES.INFANTRY]: {food: 50, gold: 25},
            [UNIT_TYPES.HEAVY]: {food: 90, gold: 75, wood: 50}
        }
    }

    queue(building, type){
        if(!building || building.underConstruction || building.isUpgrading) return false
        if(type === UNIT_TYPES.WORKER && building.type !== BUILDING_TYPES.TOWN_HALL) return false
        if((type === UNIT_TYPES.INFANTRY || type === UNIT_TYPES.HEAVY) && building.type !== BUILDING_TYPES.BARRACKS) return false

        const owner = building.owner
        if(owner.population + owner.queuedUnitsCount >= owner.maxPopulation) return false
        if(!owner.spend(this.costs[type])) return false

        building.productionQueue.push(type)
        this.game.sounds.playOrderConfirmation()
        return true
    }

    update(dt){
        for(const player of [this.game.player, this.game.enemy]){
            const th = player.buildings.find(b => b.type === BUILDING_TYPES.TOWN_HALL && !b.underConstruction)
            const speedBoost = th ? (th.level === 3 ? 1.5 : (th.level === 2 ? 1.25 : 1.0)) : 1.0

            for(const building of player.buildings){
                if(building.underConstruction || building.isUpgrading) continue
                if(!building.productionQueue.length) continue

                building.productionProgress += dt * speedBoost
                const type = building.productionQueue[0]

                if(building.productionProgress >= this.times[type]){
                    building.productionProgress = 0
                    building.productionQueue.shift()
                    this.spawn(building, type)
                }
            }
        }
    }

    spawn(building, type){
        const spots = [
            [building.x + 1, building.y],
            [building.x - 1, building.y],
            [building.x, building.y + 1],
            [building.x, building.y - 1],
            [building.x + 1, building.y + 1],
            [building.x - 1, building.y - 1],
            [building.x + 1, building.y - 1],
            [building.x - 1, building.y + 1]
        ]

        let spawn = null
        for(const [x, y] of spots){
            const tile = this.game.map.getTile(x, y)
            if(tile && tile.isWalkable()){
                spawn = {x: x + 0.5, y: y + 0.5}
                break
            }
        }

        if(!spawn) spawn = {x: building.x + 0.5, y: building.y + 0.5}

        let unit = null
        if(type === UNIT_TYPES.WORKER){
            unit = new Worker(this.game, spawn.x, spawn.y, building.owner)
            building.owner.stats.workersCreated++
        }
        if(type === UNIT_TYPES.INFANTRY){
            unit = new Infantry(this.game, spawn.x, spawn.y, building.owner)
            building.owner.stats.infantryCreated++
        }
        if(type === UNIT_TYPES.HEAVY){
            unit = new Heavy(this.game, spawn.x, spawn.y, building.owner)
            building.owner.stats.heavyCreated++
        }

        if(unit){
            building.owner.units.push(unit)
            this.game.units.push(unit)
            if(building.owner === this.game.player){
                this.game.sounds.playSpawn()
            }
        }
    }
}

// ----------------------------------------------------
// Camera & Viewport
// ----------------------------------------------------
class Camera {
    constructor(){
        this.x = 0
        this.y = 0
        this.zoom = 1
    }

    update(dt, input){
        const speed = 550 * dt / this.zoom
        if(input.keys.has('w') || input.keys.has('arrowup')) this.y -= speed
        if(input.keys.has('s') || input.keys.has('arrowdown')) this.y += speed
        if(input.keys.has('a') || input.keys.has('arrowleft')) this.x -= speed
        if(input.keys.has('d') || input.keys.has('arrowright')) this.x += speed
        this.clamp()
    }

    clamp(){
        this.x = Math.max(0, Math.min(this.x, MAP_WIDTH * TILE_SIZE - canvas.width / this.zoom))
        this.y = Math.max(0, Math.min(this.y, MAP_HEIGHT * TILE_SIZE - canvas.height / this.zoom))
    }

    screenToWorld(sx, sy){
        return {
            x: sx / this.zoom + this.x,
            y: sy / this.zoom + this.y
        }
    }

    screenToTile(sx, sy){
        const p = this.screenToWorld(sx, sy)
        return {
            x: Math.floor(p.x / TILE_SIZE),
            y: Math.floor(p.y / TILE_SIZE)
        }
    }

    apply(context){
        context.scale(this.zoom, this.zoom)
        context.translate(-this.x, -this.y)
    }

    zoomAt(sx, sy, delta){
        const before = this.screenToWorld(sx, sy)
        this.zoom *= delta
        this.zoom = Math.max(0.65, Math.min(2.1, this.zoom))
        const after = this.screenToWorld(sx, sy)
        this.x += before.x - after.x
        this.y += before.y - after.y
        this.clamp()
    }

    centerOn(tileX, tileY){
        this.x = (tileX + 0.5) * TILE_SIZE - canvas.width / (2 * this.zoom)
        this.y = (tileY + 0.5) * TILE_SIZE - canvas.height / (2 * this.zoom)
        this.clamp()
    }
}

// ----------------------------------------------------
// Input System & Unified Context Commands
// ----------------------------------------------------
class Input {
    constructor(game){
        this.game = game
        this.keys = new Set()
        this.mouseX = 0
        this.mouseY = 0
        this.isMouseDown = false
        this.dragStart = null
        this.isDragging = false

        this.touchStartTime = 0
        this.touchStartPos = {x: 0, y: 0}
        this.longPressTimer = null
        this.isBoxSelecting = false
        this.touchPinchDist = 0
        this.hasMovedSignificant = false

        this.setupKeyboard()
        this.setupMouse()
        this.setupTouch()
        this.setupUIButtons()
    }

    setupKeyboard(){
        addEventListener('keydown', e => {
            this.game.sounds.init()
            this.keys.add(e.key.toLowerCase())

            if(e.ctrlKey && ['1', '2', '3', '4'].includes(e.key)){
                e.preventDefault()
                this.game.assignControlGroup(parseInt(e.key))
                return
            }

            if(e.key === '1') this.game.setBuildMode(BUILDING_TYPES.TOWN_HALL)
            if(e.key === '2') this.game.setBuildMode(BUILDING_TYPES.BARRACKS)
            if(e.key === '3') this.game.setBuildMode(BUILDING_TYPES.FARM)
            if(e.key === '4') this.game.setBuildMode(BUILDING_TYPES.MINE)
            if(e.key.toLowerCase() === 'q') this.game.queueSelectedWorker()
            if(e.key.toLowerCase() === 'w') this.game.queueSelectedInfantry()
            if(e.key.toLowerCase() === 'e') this.game.queueSelectedHeavy()
            if(e.key.toLowerCase() === 'u') this.game.upgradeSelectedTownHall()
            if(e.key === 'Escape') this.game.setBuildMode(null)
        })

        addEventListener('keyup', e => {
            this.keys.delete(e.key.toLowerCase())
        })
    }

    setupMouse(){
        canvas.addEventListener('mousedown', e => {
            this.game.sounds.init()
            if(e.button === 0){
                this.isMouseDown = true
                this.dragStart = {x: e.clientX, y: e.clientY}
                this.isDragging = false
            }
        })

        canvas.addEventListener('mousemove', e => {
            this.mouseX = e.clientX
            this.mouseY = e.clientY
            if(this.isMouseDown && this.dragStart){
                const dist = Math.hypot(e.clientX - this.dragStart.x, e.clientY - this.dragStart.y)
                if(dist > 6) this.isDragging = true
            }
        })

        canvas.addEventListener('mouseup', e => {
            if(e.button === 0 && this.isMouseDown){
                if(this.isDragging && this.dragStart){
                    this.game.handleBoxSelection(this.dragStart.x, this.dragStart.y, e.clientX, e.clientY)
                }else{
                    this.game.handleLeftClick(e.clientX, e.clientY)
                }
                this.isMouseDown = false
                this.isDragging = false
                this.dragStart = null
            }
        })

        canvas.addEventListener('contextmenu', e => {
            e.preventDefault()
            this.game.handleRightClick(e.clientX, e.clientY)
        })

        canvas.addEventListener('wheel', e => {
            this.game.camera.zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.89)
        }, {passive: true})
    }

    setupTouch(){
        canvas.addEventListener('touchstart', e => {
            this.game.sounds.init()
            if(e.touches.length === 1){
                const t = e.touches[0]
                this.touchStartTime = performance.now()
                this.touchStartPos = {x: t.clientX, y: t.clientY}
                this.mouseX = t.clientX
                this.mouseY = t.clientY
                this.hasMovedSignificant = false
                this.isBoxSelecting = false

                clearTimeout(this.longPressTimer)
                this.longPressTimer = setTimeout(() => {
                    if(!this.hasMovedSignificant){
                        this.isBoxSelecting = true
                        this.dragStart = {x: this.touchStartPos.x, y: this.touchStartPos.y}
                        this.isDragging = true
                        if(navigator.vibrate) navigator.vibrate(30)
                    }
                }, 280)
            }else if(e.touches.length === 2){
                clearTimeout(this.longPressTimer)
                this.isBoxSelecting = false
                this.isDragging = false
                this.dragStart = null
                const dx = e.touches[0].clientX - e.touches[1].clientX
                const dy = e.touches[0].clientY - e.touches[1].clientY
                this.touchPinchDist = Math.hypot(dx, dy)
            }
        }, {passive: false})

        canvas.addEventListener('touchmove', e => {
            e.preventDefault()
            if(e.touches.length === 1){
                const t = e.touches[0]
                const dx = t.clientX - this.mouseX
                const dy = t.clientY - this.mouseY
                this.mouseX = t.clientX
                this.mouseY = t.clientY

                if(Math.hypot(t.clientX - this.touchStartPos.x, t.clientY - this.touchStartPos.y) > 10){
                    this.hasMovedSignificant = true
                }

                if(this.isBoxSelecting){
                    this.isDragging = true
                }else{
                    clearTimeout(this.longPressTimer)
                    this.game.camera.x -= dx / this.game.camera.zoom
                    this.game.camera.y -= dy / this.game.camera.zoom
                    this.game.camera.clamp()
                }
            }else if(e.touches.length === 2){
                const dx = e.touches[0].clientX - e.touches[1].clientX
                const dy = e.touches[0].clientY - e.touches[1].clientY
                const dist = Math.hypot(dx, dy)
                if(this.touchPinchDist > 0){
                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2
                    const delta = dist / this.touchPinchDist
                    this.game.camera.zoomAt(midX, midY, delta)
                }
                this.touchPinchDist = dist
            }
        }, {passive: false})

        canvas.addEventListener('touchend', e => {
            clearTimeout(this.longPressTimer)
            if(this.isBoxSelecting && this.dragStart){
                this.game.handleBoxSelection(this.dragStart.x, this.dragStart.y, this.mouseX, this.mouseY)
                this.isBoxSelecting = false
                this.isDragging = false
                this.dragStart = null
                return
            }

            const duration = performance.now() - this.touchStartTime
            if(duration < 280 && !this.hasMovedSignificant){
                const sx = this.touchStartPos.x
                const sy = this.touchStartPos.y

                if(this.game.buildMode){
                    this.game.handleLeftClick(sx, sy)
                }else if(this.game.selectedGroup.size > 0 || (this.game.selected instanceof Unit && this.game.selected.owner === this.game.player)){
                    this.game.handleRightClick(sx, sy)
                }else{
                    this.game.handleLeftClick(sx, sy)
                }
            }
        }, {passive: false})

        minimapCanvas.addEventListener('pointerdown', e => this.handleMinimap(e))
        minimapCanvas.addEventListener('pointermove', e => {if(e.buttons === 1) this.handleMinimap(e)})
    }

    setupUIButtons(){
        btnBuildTh.onclick = () => this.game.setBuildMode(BUILDING_TYPES.TOWN_HALL)
        btnBuildBarracks.onclick = () => this.game.setBuildMode(BUILDING_TYPES.BARRACKS)
        btnBuildFarm.onclick = () => this.game.setBuildMode(BUILDING_TYPES.FARM)
        btnBuildMine.onclick = () => this.game.setBuildMode(BUILDING_TYPES.MINE)
        btnTrainWorker.onclick = () => this.game.queueSelectedWorker()
        btnTrainWarrior.onclick = () => this.game.queueSelectedInfantry()
        btnTrainHeavy.onclick = () => this.game.queueSelectedHeavy()
        btnUpgrade.onclick = () => this.game.upgradeSelectedTownHall()

        for(let i = 1; i <= 4; i++){
            document.getElementById(`gb-${i}`).onclick = () => this.game.selectControlGroup(i)
        }
    }

    handleMinimap(e){
        this.game.sounds.init()
        const rect = minimapCanvas.getBoundingClientRect()
        const mx = e.clientX - rect.left
        const my = e.clientY - rect.top
        const mapX = (mx / rect.width) * MAP_WIDTH * TILE_SIZE
        const mapY = (my / rect.height) * MAP_HEIGHT * TILE_SIZE
        this.game.camera.x = mapX - canvas.width / (2 * this.game.camera.zoom)
        this.game.camera.y = mapY - canvas.height / (2 * this.game.camera.zoom)
        this.game.camera.clamp()
    }
}

// ----------------------------------------------------
// Step 4: 3-Stage Skirmish AI
// ----------------------------------------------------
class SkirmishAI {
    constructor(game){
        this.game = game
        this.stage = 1
        this.timer = 0
        this.waveTimer = 0
        this.waveInterval = 38
        this.buildTimer = 0
        this.stagedUnits = []
    }

    getRallyPoint(){
        return {x: MAP_WIDTH - 22, y: MAP_HEIGHT - 20}
    }

    update(dt){
        this.timer += dt
        this.waveTimer += dt
        this.buildTimer += dt

        const enemy = this.game.enemy
        const townHall = enemy.buildings.find(b => b.type === BUILDING_TYPES.TOWN_HALL)
        if(!townHall){
            enemy.defeated = true
            return
        }

        // Determine AI Stage
        if(this.timer < 90) this.stage = 1
        else if(this.timer < 180) this.stage = 2
        else this.stage = 3

        const workers = enemy.units.filter(u => u.type === UNIT_TYPES.WORKER)
        const warriors = enemy.units.filter(u => u.type === UNIT_TYPES.INFANTRY)
        const heavies = enemy.units.filter(u => u.type === UNIT_TYPES.HEAVY)
        const combatants = [...warriors, ...heavies]
        const barracks = enemy.buildings.find(b => b.type === BUILDING_TYPES.BARRACKS && !b.underConstruction)

        // Step 4 Base Defense Reflex: Check for intruders within 12 tiles of enemy base
        const intruders = [...this.game.player.units, ...this.game.player.buildings].filter(e => {
            if(e.hp <= 0) return false
            const ex = e instanceof Unit ? e.x : e.x + 0.5
            const ey = e instanceof Unit ? e.y : e.y + 0.5
            return Math.hypot(ex - (townHall.x + 0.5), ey - (townHall.y + 0.5)) <= 13
        })

        if(intruders.length > 0){
            const primeThreat = intruders[0]
            for(const soldier of combatants){
                if(soldier.state !== 'attacking') soldier.commandAttack(primeThreat)
            }
            return // Dedicate resources to defense first
        }

        // Worker gathering automation
        for(const worker of workers){
            if(worker.state === 'idle'){
                const resource = this.game.findNearestResource(worker.tileX, worker.tileY)
                if(resource) worker.commandGather(resource)
            }
        }

        // --- STAGE 1: Economy (0:00 - 1:30) ---
        if(this.stage >= 1){
            if(workers.length < 4 && townHall && !townHall.underConstruction && !townHall.isUpgrading){
                if(townHall.productionQueue.length < 1 && enemy.resources.food >= 50){
                    this.game.productionSystem.queue(townHall, UNIT_TYPES.WORKER)
                }
            }

            // Automated gold mine
            if(enemy.resources.wood >= 100 && this.buildTimer > 4){
                const goldTile = this.game.findNearestResource(townHall.x, townHall.y, 'gold')
                if(goldTile && this.game.buildingSystem.canPlace(BUILDING_TYPES.MINE, goldTile.x, goldTile.y, enemy, false)){
                    const b = this.game.buildingSystem.create(BUILDING_TYPES.MINE, goldTile.x, goldTile.y, enemy, true)
                    if(b) this.game.buildings.push(b)
                }
            }

            // Farm when near population cap
            if(enemy.population + enemy.queuedUnitsCount >= enemy.maxPopulation - 2 && enemy.resources.wood >= 70){
                const spots = this.game.getBuildSpotsNear(townHall, BUILDING_TYPES.FARM, enemy)
                if(spots.length){
                    const b = this.game.buildingSystem.create(BUILDING_TYPES.FARM, spots[0].x, spots[0].y, enemy, true)
                    if(b) this.game.buildings.push(b)
                }
            }
        }

        // --- STAGE 2: Militarization (1:30 - 3:00) ---
        if(this.stage >= 2){
            const pendingBarracks = enemy.buildings.find(b => b.type === BUILDING_TYPES.BARRACKS)
            if(!pendingBarracks && enemy.resources.wood >= 120 && enemy.resources.gold >= 50){
                const spots = this.game.getBuildSpotsNear(townHall, BUILDING_TYPES.BARRACKS, enemy)
                if(spots.length){
                    const b = this.game.buildingSystem.create(BUILDING_TYPES.BARRACKS, spots[0].x, spots[0].y, enemy, true)
                    if(b) this.game.buildings.push(b)
                }
            }

            // Town hall tech upgrade
            if(townHall && !townHall.underConstruction && !townHall.isUpgrading && townHall.level < townHall.maxLevel){
                const cost = townHall.upgradeCosts[townHall.level]
                if(enemy.resources.wood >= cost.wood + 60 && enemy.resources.gold >= cost.gold + 40){
                    townHall.startUpgrade()
                }
            }

            // Train military units continuously
            if(barracks && barracks.productionQueue.length < 2){
                if(this.stage === 3 && enemy.resources.food >= 90 && enemy.resources.gold >= 75 && enemy.resources.wood >= 50){
                    this.game.productionSystem.queue(barracks, UNIT_TYPES.HEAVY)
                }else if(enemy.resources.food >= 50 && enemy.resources.gold >= 25){
                    this.game.productionSystem.queue(barracks, UNIT_TYPES.INFANTRY)
                }
            }
        }

        // --- STAGE 3: Wave Assault Phase (3:00+) ---
        if(this.stage >= 3){
            const rally = this.getRallyPoint()

            // Rally idle combat units at staging ground
            for(const soldier of combatants){
                if(soldier.state === 'idle'){
                    const distToRally = Math.hypot(soldier.x - rally.x, soldier.y - rally.y)
                    if(distToRally > 3){
                        soldier.commandMove(rally.x, rally.y)
                    }
                }
            }

            // Launch synchronized assault wave
            if(this.waveTimer >= this.waveInterval || combatants.length >= 6){
                this.waveTimer = 0
                if(combatants.length >= 3){
                    const target = this.game.choosePlayerTarget(combatants)
                    if(target){
                        for(const soldier of combatants){
                            soldier.commandAttack(target)
                        }
                    }
                }
            }
        }
    }
}

// ----------------------------------------------------
// Renderer (Crisp Retro HUD, Selection, Minimap)
// ----------------------------------------------------
class Renderer {
    constructor(game){
        this.game = game
    }

    draw(){
        ctx.setTransform(1, 0, 0, 1, 0, 0)
        ctx.fillStyle = '#090d14'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        ctx.save()
        this.game.camera.apply(ctx)

        this.drawMap()
        this.drawBuildZones()
        this.drawPaths()
        this.drawBuildings()
        this.drawUnits()
        this.drawHover()
        this.game.combat.drawProjectiles(ctx)
        this.game.particles.draw(ctx)
        this.drawDamageNumbers()

        ctx.restore()

        this.drawSelectionBox()
        this.drawMinimap()
        this.updateHUD()
    }

    drawMap(){
        const map = this.game.map
        const cam = this.game.camera
        const startX = Math.max(0, Math.floor(cam.x / TILE_SIZE))
        const endX = Math.min(map.width - 1, Math.ceil((cam.x + canvas.width / cam.zoom) / TILE_SIZE))
        const startY = Math.max(0, Math.floor(cam.y / TILE_SIZE))
        const endY = Math.min(map.height - 1, Math.ceil((cam.y + canvas.height / cam.zoom) / TILE_SIZE))

        for(let y = startY; y <= endY; y++){
            for(let x = startX; x <= endX; x++){
                const tile = map.tiles[y][x]
                let color = COLORS.land

                if(tile.type === TILE_TYPES.WATER) color = COLORS.water
                if(tile.type === TILE_TYPES.FOREST) color = COLORS.forest
                if(tile.type === TILE_TYPES.GOLD) color = COLORS.gold

                ctx.fillStyle = color
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE)

                ctx.strokeStyle = COLORS.landGrid
                ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE)

                if(tile.type === TILE_TYPES.FOREST){
                    ctx.fillStyle = COLORS.forestTree
                    ctx.beginPath()
                    ctx.arc(x * TILE_SIZE + 10, y * TILE_SIZE + 17, 7, 0, Math.PI * 2)
                    ctx.arc(x * TILE_SIZE + 20, y * TILE_SIZE + 13, 8, 0, Math.PI * 2)
                    ctx.arc(x * TILE_SIZE + 25, y * TILE_SIZE + 20, 6, 0, Math.PI * 2)
                    ctx.fill()
                }

                if(tile.type === TILE_TYPES.GOLD){
                    ctx.fillStyle = COLORS.goldRock
                    ctx.beginPath()
                    ctx.arc(x * TILE_SIZE + 16, y * TILE_SIZE + 16, 6.5, 0, Math.PI * 2)
                    ctx.fill()
                }
            }
        }
    }

    drawBuildZones(){
        if(!this.game.buildMode) return
        ctx.fillStyle = COLORS.buildZone
        for(const b of this.game.player.buildings){
            ctx.beginPath()
            ctx.arc((b.x + 0.5) * TILE_SIZE, (b.y + 0.5) * TILE_SIZE, MAX_BUILD_DISTANCE * TILE_SIZE, 0, Math.PI * 2)
            ctx.fill()
        }
    }

    drawBuildings(){
        for(const building of this.game.buildings){
            const x = building.x * TILE_SIZE
            const y = building.y * TILE_SIZE
            const isSelected = this.game.selected === building

            if(isSelected){
                ctx.strokeStyle = COLORS.selected
                ctx.lineWidth = 2.5
                ctx.strokeRect(x - 2, y - 2, TILE_SIZE + 4, TILE_SIZE + 4)
                ctx.lineWidth = 1
            }

            ctx.fillStyle = building.owner.team === 1 ? COLORS.player : COLORS.enemy

            if(building.type === BUILDING_TYPES.TOWN_HALL){
                ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4)
                ctx.fillStyle = building.level === 3 ? '#f1c40f' : (building.level === 2 ? '#ecf0f1' : '#94a3b8')
                ctx.fillRect(x + 8, y + 8, 16, 16)
                if(building.level >= 2){
                    ctx.strokeStyle = '#f59e0b'
                    ctx.strokeRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10)
                }
            }

            if(building.type === BUILDING_TYPES.BARRACKS){
                ctx.fillRect(x + 4, y + 5, TILE_SIZE - 8, TILE_SIZE - 9)
                ctx.fillStyle = '#1e293b'
                ctx.fillRect(x + 10, y + 10, 12, 16)
            }

            if(building.type === BUILDING_TYPES.FARM){
                ctx.fillRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6)
                ctx.strokeStyle = '#e5c17c'
                for(let i = 0; i < 4; i++) ctx.strokeRect(x + 6 + i * 5, y + 6, 3, 20)
                ctx.fillStyle = '#22c55e'
                ctx.fillRect(x + 5, y + 6, TILE_SIZE - 10, 4)
            }

            if(building.type === BUILDING_TYPES.MINE){
                ctx.fillRect(x + 4, y + 6, TILE_SIZE - 8, TILE_SIZE - 10)
                ctx.fillStyle = '#0f172a'
                ctx.beginPath()
                ctx.arc(x + 16, y + 16, 8, 0, Math.PI * 2)
                ctx.fill()
                ctx.fillStyle = '#f59e0b'
                ctx.fillRect(x + 12, y + 12, 8, 8)
            }

            if(building.underConstruction){
                ctx.fillStyle = 'rgba(15,23,42,.75)'
                ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4)
                const p = building.constructionProgress / building.constructionTime
                this.bar(x, y + TILE_SIZE - 6, TILE_SIZE, p, '#38bdf8')
            }else if(building.isUpgrading){
                const p = building.upgradeProgress / building.upgradeDuration
                this.bar(x, y + TILE_SIZE - 6, TILE_SIZE, p, '#a855f7')
            }

            this.bar(x, y - 5, TILE_SIZE, building.hp / building.maxHp, building.owner.team === 1 ? '#22c55e' : '#f43f5e')
        }
    }

    drawUnits(){
        for(const unit of this.game.units){
            const x = unit.x * TILE_SIZE
            const y = unit.y * TILE_SIZE
            const isSelected = this.game.selectedGroup.has(unit) || (this.game.selected === unit)

            if(isSelected){
                ctx.strokeStyle = COLORS.selected
                ctx.lineWidth = 1.8
                ctx.beginPath()
                ctx.arc(x, y, 14, 0, Math.PI * 2)
                ctx.stroke()
                ctx.lineWidth = 1
            }

            ctx.fillStyle = unit.owner.team === 1 ? COLORS.player : COLORS.enemy

            if(unit.type === UNIT_TYPES.WORKER){
                ctx.beginPath()
                ctx.arc(x, y, 7, 0, Math.PI * 2)
                ctx.fill()
            }

            if(unit.type === UNIT_TYPES.INFANTRY){
                ctx.beginPath()
                ctx.moveTo(x, y - 10)
                ctx.lineTo(x + 9, y + 7)
                ctx.lineTo(x - 9, y + 7)
                ctx.closePath()
                ctx.fill()
            }

            if(unit.type === UNIT_TYPES.HEAVY){
                ctx.fillRect(x - 9, y - 9, 18, 18)
                ctx.fillStyle = '#0f172a'
                ctx.fillRect(x - 5, y - 5, 10, 10)
                ctx.fillStyle = unit.owner.team === 1 ? COLORS.playerLight : COLORS.enemyLight
                ctx.fillRect(x - 2, y - 13, 4, 9)
            }

            this.bar(x - 10, y - 15, 20, unit.hp / unit.maxHp, unit.owner.team === 1 ? '#22c55e' : '#f43f5e')

            if(unit.carrying && unit.carrying.amount > 0){
                ctx.fillStyle = '#fff'
                ctx.font = 'bold 9px sans-serif'
                ctx.textAlign = 'center'
                ctx.fillText(unit.carrying.amount, x, y + 19)
            }
        }
    }

    drawPaths(){
        for(const unit of this.game.selectedGroup){
            if(!unit.path || !unit.path.length) continue
            ctx.strokeStyle = 'rgba(255,228,92,.4)'
            ctx.lineWidth = 1.5
            ctx.beginPath()
            ctx.moveTo(unit.x * TILE_SIZE, unit.y * TILE_SIZE)
            for(let i = unit.pathIndex; i < unit.path.length; i++){
                ctx.lineTo((unit.path[i].x + 0.5) * TILE_SIZE, (unit.path[i].y + 0.5) * TILE_SIZE)
            }
            ctx.stroke()
            ctx.lineWidth = 1
        }
    }

    drawDamageNumbers(){
        for(const hit of this.game.combat.damageLog){
            const alpha = Math.max(0, hit.time)
            ctx.fillStyle = `rgba(255,235,80,${alpha})`
            ctx.font = 'bold 13px sans-serif'
            ctx.textAlign = 'center'
            ctx.fillText(`-${hit.amount}`, hit.x * TILE_SIZE, hit.y * TILE_SIZE - 18 - (1 - hit.time) * 16)
        }
    }

    drawHover(){
        const t = this.game.camera.screenToTile(this.game.input.mouseX, this.game.input.mouseY)
        if(!this.game.map.inBounds(t.x, t.y)) return

        if(this.game.buildMode){
            const canAfford = this.game.player.canAfford(this.game.buildingSystem.costs[this.game.buildMode])
            const canPlace = this.game.buildingSystem.canPlace(this.game.buildMode, t.x, t.y, this.game.player)
            const isValid = canAfford && canPlace

            ctx.fillStyle = isValid ? COLORS.validGhost : COLORS.invalidGhost
            ctx.fillRect(t.x * TILE_SIZE, t.y * TILE_SIZE, TILE_SIZE, TILE_SIZE)

            ctx.strokeStyle = isValid ? '#22c55e' : '#f43f5e'
            ctx.lineWidth = 2
            ctx.strokeRect(t.x * TILE_SIZE, t.y * TILE_SIZE, TILE_SIZE, TILE_SIZE)
            ctx.lineWidth = 1
        }
    }

    drawSelectionBox(){
        if(this.game.input.isDragging && this.game.input.dragStart){
            const start = this.game.input.dragStart
            const cur = {x: this.game.input.mouseX, y: this.game.input.mouseY}
            const sx = Math.min(start.x, cur.x)
            const sy = Math.min(start.y, cur.y)
            const sw = Math.abs(cur.x - start.x)
            const sh = Math.abs(cur.y - start.y)

            ctx.fillStyle = 'rgba(56,189,248,.16)'
            ctx.fillRect(sx, sy, sw, sh)
            ctx.strokeStyle = '#38bdf8'
            ctx.lineWidth = 1.5
            ctx.strokeRect(sx, sy, sw, sh)
            ctx.lineWidth = 1
        }
    }

    // Step 5: Minimap Polish with 4px blips, alert pings & contrast
    drawMinimap(){
        mctx.fillStyle = '#05070a'
        mctx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height)

        const sx = minimapCanvas.width / MAP_WIDTH
        const sy = minimapCanvas.height / MAP_HEIGHT

        for(let y = 0; y < MAP_HEIGHT; y++){
            for(let x = 0; x < MAP_WIDTH; x++){
                const t = this.game.map.tiles[y][x]
                if(t.type === TILE_TYPES.WATER) mctx.fillStyle = '#1d486d'
                else if(t.type === TILE_TYPES.FOREST) mctx.fillStyle = '#183f20'
                else if(t.type === TILE_TYPES.GOLD) mctx.fillStyle = '#c29b27'
                else mctx.fillStyle = '#263424'
                mctx.fillRect(x * sx, y * sy, sx, sy)
            }
        }

        for(const b of this.game.buildings){
            mctx.fillStyle = b.owner.team === 1 ? '#38bdf8' : '#f43f5e'
            mctx.fillRect(b.x * sx - 1, b.y * sy - 1, sx * 2, sy * 2)
        }

        // 4px High-Contrast Units
        for(const u of this.game.units){
            mctx.fillStyle = u.owner.team === 1 ? '#38bdf8' : '#f43f5e'
            mctx.fillRect(u.x * sx - 1.5, u.y * sy - 1.5, 4, 4)
        }

        // Minimap Damage Pings
        for(const ping of this.game.particles.minimapPings){
            const alpha = Math.max(0, ping.life / ping.maxLife)
            const r = (1 - alpha) * 12 + 2
            mctx.strokeStyle = `rgba(244,63,94,${alpha})`
            mctx.lineWidth = 1.5
            mctx.beginPath()
            mctx.arc(ping.x * sx, ping.y * sy, r, 0, Math.PI * 2)
            mctx.stroke()
        }

        // Camera Frustum
        const cam = this.game.camera
        const cx = (cam.x / TILE_SIZE) * sx
        const cy = (cam.y / TILE_SIZE) * sy
        const cw = (canvas.width / cam.zoom / TILE_SIZE) * sx
        const ch = (canvas.height / cam.zoom / TILE_SIZE) * sy

        mctx.strokeStyle = '#ffe45c'
        mctx.lineWidth = 1.5
        mctx.strokeRect(cx, cy, cw, ch)
        mctx.lineWidth = 1
    }

    bar(x, y, w, p, color){
        ctx.fillStyle = 'rgba(0,0,0,.6)'
        ctx.fillRect(x, y, w, 4)
        ctx.fillStyle = color
        ctx.fillRect(x, y, w * Math.max(0, Math.min(1, p)), 4)
    }

    // Step 1 & 5: Dynamic affordability dimming & inspector HUD
    updateHUD(){
        const p = this.game.player
        resFoodEl.textContent = Math.floor(p.resources.food)
        resWoodEl.textContent = Math.floor(p.resources.wood)
        resGoldEl.textContent = Math.floor(p.resources.gold)
        resPopEl.textContent = `${p.population}/${p.maxPopulation}`
        hudKillsEl.textContent = `Kills: ${p.stats.enemiesKilled}`

        const enemyTH = this.game.enemy.buildings.find(b => b.type === BUILDING_TYPES.TOWN_HALL)
        if(enemyTH){
            const hpPct = Math.ceil((enemyTH.hp / enemyTH.maxHp) * 100)
            hudEnemyHqEl.textContent = `Цитадель врага: ${hpPct}%`
            hudEnemyHqEl.className = hpPct <= 30 ? 'badge badge-alert' : 'badge badge-gold'
        }else{
            hudEnemyHqEl.textContent = `Цитадель врага: 0%`
        }

        // Control groups unit counts
        for(let i = 1; i <= 4; i++){
            const el = document.getElementById(`gb-${i}`)
            const cntEl = document.getElementById(`gb-cnt-${i}`)
            if(el){
                const grp = this.game.controlGroups[i] || []
                const count = grp.filter(u => u.hp > 0).length
                el.classList.toggle('active', count > 0)
                if(cntEl) cntEl.textContent = count > 0 ? count : ''
            }
        }

        // Action Buttons Affordability & Dimming
        const costs = this.game.buildingSystem.costs
        const prodCosts = this.game.productionSystem.costs
        const popFull = p.population + p.queuedUnitsCount >= p.maxPopulation

        btnBuildTh.disabled = !p.canAfford(costs[BUILDING_TYPES.TOWN_HALL])
        btnBuildBarracks.disabled = !p.canAfford(costs[BUILDING_TYPES.BARRACKS])
        btnBuildFarm.disabled = !p.canAfford(costs[BUILDING_TYPES.FARM])
        btnBuildMine.disabled = !p.canAfford(costs[BUILDING_TYPES.MINE])

        const friendlyTH = p.buildings.find(b => b.type === BUILDING_TYPES.TOWN_HALL && !b.underConstruction)
        const friendlyBarracks = p.buildings.find(b => b.type === BUILDING_TYPES.BARRACKS && !b.underConstruction)

        btnTrainWorker.disabled = !friendlyTH || popFull || !p.canAfford(prodCosts[UNIT_TYPES.WORKER])
        btnTrainWarrior.disabled = !friendlyBarracks || popFull || !p.canAfford(prodCosts[UNIT_TYPES.INFANTRY])
        btnTrainHeavy.disabled = !friendlyBarracks || popFull || !p.canAfford(prodCosts[UNIT_TYPES.HEAVY])

        if(friendlyTH && friendlyTH.level < friendlyTH.maxLevel){
            btnUpgrade.disabled = !friendlyTH.canUpgrade()
            btnUpgrade.querySelector('.btn-cost').textContent = `Ур. ${friendlyTH.level + 1}`
        }else{
            btnUpgrade.disabled = true
            btnUpgrade.querySelector('.btn-cost').textContent = `МАКС`
        }

        // Multi-selection HUD
        const groupSize = this.game.selectedGroup.size
        if(groupSize > 1){
            portraitBox.textContent = '⚔'
            portraitBox.className = ''
            entityTag.style.display = 'inline-block'
            entityTag.className = 'tag-player'
            entityTag.textContent = 'ОТРЯД'
            entityTitle.textContent = `Армия (${groupSize})`
            if(entityHpWrap) entityHpWrap.style.display = 'none'

            let warriors = 0, workers = 0, heavies = 0
            for(const u of this.game.selectedGroup){
                if(u.type === UNIT_TYPES.INFANTRY) warriors++
                if(u.type === UNIT_TYPES.WORKER) workers++
                if(u.type === UNIT_TYPES.HEAVY) heavies++
            }
            entityDesc.textContent = `Пехота: ${warriors} | Осадники: ${heavies} | Рабочие: ${workers}`
            return
        }

        // Step 1: Enemy and Single Friendly Inspection
        const selected = this.game.selected
        if(selected){
            const isFriendly = selected.owner === this.game.player
            portraitBox.className = isFriendly ? '' : 'enemy'
            entityTag.style.display = 'inline-block'
            entityTag.className = isFriendly ? 'tag-player' : 'tag-enemy'
            entityTag.textContent = isFriendly ? 'СОЮЗНИК' : 'ВРАГ'

            if(entityHpWrap){
                entityHpWrap.style.display = 'block'
                entityHpFill.className = isFriendly ? '' : 'enemy'
                entityHpFill.style.width = `${Math.max(0, (selected.hp / selected.maxHp) * 100)}%`
            }

            if(selected instanceof Building){
                portraitBox.textContent = '🏛'
                let title = selected.type.toUpperCase()
                if(selected.type === BUILDING_TYPES.TOWN_HALL) title += ` (Ур. ${selected.level})`
                entityTitle.textContent = title

                if(selected.underConstruction){
                    const rem = (selected.constructionTime - selected.constructionProgress).toFixed(1)
                    entityDesc.textContent = `Постройка: ${rem}с | HP: ${Math.ceil(selected.hp)}/${selected.maxHp}`
                }else if(selected.isUpgrading){
                    const rem = (selected.upgradeDuration - selected.upgradeProgress).toFixed(1)
                    entityDesc.textContent = `Апгрейд: ${rem}с | HP: ${Math.ceil(selected.hp)}/${selected.maxHp}`
                }else{
                    let desc = `HP: ${Math.ceil(selected.hp)}/${selected.maxHp}`
                    if(selected.productionQueue.length) desc += ` | Очередь: ${selected.productionQueue.length}`
                    if(selected.type === BUILDING_TYPES.MINE) desc += ` | Автодобыча: +5G / 3с`
                    if(selected.type === BUILDING_TYPES.FARM) desc += ` | Еда: +3F / 3с`
                    entityDesc.textContent = desc
                }
            }else if(selected instanceof Unit){
                portraitBox.textContent = selected.type === UNIT_TYPES.WORKER ? '⛏' : (selected.type === UNIT_TYPES.INFANTRY ? '⚔' : '🛡')
                entityTitle.textContent = selected.type === UNIT_TYPES.WORKER ? 'РАБОЧИЙ' : (selected.type === UNIT_TYPES.INFANTRY ? 'ПЕХОТИНЕЦ' : 'ОСАДНИК')

                let desc = `HP: ${Math.ceil(selected.hp)}/${selected.maxHp} | Урон: ${selected.damage || 0} | ${selected.state}`
                if(selected.carrying && selected.carrying.amount){
                    desc += ` | Ресурс: ${selected.carrying.amount}`
                }
                entityDesc.textContent = desc
            }
        }else{
            portraitBox.textContent = '-'
            portraitBox.className = ''
            entityTag.style.display = 'none'
            entityTitle.textContent = 'Ничего не выбрано'
            if(entityHpWrap) entityHpWrap.style.display = 'none'
            entityDesc.textContent = 'Тап для выбора, зажми или тяни для рамки'
        }
    }
}

// ----------------------------------------------------
// Main Game Controller
// ----------------------------------------------------
class Game {
    constructor(){
        this.sounds = new SoundSystem()
        this.particles = new ParticleSystem()
        this.camera = new Camera()
        this.controlGroups = {}
        this.selectedGroup = new Set()

        this.restart()
        this.renderer = new Renderer(this)
        this.input = new Input(this)

        restartBtn.onclick = () => this.restart()

        this.lastTime = performance.now()
        requestAnimationFrame(t => this.loop(t))
    }

    restart(){
        this.gameTime = 0
        this.gameOver = null
        endScreen.style.display = 'none'

        this.map = new GameMap(MAP_WIDTH, MAP_HEIGHT)
        this.player = new Player('Player', 1)
        this.enemy = new Player('Enemy', 2)

        this.units = []
        this.buildings = []
        this.selected = null
        this.selectedGroup.clear()
        this.buildMode = null
        this.controlGroups = {1: [], 2: [], 3: [], 4: []}

        this.buildingSystem = new BuildingSystem(this)
        this.productionSystem = new ProductionSystem(this)
        this.combat = new CombatSystem(this)
        this.ai = new SkirmishAI(this)

        this.setupBases()
        this.camera.centerOn(6, 6)
    }

    setupBases(){
        const pTH = new TownHall(this, 6, 6, this.player, true)
        const eTH = new TownHall(this, MAP_WIDTH - 7, MAP_HEIGHT - 7, this.enemy, true)

        this.player.buildings.push(pTH)
        this.enemy.buildings.push(eTH)
        this.buildings.push(pTH, eTH)

        this.map.getTile(6, 6).building = pTH
        this.map.getTile(MAP_WIDTH - 7, MAP_HEIGHT - 7).building = eTH

        const worker = new Worker(this, 7.5, 6.5, this.player)
        this.player.units.push(worker)
        this.units.push(worker)

        const enemyWorker = new Worker(this, MAP_WIDTH - 8.5, MAP_HEIGHT - 7.5, this.enemy)
        this.enemy.units.push(enemyWorker)
        this.units.push(enemyWorker)
    }

    formatTime(sec){
        const m = Math.floor(sec / 60)
        const s = Math.floor(sec % 60)
        return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`
    }

    showGameOverScreen(type){
        endScreen.style.display = 'flex'
        const isVictory = type === 'victory'
        endTitle.textContent = isVictory ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ'
        endTitle.style.color = isVictory ? '#22c55e' : '#f43f5e'

        if(isVictory) this.sounds.playVictory()
        else this.sounds.playDefeat()

        const pStats = this.player.stats
        endStats.innerHTML = `
            <b>Время матча:</b> ${this.formatTime(this.gameTime)}<br>
            <b>Уничтожено врагов:</b> ${pStats.enemiesKilled}<br>
            <b>Нанято рабочих:</b> ${pStats.workersCreated}<br>
            <b>Обучено пехоты:</b> ${pStats.infantryCreated}<br>
            <b>Построено осадников:</b> ${pStats.heavyCreated}<br>
            <b>Возведено зданий:</b> ${pStats.buildingsBuilt}<br>
            <b>Добыто дерева:</b> ${Math.floor(pStats.gathered.wood)}<br>
            <b>Добыто золота:</b> ${Math.floor(pStats.gathered.gold)}<br>
            <b>Собрано еды:</b> ${Math.floor(pStats.gathered.food)}
        `
    }

    setBuildMode(type){
        if(!type){
            this.buildMode = null
            return
        }
        if(!this.player.canAfford(this.buildingSystem.costs[type])){
            this.sounds.playErrorBuzz()
            return
        }
        this.buildMode = type
        this.sounds.playOrderConfirmation()
    }

    assignControlGroup(num){
        const units = [...this.selectedGroup].filter(u => u.hp > 0 && u.owner === this.player)
        if(units.length){
            this.controlGroups[num] = units
            this.sounds.playOrderConfirmation()
        }
    }

    selectControlGroup(num){
        const valid = (this.controlGroups[num] || []).filter(u => u.hp > 0)
        this.controlGroups[num] = valid
        if(valid.length){
            this.clearSelection()
            for(const u of valid){
                this.selectedGroup.add(u)
                u.selected = true
            }
            this.selected = valid[0]
            this.playSelectionSound(this.selected)
        }
    }

    clearSelection(){
        for(const u of this.units) u.selected = false
        this.selectedGroup.clear()
        this.selected = null
    }

    playSelectionSound(entity){
        if(!entity) return
        if(entity instanceof Worker) this.sounds.playWorkerSelect()
        else if(entity instanceof Infantry) this.sounds.playInfantrySelect()
        else if(entity instanceof Heavy) this.sounds.playHeavySelect()
        else if(entity instanceof Building) this.sounds.playBuildingSelect()
    }

    handleBoxSelection(x1, y1, x2, y2){
        this.clearSelection()
        const minX = Math.min(x1, x2)
        const maxX = Math.max(x1, x2)
        const minY = Math.min(y1, y2)
        const maxY = Math.max(y1, y2)

        for(const u of this.units){
            if(u.owner !== this.player || u.hp <= 0) continue
            const sx = (u.x * TILE_SIZE - this.camera.x) * this.camera.zoom
            const sy = (u.y * TILE_SIZE - this.camera.y) * this.camera.zoom

            if(sx >= minX && sx <= maxX && sy >= minY && sy <= maxY){
                this.selectedGroup.add(u)
                u.selected = true
            }
        }

        if(this.selectedGroup.size > 0){
            this.selected = [...this.selectedGroup][0]
            this.playSelectionSound(this.selected)
        }
    }

    // Step 1: Left-click with friendly selection & enemy inspection
    handleLeftClick(sx, sy){
        if(this.gameOver) return

        const tilePos = this.camera.screenToTile(sx, sy)
        if(!this.map.inBounds(tilePos.x, tilePos.y)) return

        if(this.buildMode){
            const b = this.buildingSystem.create(this.buildMode, tilePos.x, tilePos.y, this.player)
            if(b){
                this.buildings.push(b)
                this.buildMode = null
            }else{
                this.sounds.playErrorBuzz()
            }
            return
        }

        const world = this.camera.screenToWorld(sx, sy)
        const wx = world.x / TILE_SIZE
        const wy = world.y / TILE_SIZE

        // Check Unit Click (Friendly or Enemy)
        const clickedUnit = this.units.find(u => u.hp > 0 && Math.hypot(u.x - wx, u.y - wy) <= 0.8)
        if(clickedUnit){
            this.clearSelection()
            this.selected = clickedUnit
            if(clickedUnit.owner === this.player){
                this.selectedGroup.add(clickedUnit)
                clickedUnit.selected = true
            }
            this.playSelectionSound(clickedUnit)
            return
        }

        // Check Building Click (Friendly or Enemy)
        const building = this.getBuildingAtTile(tilePos.x, tilePos.y)
        if(building){
            this.clearSelection()
            this.selected = building
            this.playSelectionSound(building)
            return
        }

        this.clearSelection()
    }

    // Step 2: Unified context right-click orders with formation spread
    handleRightClick(sx, sy){
        if(this.gameOver) return
        if(!this.selectedGroup.size && (!this.selected || this.selected.owner !== this.player)) return

        const pos = this.camera.screenToTile(sx, sy)
        if(!this.map.inBounds(pos.x, pos.y)) return

        const world = this.camera.screenToWorld(sx, sy)
        const wx = world.x / TILE_SIZE
        const wy = world.y / TILE_SIZE

        const enemyUnit = this.units.find(u => u.owner !== this.player && u.hp > 0 && Math.hypot(u.x - wx, u.y - wy) <= 0.85)
        const enemyBuilding = this.getBuildingAtTile(pos.x, pos.y)
        const target = enemyUnit || (enemyBuilding && enemyBuilding.owner !== this.player ? enemyBuilding : null)

        const tile = this.map.getTile(pos.x, pos.y)
        const units = [...this.selectedGroup]
        if(!units.length && this.selected instanceof Unit && this.selected.owner === this.player){
            units.push(this.selected)
        }

        if(target){
            // Attack Order
            for(const u of units){
                if(u instanceof CombatUnit){
                    u.commandAttack(target)
                }else if(u instanceof Worker){
                    u.workTarget = null
                    u.returnTarget = null
                    u.setPath(this.findPath(u.tileX, u.tileY, pos.x, pos.y, false))
                }
            }
            this.particles.addOrderRing(wx, wy, '#ef4444')
            this.sounds.playAttackOrder()
        }else if(tile && tile.resourceType && tile.resourceAmount > 0){
            // Gather Order
            for(const u of units){
                if(u instanceof Worker){
                    u.commandGather(tile)
                }else if(u instanceof CombatUnit){
                    u.commandMove(pos.x, pos.y)
                }
            }
            this.particles.addOrderRing(pos.x + 0.5, pos.y + 0.5, '#f59e0b')
            this.sounds.playOrderConfirmation()
        }else{
            // Move Order with Safe Formation Spread
            let idx = 0
            for(const u of units){
                const offsetX = (idx % 3) - 1
                const offsetY = Math.floor(idx / 3)
                const targetX = Math.max(0, Math.min(MAP_WIDTH - 1, pos.x + offsetX))
                const targetY = Math.max(0, Math.min(MAP_HEIGHT - 1, pos.y + offsetY))

                const targetTile = this.map.getTile(targetX, targetY)
                const finalX = (targetTile && targetTile.isWalkable()) ? targetX : pos.x
                const finalY = (targetTile && targetTile.isWalkable()) ? targetY : pos.y

                if(u instanceof CombatUnit){
                    u.commandMove(finalX, finalY)
                }else if(u instanceof Worker){
                    u.workTarget = null
                    u.returnTarget = null
                    u.setPath(this.findPath(u.tileX, u.tileY, finalX, finalY, false))
                }
                idx++
            }
            this.particles.addOrderRing(wx, wy, '#38bdf8')
            this.sounds.playOrderConfirmation()
        }
    }

    queueSelectedWorker(){
        const th = this.player.buildings.find(b => b.type === BUILDING_TYPES.TOWN_HALL && !b.underConstruction)
        if(th){
            if(!this.productionSystem.queue(th, UNIT_TYPES.WORKER)){
                this.sounds.playErrorBuzz()
            }
        }
    }

    queueSelectedInfantry(){
        const barracks = this.player.buildings.find(b => b.type === BUILDING_TYPES.BARRACKS && !b.underConstruction)
        if(barracks){
            if(!this.productionSystem.queue(barracks, UNIT_TYPES.INFANTRY)){
                this.sounds.playErrorBuzz()
            }
        }
    }

    queueSelectedHeavy(){
        const barracks = this.player.buildings.find(b => b.type === BUILDING_TYPES.BARRACKS && !b.underConstruction)
        if(barracks){
            if(!this.productionSystem.queue(barracks, UNIT_TYPES.HEAVY)){
                this.sounds.playErrorBuzz()
            }
        }
    }

    upgradeSelectedTownHall(){
        const th = this.player.buildings.find(b => b.type === BUILDING_TYPES.TOWN_HALL && !b.underConstruction)
        if(th){
            if(!th.startUpgrade()){
                this.sounds.playErrorBuzz()
            }
        }
    }

    // A* Pathfinding with Adjacent Target Clamping
    findPath(startX, startY, endX, endY, allowResourceTarget = false){
        if(!this.map.inBounds(startX, startY) || !this.map.inBounds(endX, endY)) return []
        const start = {x: startX, y: startY}
        const goal = {x: endX, y: endY}
        if(start.x === goal.x && start.y === goal.y) return []

        const goalTile = this.map.getTile(goal.x, goal.y)
        if(!goalTile) return []

        const passable = (x, y) => {
            const tile = this.map.getTile(x, y)
            if(!tile || tile.type === TILE_TYPES.WATER) return false
            if(tile.building && !(x === start.x && y === start.y)){
                if(allowResourceTarget && tile.building.type === BUILDING_TYPES.MINE) return true
                return false
            }
            return true
        }

        if(!passable(goal.x, goal.y) && !(goalTile.building === this.selected)){
            const alternatives = [
                [goal.x + 1, goal.y], [goal.x - 1, goal.y], [goal.x, goal.y + 1], [goal.x, goal.y - 1],
                [goal.x + 1, goal.y + 1], [goal.x - 1, goal.y - 1], [goal.x + 1, goal.y - 1], [goal.x - 1, goal.y + 1]
            ].filter(([x, y]) => this.map.inBounds(x, y) && passable(x, y))

            if(alternatives.length){
                goal.x = alternatives[0][0]
                goal.y = alternatives[0][1]
            }else return []
        }

        const open = []
        const closed = new Set()
        const nodes = new Map()
        const key = (x, y) => `${x},${y}`
        const heuristic = (x, y) => Math.abs(x - goal.x) + Math.abs(y - goal.y)

        const first = {x: start.x, y: start.y, g: 0, h: heuristic(start.x, start.y), parent: null}
        first.f = first.g + first.h
        open.push(first)
        nodes.set(key(first.x, first.y), first)

        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]]

        while(open.length){
            let best = 0
            for(let i = 1; i < open.length; i++){
                if(open[i].f < open[best].f) best = i
            }

            const current = open.splice(best, 1)[0]
            const currentKey = key(current.x, current.y)

            if(current.x === goal.x && current.y === goal.y){
                const path = []
                let n = current
                while(n){
                    if(!(n.x === start.x && n.y === start.y)) path.unshift({x: n.x, y: n.y})
                    n = n.parent
                }
                return path
            }

            closed.add(currentKey)

            for(const [dx, dy] of dirs){
                const nx = current.x + dx
                const ny = current.y + dy
                if(!this.map.inBounds(nx, ny) || !passable(nx, ny)) continue

                const nk = key(nx, ny)
                if(closed.has(nk)) continue

                const g = current.g + 1
                const existing = nodes.get(nk)

                if(!existing || g < existing.g){
                    const node = {x: nx, y: ny, g, h: heuristic(nx, ny), parent: current}
                    node.f = node.g + node.h
                    nodes.set(nk, node)
                    const index = open.indexOf(existing)
                    if(index >= 0) open.splice(index, 1)
                    open.push(node)
                }
            }
        }
        return []
    }

    getUnitAtTile(x, y, ignore = null){
        return this.units.find(u => {
            if(u === ignore || u.hp <= 0) return false
            return Math.floor(u.x) === x && Math.floor(u.y) === y
        })
    }

    getBuildingAtTile(x, y){
        return this.buildings.find(b => b.x === x && b.y === y && b.hp > 0)
    }

    findNearestResource(x, y, type = null){
        let nearest = null
        let best = Infinity
        for(let yy = 0; yy < this.map.height; yy++){
            for(let xx = 0; xx < this.map.width; xx++){
                const tile = this.map.getTile(xx, yy)
                if(!tile.resourceType || tile.resourceAmount <= 0) continue
                if(type && tile.resourceType !== type) continue
                const d = Math.abs(xx - x) + Math.abs(yy - y)
                if(d < best){best = d; nearest = tile}
            }
        }
        return nearest
    }

    getBuildSpotsNear(building, type, player){
        const result = []
        for(let radius = 1; radius <= 8; radius++){
            for(let y = building.y - radius; y <= building.y + radius; y++){
                for(let x = building.x - radius; x <= building.x + radius; x++){
                    if(this.map.inBounds(x, y) && this.buildingSystem.canPlace(type, x, y, player, false)){
                        result.push({x, y})
                    }
                }
            }
            if(result.length) return result
        }
        return result
    }

    choosePlayerTarget(units){
        const targets = [...this.player.units, ...this.player.buildings].filter(t => t.hp > 0)
        if(!targets.length) return null

        let bestTarget = null
        let bestScore = Infinity

        for(const target of targets){
            let score = 0
            for(const unit of units){
                const tx = target instanceof Unit ? target.x : target.x + 0.5
                const ty = target instanceof Unit ? target.y : target.y + 0.5
                score += Math.hypot(unit.x - tx, unit.y - ty)
            }
            if(target instanceof TownHall) score -= 30
            if(target instanceof Barracks) score -= 15
            if(target instanceof Worker) score -= 8

            if(score < bestScore){
                bestScore = score
                bestTarget = target
            }
        }
        return bestTarget
    }

    cleanup(){
        const dead = this.units.filter(u => u.hp <= 0)
        for(const unit of dead){
            const index = unit.owner.units.indexOf(unit)
            if(index >= 0) unit.owner.units.splice(index, 1)
            this.selectedGroup.delete(unit)
            if(this.selected === unit) this.selected = null
        }

        this.units = this.units.filter(u => u.hp > 0)

        // Step 3: Clear Win / Defeat Trigger
        if(!this.gameOver){
            if(this.player.defeated){
                this.gameOver = 'defeat'
                this.showGameOverScreen('defeat')
            }else if(this.enemy.defeated){
                this.gameOver = 'victory'
                this.showGameOverScreen('victory')
            }
        }
    }

    update(dt){
        if(!this.gameOver){
            this.gameTime += dt
            hudTimerEl.textContent = this.formatTime(this.gameTime)
        }

        this.camera.update(dt, this.input)
        this.particles.update(dt)

        if(this.gameOver) return

        for(const b of this.buildings) b.update(dt)
        for(const unit of this.units) unit.update(dt)

        this.productionSystem.update(dt)
        this.combat.update(dt)
        if(this.ai) this.ai.update(dt)
        this.cleanup()
    }

    loop(time){
        const dt = Math.min((time - this.lastTime) / 1000, 0.1)
        this.lastTime = time

        this.update(dt)
        this.renderer.draw()

        requestAnimationFrame(t => this.loop(t))
    }
}

const game = new Game()
</script>
