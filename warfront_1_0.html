<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Warfront: Wild Battleground</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d110f;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      user-select: none;
    }
    #gameCanvas {
      display: block;
      cursor: crosshair;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(14, 20, 16, 0.9);
      backdrop-filter: blur(5px);
      padding: 12px 16px;
      border: 1px solid #3d4f40;
      border-radius: 8px;
      color: #e0e8e2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hud-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      color: #8fa895;
      text-transform: uppercase;
    }
    #minimap {
      border: 1px solid #4a6350;
      border-radius: 4px;
      background: #151d17;
      display: block;
      margin-bottom: 8px;
    }
    .stats {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hp-bar-bg {
      width: 100%;
      height: 7px;
      background: #232d26;
      border-radius: 3px;
      overflow: hidden;
      margin: 2px 0 4px 0;
    }
    #hp-bar-fill {
      height: 100%;
      width: 100%;
      background: #44bd32;
      transition: width 0.1s;
    }
    #controls-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 4px 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="hud-title">Карта ТВД (5 Секторов)</div>
  <canvas id="minimap" width="180" height="110"></canvas>
  <div class="stats">
    <div>ЗДОРОВЬЕ: <span id="hp-val">100</span>%</div>
    <div class="hp-bar-bg"><div id="hp-bar-fill"></div></div>
    <div>ТЕКУЩИЙ РАЙОН: <b id="cur-sector" style="color: #f5cd79">-</b></div>
  </div>
</div>

<div id="controls-hint">WASD — марш-бросок | Мышь — огонь | В лесу пули вязнут в деревьях</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mCanvas = document.getElementById('minimap');
const mCtx = mCanvas.getContext('2d');

let screenW = canvas.width = window.innerWidth;
let screenH = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  screenW = canvas.width = window.innerWidth;
  screenH = canvas.height = window.innerHeight;
});

// --- ПАРАМЕТРЫ ОГРОМНОГО МИРА ---
const WORLD_W = 4000;
const WORLD_H = 2400;

// Камера
const camera = { x: 0, y: 0 };

// 5 Секторов фронта
const sectors = [
  { id: 0, x: 0, width: 800, owner: 1, name: "Тыл Альянса" },
  { id: 1, x: 800, width: 800, owner: 1, name: "Западный Бор" },
  { id: 2, x: 1600, width: 800, owner: 0, name: "Высота 104 / Река" },
  { id: 3, x: 2400, width: 800, owner: 2, name: "Дубрава Федерации" },
  { id: 4, x: 3200, width: 800, owner: 2, name: "Штаб Врага" }
];

// --- ГЕНЕРАЦИЯ ЛАНДШАФТА (ЛЕСА И УКРЫТИЯ) ---
const trees = [];
// Создаем густые лесные чащи в секторах 1, 2 и 3
for (let i = 0; i < 280; i++) {
  trees.push({
    x: 400 + Math.random() * (WORLD_W - 800),
    y: Math.random() * WORLD_H,
    r: 16 + Math.random() * 18,
    foliageR: 28 + Math.random() * 20
  });
}

// Окопы и укрепрайоны
const trenches = [
  // Западные окопы
  { x: 750, y: 300, w: 40, h: 400 },
  { x: 750, y: 1100, w: 40, h: 500 },
  { x: 750, y: 1800, w: 40, h: 400 },
  // Центральные бункеры
  { x: 1950, y: 500, w: 90, h: 250 },
  { x: 1950, y: 1500, w: 90, h: 250 },
  // Восточные окопы врага
  { x: 3150, y: 400, w: 40, h: 600 },
  { x: 3150, y: 1300, w: 40, h: 600 }
];

// --- УПРАВЛЕНИЕ ---
const keys = { w: false, a: false, s: false, d: false };
const mouse = { x: 0, y: 0, isDown: false };

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || e.key === 'ArrowUp') keys.w = true;
  if (k === 'a' || k === 'ф' || e.key === 'ArrowLeft') keys.a = true;
  if (k === 's' || k === 'ы' || e.key === 'ArrowDown') keys.s = true;
  if (k === 'd' || k === 'в' || e.key === 'ArrowRight') keys.d = true;
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || e.key === 'ArrowUp') keys.w = false;
  if (k === 'a' || k === 'ф' || e.key === 'ArrowLeft') keys.a = false;
  if (k === 's' || k === 'ы' || e.key === 'ArrowDown') keys.s = false;
  if (k === 'd' || k === 'в' || e.key === 'ArrowRight') keys.d = false;
});

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
window.addEventListener('mousedown', e => { if (e.button === 0) mouse.isDown = true; });
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.isDown = false; });

// --- СУЩНОСТИ ---
class Unit {
  constructor(x, y, team, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.team = team;
    this.isPlayer = isPlayer;
    this.hp = 100;
    this.baseSpeed = isPlayer ? 3.4 : 1.8 + Math.random() * 0.4;
    this.angle = 0;
    this.lastShot = 0;
    this.fireRate = isPlayer ? 180 : 800 + Math.random() * 500;
  }

  update(now) {
    // Замедление в глухом лесу
    let inWoods = false;
    for (let t of trees) {
      if (Math.hypot(t.x - this.x, t.y - this.y) < t.foliageR) {
        inWoods = true;
        break;
      }
    }
    const currentSpeed = inWoods ? this.baseSpeed * 0.65 : this.baseSpeed;

    if (this.isPlayer) {
      let dx = 0;
      let dy = 0;
      if (keys.w) dy -= 1;
      if (keys.s) dy += 1;
      if (keys.a) dx -= 1;
      if (keys.d) dx += 1;

      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

      this.move(dx * currentSpeed, dy * currentSpeed);

      // Прицел с учетом положения камеры
      const worldMouseX = mouse.x + camera.x;
      const worldMouseY = mouse.y + camera.y;
      this.angle = Math.atan2(worldMouseY - this.y, worldMouseX - this.x);

      if (mouse.isDown && now - this.lastShot > this.fireRate) {
        shoot(this.x, this.y, this.angle, this.team);
        this.lastShot = now;
      }
    } else {
      this.ai(now, currentSpeed);
    }
  }

  move(vx, vy) {
    let nx = Math.max(20, Math.min(WORLD_W - 20, this.x + vx));
    let ny = Math.max(20, Math.min(WORLD_H - 20, this.y + vy));

    // Стволы деревьев (непроходимые препятствия)
    for (let t of trees) {
      if (Math.hypot(t.x - nx, t.y - ny) < t.r + this.radius) return;
    }
    this.x = nx;
    this.y = ny;
  }

  ai(now, speed) {
    // Поиск видимого врага
    let nearest = null;
    let minD = 400;

    for (let u of units) {
      if (u.team !== this.team && u.hp > 0) {
        let d = Math.hypot(u.x - this.x, u.y - this.y);
        if (d < minD) {
          minD = d;
          nearest = u;
        }
      }
    }

    if (nearest) {
      this.angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
      if (now - this.lastShot > this.fireRate) {
        shoot(this.x, this.y, this.angle + (Math.random() - 0.5) * 0.25, this.team);
        this.lastShot = now;
      }
    } else {
      // Марш на нейтральные или вражеские земли
      const targetSector = sectors.find(s => s.owner !== this.team) || sectors[2];
      const targetX = targetSector.x + targetSector.width / 2;
      const dirX = this.x < targetX ? 1 : -1;
      this.angle = dirX > 0 ? 0 : Math.PI;
      this.move(dirX * speed * 0.7, (Math.random() - 0.5) * speed);
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Оружие
    ctx.fillStyle = '#1c241e';
    ctx.fillRect(5, -2, 14, 4);

    // Боец
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.team === 1 ? (this.isPlayer ? '#2ecc71' : '#3880ff') : '#eb445a';
    ctx.fill();
    ctx.strokeStyle = '#0e1410';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }
}

// --- ПУЛИ ---
const bullets = [];
function shoot(x, y, angle, team) {
  bullets.push({
    x: x + Math.cos(angle) * 15,
    y: y + Math.sin(angle) * 15,
    vx: Math.cos(angle) * 11,
    vy: Math.sin(angle) * 11,
    team: team,
    range: 55
  });
}

// --- ИНИЦИАЛИЗАЦИЯ АРМИЙ ---
const units = [];
const player = new Unit(300, WORLD_H / 2, 1, true);
units.push(player);

// Спавн батальонов по фронту
for (let i = 0; i < 35; i++) {
  units.push(new Unit(200 + Math.random() * 600, Math.random() * WORLD_H, 1));
  units.push(new Unit(WORLD_W - 200 - Math.random() * 600, Math.random() * WORLD_H, 2));
}

// --- ГЕЙМЛУП ---
function loop(now) {
  // 1. АПДЕЙТ
  for (let i = units.length - 1; i >= 0; i--) {
    const u = units[i];
    if (u.hp <= 0) {
      if (!u.isPlayer) units.splice(i, 1);
      continue;
    }
    u.update(now);
  }

  // Пули и коллизии с лесом
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.range--;

    let hit = false;
    // Попадание в дерево
    for (let t of trees) {
      if (Math.hypot(t.x - b.x, t.y - b.y) < t.r) {
        hit = true;
        break;
      }
    }

    // Попадание в бойца
    if (!hit) {
      for (let u of units) {
        if (u.team !== b.team && u.hp > 0) {
          if (Math.hypot(u.x - b.x, u.y - b.y) < u.radius + 2) {
            u.hp -= 34;
            hit = true;
            break;
          }
        }
      }
    }

    if (b.range <= 0 || hit) bullets.splice(i, 1);
  }

  // Расчет захвата секторов по всему миру
  sectors.forEach(s => {
    const blue = units.filter(u => u.team === 1 && u.hp > 0 && u.x >= s.x && u.x < s.x + s.width).length;
    const red = units.filter(u => u.team === 2 && u.hp > 0 && u.x >= s.x && u.x < s.x + s.width).length;
    if (blue > red + 2) s.owner = 1;
    else if (red > blue + 2) s.owner = 2;
  });

  // Камера плавно следит за игроком
  camera.x = Math.max(0, Math.min(WORLD_W - screenW, player.x - screenW / 2));
  camera.y = Math.max(0, Math.min(WORLD_H - screenH, player.y - screenH / 2));

  // Текущий сектор игрока
  const curSec = sectors.find(s => player.x >= s.x && player.x < s.x + s.width);
  if (curSec) document.getElementById('cur-sector').innerText = curSec.name;

  // 2. ОТРИСОВКА МИРА
  ctx.clearRect(0, 0, screenW, screenH);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Земля и границы секторов
  sectors.forEach(s => {
    ctx.fillStyle = s.owner === 1 ? '#1a2920' : s.owner === 2 ? '#2b1b1a' : '#18211b';
    ctx.fillRect(s.x, 0, s.width, WORLD_H);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.strokeRect(s.x, 0, s.width, WORLD_H);
  });

  // Окопы
  ctx.fillStyle = '#101712';
  trenches.forEach(t => {
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.strokeStyle = '#27382c';
    ctx.strokeRect(t.x, t.y, t.w, t.h);
  });

  // Пули
  ctx.fillStyle = '#f5cd79';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Юниты
  units.forEach(u => { if (u.hp > 0) u.draw(); });

  // Деревья и кроны (отрисовываются поверх, создавая ощущение леса)
  trees.forEach(t => {
    // Ствол
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fillStyle = '#3e2723';
    ctx.fill();
    // Густая крона
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.foliageR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(39, 78, 49, 0.75)';
    ctx.fill();
  });

  ctx.restore();

  // 3. ОТРИСОВКА МИНИКАРТЫ
  mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
  const sx = mCanvas.width / WORLD_W;
  const sy = mCanvas.height / WORLD_H;

  // Окрас оккупированных секторов
  sectors.forEach(s => {
    mCtx.fillStyle = s.owner === 1 ? '#2980b9' : s.owner === 2 ? '#c0392b' : '#34495e';
    mCtx.fillRect(s.x * sx, 0, s.width * sx, mCanvas.height);
  });

  // Вьюпорт камеры на миникарте (прямоугольник обзора)
  mCtx.strokeStyle = '#ffffff';
  mCtx.lineWidth = 1;
  mCtx.strokeRect(camera.x * sx, camera.y * sy, screenW * sx, screenH * sy);

  // Бойцы на карте
  units.forEach(u => {
    if (u.hp <= 0) return;
    mCtx.fillStyle = u.isPlayer ? '#2ecc71' : u.team === 1 ? '#fff' : '#e74c3c';
    mCtx.fillRect(u.x * sx, u.y * sy, u.isPlayer ? 3 : 2, u.isPlayer ? 3 : 2);
  });

  // HUD
  const hp = Math.max(0, player.hp);
  document.getElementById('hp-val').innerText = hp;
  document.getElementById('hp-bar-fill').style.width = hp + '%';

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
