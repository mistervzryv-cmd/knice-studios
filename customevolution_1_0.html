<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Evolution: От Микроба до Зверя</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #070b14;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Левая колонка: аквариум и кликер */
    .viewport-panel {
      flex: 1.3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: radial-gradient(circle at center, #0f1c36 0%, #050811 100%);
      position: relative;
      border-right: 2px solid #1e293b;
    }

    .top-stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .stat-badge { display: flex; flex-direction: column; gap: 2px; }
    .stat-cells { color: #38bdf8; }
    .stat-body { color: #4ade80; }
    .stat-dna { color: #c084fc; }
    .stat-rate { color: #f59e0b; }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 580px;
      height: 420px;
    }

    #bioCanvas {
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.7);
      border-radius: 20px;
      border: 1px solid #1e293b;
      box-shadow: inset 0 0 50px rgba(56, 189, 248, 0.04);
      display: block;
    }

    .era-overlay {
      position: absolute;
      top: 12px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #38bdf8;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .archetype-overlay {
      position: absolute;
      bottom: 12px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #a855f7;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #d8b4fe;
      pointer-events: none;
    }

    .action-controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 580px;
    }

    .btn-main {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .btn-main:active { transform: scale(0.97); }

    .btn-feed {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn-feed:hover { background: linear-gradient(135deg, #38bdf8, #0284c7); }

    .btn-body-grow {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }
    .btn-body-grow:hover:not(:disabled) { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .btn-body-grow:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; box-shadow: none; }

    .btn-dna {
      background: linear-gradient(135deg, #7e22ce, #6b21a8);
      color: #fff;
      box-shadow: 0 4px 12px rgba(126, 34, 206, 0.3);
    }
    .btn-dna:hover:not(:disabled) { background: linear-gradient(135deg, #a855f7, #7e22ce); }
    .btn-dna:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; box-shadow: none; }

    /* Правая колонка: Магазин & Таксономия */
    .shop-panel {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      background: #0b1120;
      overflow-y: auto;
      padding: 18px 22px;
      gap: 16px;
    }

    .shop-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tabs-header {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }

    .tab-btn {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #fff;
    }

    .category-card {
      background: #131d33;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-header {
      font-weight: 700;
      color: #94a3b8;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
    }

    .upgrade-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upgrade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0f1d;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      gap: 8px;
    }

    .upgrade-item.bought {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.05);
    }

    .upgrade-info h4 {
      font-size: 0.88rem;
      color: #f1f5f9;
      margin-bottom: 2px;
    }

    .upgrade-info p {
      font-size: 0.73rem;
      color: #64748b;
    }

    .btn-buy {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-buy:hover:not(:disabled) {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-buy:disabled {
      background: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }

    .btn-buy.purchased {
      background: #22c55e;
      color: #fff;
      cursor: default;
    }

    .archetype-selector-card {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      border: 1px solid #6366f1;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .archetype-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-archetype {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-archetype:hover {
      border-color: #a855f7;
      background: #1e1b4b;
    }

    .btn-archetype.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
      color: #fff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .floating-text {
      position: absolute;
      font-weight: bold;
      color: #38bdf8;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-35px); }
    }
  </style>
</head>
<body>

  <!-- Левая колонка -->
  <div class="viewport-panel">
    <div class="top-stats">
      <div class="stat-badge stat-cells">
        <span>Биомасса</span>
        <span id="cellsCount">1</span>
      </div>
      <div class="stat-badge stat-body">
        <span>Клетки тела</span>
        <span id="bodyCellsCount">1</span>
      </div>
      <div class="stat-badge stat-dna">
        <span>ДНК</span>
        <span id="dnaCount">0</span>
      </div>
      <div class="stat-badge stat-rate">
        <span>Синтез</span>
        <span id="passiveIncome">0/с</span>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="bioCanvas" width="580" height="420"></canvas>
      <div class="era-overlay" id="eraOverlay">Эра 1: Одноклеточное</div>
      <div class="archetype-overlay" id="archetypeOverlay">Форма: Прокариот</div>
    </div>

    <div class="action-controls">
      <button class="btn-main btn-feed" id="clickBtn">
        <span>Питание</span>
        <small id="clickPowerText">+1 Биомасса</small>
      </button>

      <button class="btn-main btn-body-grow" id="growBodyBtn">
        <span>+1 Клетка Тела</span>
        <small id="bodyCostText">Цена: 10 биомассы</small>
      </button>

      <button class="btn-main btn-dna" id="synthDnaBtn" disabled>
        <span>Мутация (+1 🧬)</span>
        <small id="dnaCostText">Цена: 25 биомассы</small>
      </button>
    </div>
  </div>

  <!-- Правая колонка -->
  <div class="shop-panel">
    <div class="shop-title">
      <span>Лаборатория Эволюции</span>
      <button id="resetBtn" style="background:transparent; border:1px solid #475569; color:#64748b; padding:2px 8px; border-radius:6px; font-size:0.7rem; cursor:pointer;">Сброс</button>
    </div>

    <!-- Выбор кастомного архетипа животного -->
    <div class="archetype-selector-card" id="archetypeCard" style="display: none;">
      <div class="category-header" style="color: #c084fc;">🧬 Выбор ветки многоклеточного</div>
      <p style="font-size: 0.75rem; color: #94a3b8;">При росте тела форма анатомически трансформируется в выбранный тип:</p>
      <div class="archetype-options">
        <button class="btn-archetype active" onclick="setArchetype('insect')">🐛 Насекомое / Членистоногое</button>
        <button class="btn-archetype" onclick="setArchetype('reptile')">🦎 Рептилия / Дракон</button>
        <button class="btn-archetype" onclick="setArchetype('beast')">🐺 Зверь / Млекопитающее</button>
        <button class="btn-archetype" onclick="setArchetype('aquatic')">🐙 Глубоководный Левиафан</button>
      </div>
    </div>

    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('cells')">Метаболизм (Биомасса)</button>
      <button class="tab-btn" onclick="switchTab('dna')">Органы & Анатомия (ДНК)</button>
    </div>

    <!-- Таб 1: За биомассу -->
    <div id="tabCells" class="category-card">
      <div class="category-header">Клеточные структуры</div>
      <div class="upgrade-grid" id="cellUpgrades"></div>
    </div>

    <!-- Таб 2: За ДНК -->
    <div id="tabDna" class="category-card" style="display: none;">
      <div class="category-header">Органы, Панцири и Конечности</div>
      <div class="upgrade-grid" id="dnaUpgrades"></div>
    </div>
  </div>

  <script>
    // --- СОСТОЯНИЕ ИГРЫ ---
    const state = {
      biomass: 1,
      bodyCells: 1,
      bodyCellCost: 10,
      dna: 0,
      dnaCost: 25,
      clickPower: 1,
      passiveBiomass: 0,
      archetype: 'insect', // 'insect', 'reptile', 'beast', 'aquatic'
      upgrades: {}
    };

    // --- КАТАЛОГ АПГРЕЙДОВ ---
    const upgradesData = [
      // За биомассу
      { id: 'mitochondria', tab: 'cells', name: 'Митохондрии', desc: '+1 биомасса за клик', cost: 12, type: 'biomass', effect: () => state.clickPower += 1, bought: false },
      { id: 'cilia', tab: 'cells', name: 'Реснички поглощения', desc: 'Авто-сбор: +2 биом/сек', cost: 45, type: 'biomass', effect: () => state.passiveBiomass += 2, bought: false },
      { id: 'chloroplast', tab: 'cells', name: 'Хлоропласты', desc: 'Фотосинтез: +10 биом/сек', cost: 160, type: 'biomass', trait: 'chloroplast', effect: () => state.passiveBiomass += 10, bought: false },
      { id: 'circulatory', tab: 'cells', name: 'Кровеносная система', desc: '+35 биом/сек, +5 клик', cost: 500, type: 'biomass', effect: () => { state.passiveBiomass += 35; state.clickPower += 5; }, bought: false },
      { id: 'neural_net', tab: 'cells', name: 'Нервная система', desc: '+120 биом/сек, +20 клик', cost: 2000, type: 'biomass', effect: () => { state.passiveBiomass += 120; state.clickPower += 20; }, bought: false },

      // За ДНК
      { id: 'eyes', tab: 'dna', name: 'Сложные фасеточные / Хищные глаза', desc: 'Глаза на голове (+10 за клик)', cost: 1, type: 'dna', trait: 'eyes', effect: () => state.clickPower += 10, bought: false },
      { id: 'flagella', tab: 'dna', name: 'Жгутики / Хлыстовой хвост', desc: 'Хвостовой плавник (+8/с)', cost: 2, type: 'dna', trait: 'tail', effect: () => state.passiveBiomass += 8, bought: false },
      { id: 'antennae', tab: 'dna', name: 'Чувствительные Усики', desc: 'Антенны на голове (+25/с)', cost: 4, type: 'dna', trait: 'antennae', effect: () => state.passiveBiomass += 25, bought: false },
      { id: 'legs', tab: 'dna', name: 'Сегментированные лапы / Лапы зверя', desc: 'Конечности для быстрого бега (+40/с)', cost: 7, type: 'dna', trait: 'legs', effect: () => state.passiveBiomass += 40, bought: false },
      { id: 'chitin_armor', tab: 'dna', name: 'Экзоскелет / Чешуя / Шерсть', desc: 'Защитный покров тела (+100/с)', cost: 12, type: 'dna', trait: 'armor', effect: () => state.passiveBiomass += 100, bought: false },
      { id: 'mandibles', tab: 'dna', name: 'Хищные Жвалы / Клыки', desc: 'Острый ротовой аппарат (+80 к клику)', cost: 18, type: 'dna', trait: 'mandibles', effect: () => state.clickPower += 80, bought: false },
      { id: 'wings', tab: 'dna', name: 'Хитиновые Крылья / Перепонки', desc: 'Способность к полету (+300/с, +100 клик)', cost: 30, type: 'dna', trait: 'wings', effect: () => { state.passiveBiomass += 300; state.clickPower += 100; }, bought: false },
      { id: 'bioluminescence', tab: 'dna', name: 'Биолюминесценция & Яд', desc: 'Светящиеся железы (+800/с, +250 клик)', cost: 50, type: 'dna', trait: 'glow', effect: () => { state.passiveBiomass += 800; state.clickPower += 250; }, bought: false }
    ];

    function hasTrait(id) {
      const upg = upgradesData.find(u => u.id === id);
      return upg ? upg.bought : false;
    }

    // --- ЭРА И СТАДИИ РАЗВИТИЯ ---
    function getEra() {
      const c = state.bodyCells;
      if (c === 1) return { num: 1, name: 'Одноклеточный Прокариот', short: 'Микроб' };
      if (c <= 3) return { num: 2, name: 'Колония Клеток', short: 'Колония' };
      if (c <= 7) return { num: 3, name: 'Примитивный Червь / Личинка', short: 'Личинка' };
      if (c <= 15) return { num: 4, name: 'Членистоногое / Насекомое', short: 'Насекомое' };
      return { num: 5, name: 'Высшее Животное (Кастомный Зверь)', short: 'Животное' };
    }

    // --- АНАТОМИЯ (МОРФОГЕНЕЗ ТЕЛА) ---
    let bodySegments = [];

    function rebuildAnatomy() {
      const n = state.bodyCells;
      bodySegments = [];

      if (n === 1) {
        bodySegments.push({ x: 0, y: 0, r: 28, type: 'core' });
      } else if (n <= 3) {
        const step = 26;
        const startX = -((n - 1) * step) / 2;
        for (let i = 0; i < n; i++) {
          bodySegments.push({
            x: startX + i * step,
            y: 0,
            r: 20,
            type: i === 0 ? 'head' : (i === n - 1 ? 'tail' : 'body'),
            idx: i
          });
        }
      } else {
        // Вытянутое тело (насекомое / рептилия / зверь)
        const step = 24;
        const startX = -((n - 1) * step) / 2;

        for (let i = 0; i < n; i++) {
          let type = 'body';
          let r = 18;

          if (i === 0) {
            type = 'head';
            r = state.archetype === 'beast' ? 24 : 22;
          } else if (i === n - 1) {
            type = 'tail';
            r = 12;
          } else if (i < n * 0.4) {
            type = 'thorax'; // Грудь / передняя часть
            r = 20;
          } else {
            type = 'abdomen'; // Брюшко / таз
            r = 17 + Math.sin((i / n) * Math.PI) * 6;
          }

          bodySegments.push({
            x: startX + i * step,
            y: 0,
            r: r,
            type: type,
            idx: i
          });
        }
      }

      // Открытие меню архетипов, если клеток >= 4
      const arcCard = document.getElementById('archetypeCard');
      if (state.bodyCells >= 4) {
        arcCard.style.display = 'flex';
      }
    }

    window.setArchetype = function(type) {
      state.archetype = type;
      document.querySelectorAll('.btn-archetype').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      updateUI();
    };

    // --- МАГАЗИН & ТАБЫ ---
    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tabCells').style.display = tab === 'cells' ? 'flex' : 'none';
      document.getElementById('tabDna').style.display = tab === 'dna' ? 'flex' : 'none';
    };

    function initShop() {
      const cellContainer = document.getElementById('cellUpgrades');
      const dnaContainer = document.getElementById('dnaUpgrades');
      cellContainer.innerHTML = '';
      dnaContainer.innerHTML = '';

      upgradesData.forEach(upg => {
        const item = document.createElement('div');
        item.className = `upgrade-item ${upg.bought ? 'bought' : ''}`;
        item.id = `upg-${upg.id}`;

        item.innerHTML = `
          <div class="upgrade-info">
            <h4>${upg.name}</h4>
            <p>${upg.desc}</p>
          </div>
          <button class="btn-buy ${upg.bought ? 'purchased' : ''}" id="btn-${upg.id}" onclick="buyUpgrade('${upg.id}')">
            ${upg.bought ? 'Изучено' : `${upg.cost} ${upg.type === 'biomass' ? '🦠' : '🧬'}`}
          </button>
        `;

        if (upg.tab === 'cells') cellContainer.appendChild(item);
        else dnaContainer.appendChild(item);
      });
    }

    window.buyUpgrade = function(id) {
      const upg = upgradesData.find(u => u.id === id);
      if (!upg || upg.bought) return;

      if (upg.type === 'biomass' && state.biomass >= upg.cost) {
        state.biomass -= upg.cost;
        finishBuy(upg);
      } else if (upg.type === 'dna' && state.dna >= upg.cost) {
        state.dna -= upg.cost;
        finishBuy(upg);
      }
    };

    function finishBuy(upg) {
      upg.bought = true;
      upg.effect();
      const item = document.getElementById(`upg-${upg.id}`);
      const btn = document.getElementById(`btn-${upg.id}`);
      item.classList.add('bought');
      btn.classList.add('purchased');
      btn.textContent = 'Изучено';
      btn.disabled = true;
      updateUI();
    }

    // --- КНОПКИ ДЕЙСТВИЙ ---
    document.getElementById('clickBtn').addEventListener('click', (e) => {
      state.biomass += state.clickPower;
      organismAnim.pulse = 1.22;
      createFloatText(e.clientX, e.clientY, `+${state.clickPower}`);
      updateUI();
    });

    document.getElementById('growBodyBtn').addEventListener('click', () => {
      if (state.biomass >= state.bodyCellCost) {
        state.biomass -= state.bodyCellCost;
        state.bodyCellCost = Math.floor(state.bodyCellCost * 1.55);
        state.bodyCells += 1;
        rebuildAnatomy();
        organismAnim.pulse = 1.3;
        updateUI();
      }
    });

    document.getElementById('synthDnaBtn').addEventListener('click', () => {
      if (state.biomass >= state.dnaCost) {
        state.biomass -= state.dnaCost;
        state.dna += 1;
        state.dnaCost = Math.floor(state.dnaCost * 1.4);
        updateUI();
      }
    });

    function createFloatText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = `${x - 15}px`;
      el.style.top = `${y - 25}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function updateUI() {
      document.getElementById('cellsCount').textContent = Math.floor(state.biomass).toLocaleString();
      document.getElementById('bodyCellsCount').textContent = state.bodyCells;
      document.getElementById('dnaCount').textContent = state.dna;
      document.getElementById('passiveIncome').textContent = `+${state.passiveBiomass}/с`;
      document.getElementById('clickPowerText').textContent = `+${state.clickPower} биомассы`;
      
      document.getElementById('bodyCostText').textContent = `Цена: ${state.bodyCellCost} биом.`;
      document.getElementById('dnaCostText').textContent = `Цена: ${state.dnaCost} биом.`;

      const era = getEra();
      document.getElementById('eraOverlay').textContent = `Эра ${era.num}: ${era.name}`;

      const archNames = { insect: 'Насекомое', reptile: 'Рептилия', beast: 'Зверь', aquatic: 'Левиафан' };
      document.getElementById('archetypeOverlay').textContent = `Ветка: ${archNames[state.archetype] || 'Прокариот'}`;

      document.getElementById('growBodyBtn').disabled = state.biomass < state.bodyCellCost;
      document.getElementById('synthDnaBtn').disabled = state.biomass < state.dnaCost;

      upgradesData.forEach(upg => {
        if (!upg.bought) {
          const btn = document.getElementById(`btn-${upg.id}`);
          if (btn) {
            btn.disabled = upg.type === 'biomass' ? state.biomass < upg.cost : state.dna < upg.cost;
          }
        }
      });
    }

    // Авто-прирост
    setInterval(() => {
      if (state.passiveBiomass > 0) {
        state.biomass += state.passiveBiomass / 10;
        updateUI();
      }
    }, 100);

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Сбросить эволюцию?')) {
        location.reload();
      }
    });

    // ==========================================
    // --- CANVAS АНИМАЦИЯ: МОРФОЛОГИЯ И ВИЗУАЛ ---
    // ==========================================
    const canvas = document.getElementById('bioCanvas');
    const ctx = canvas.getContext('2d');

    const organismAnim = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      pulse: 1
    };

    function render(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const t = time * 0.002;
      organismAnim.x = canvas.width / 2 + Math.sin(t * 0.8) * 35;
      organismAnim.y = canvas.height / 2 + Math.cos(t * 0.6) * 20;
      organismAnim.pulse += (1 - organismAnim.pulse) * 0.08;

      ctx.save();
      ctx.translate(organismAnim.x, organismAnim.y);

      // Волнообразный изгиб при движении
      const spineWiggle = Math.sin(t * 2) * 0.08;
      ctx.rotate(spineWiggle);

      // Цветовая палитра по архетипу
      let bodyFill = 'rgba(14, 165, 233, 0.75)';
      let bodyStroke = '#7dd3fc';
      let eyeColor = '#fff';
      let pupilColor = '#0f172a';

      if (state.archetype === 'insect') {
        bodyFill = hasTrait('chitin_armor') ? 'rgba(180, 83, 9, 0.85)' : 'rgba(217, 119, 6, 0.7)';
        bodyStroke = '#fde047';
      } else if (state.archetype === 'reptile') {
        bodyFill = hasTrait('chitin_armor') ? 'rgba(21, 128, 61, 0.85)' : 'rgba(34, 197, 94, 0.7)';
        bodyStroke = '#86efac';
        pupilColor = '#eab308';
      } else if (state.archetype === 'beast') {
        bodyFill = hasTrait('chitin_armor') ? 'rgba(120, 53, 15, 0.9)' : 'rgba(161, 98, 7, 0.75)';
        bodyStroke = '#fef08a';
      } else if (state.archetype === 'aquatic') {
        bodyFill = hasTrait('chitin_armor') ? 'rgba(88, 28, 135, 0.85)' : 'rgba(147, 51, 234, 0.7)';
        bodyStroke = '#c084fc';
      }

      if (hasTrait('chloroplast')) {
        bodyFill = 'rgba(16, 185, 129, 0.85)';
        bodyStroke = '#a7f3d0';
      }

      // 1. Позвоночник / Связующий хребет
      if (bodySegments.length > 1) {
        ctx.strokeStyle = hasTrait('armor') ? '#334155' : 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 12;
        ctx.beginPath();
        for (let i = 0; i < bodySegments.length; i++) {
          const seg = bodySegments[i];
          const wy = Math.sin(t * 3 + i * 0.5) * 4;
          if (i === 0) ctx.moveTo(seg.x, seg.y + wy);
          else ctx.lineTo(seg.x, seg.y + wy);
        }
        ctx.stroke();
      }

      // 2. Отрисовка каждого сегмента тела
      bodySegments.forEach((seg, idx) => {
        const waveY = Math.sin(t * 3 + idx * 0.5) * 4;
        const cx = seg.x;
        const cy = seg.y + waveY;
        const r = seg.r * organismAnim.pulse;

        // --- ЛАПЫ / КОНЕЧНОСТИ ---
        if (hasTrait('legs') && state.bodyCells >= 3 && idx > 0 && idx < bodySegments.length - 1 && idx % 2 === 1) {
          const legSwing = Math.sin(t * 6 + idx) * 12;
          ctx.strokeStyle = bodyStroke;
          ctx.lineWidth = state.archetype === 'beast' ? 4 : 2.5;

          // Верхняя лапа (колено + ступня)
          ctx.beginPath();
          ctx.moveTo(cx, cy - r);
          ctx.lineTo(cx + legSwing * 0.5, cy - r - 16);
          ctx.lineTo(cx - 10 + legSwing, cy - r - 28);
          ctx.stroke();

          // Нижняя лапа
          ctx.beginPath();
          ctx.moveTo(cx, cy + r);
          ctx.lineTo(cx - legSwing * 0.5, cy + r + 16);
          ctx.lineTo(cx - 10 - legSwing, cy + r + 28);
          ctx.stroke();
        }

        // --- КРЫЛЬЯ ---
        if (hasTrait('wings') && (seg.type === 'thorax' || idx === Math.floor(bodySegments.length / 2))) {
          const wingAngle = Math.sin(t * 8) * 0.4;
          ctx.fillStyle = hasTrait('glow') ? 'rgba(168, 85, 247, 0.4)' : 'rgba(56, 189, 248, 0.35)';
          ctx.strokeStyle = bodyStroke;
          ctx.lineWidth = 1.5;

          // Верхнее крыло
          ctx.beginPath();
          ctx.ellipse(cx, cy - r - 15, 12, 30, wingAngle, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();

          // Нижнее крыло
          ctx.beginPath();
          ctx.ellipse(cx, cy + r + 15, 12, 30, -wingAngle, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

        // --- ТЕЛО СЕГМЕНТА ---
        ctx.beginPath();
        if (state.archetype === 'insect' && state.bodyCells > 4) {
          // Овальные членистые пластины
          ctx.ellipse(cx, cy, r * 0.9, r * 1.1, 0, 0, Math.PI * 2);
        } else {
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
        }

        ctx.fillStyle = bodyFill;
        ctx.strokeStyle = bodyStroke;
        ctx.lineWidth = hasTrait('armor') ? 3.5 : 2;
        ctx.fill();
        ctx.stroke();

        // Биолюминесцентное свечение
        if (hasTrait('bioluminescence')) {
          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(216, 180, 254, 0.9)';
          ctx.shadowColor = '#c084fc';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0; // reset
        }

        // --- ГОЛОВА: Глаза, Усики, Жвалы ---
        if (seg.type === 'head' || idx === 0) {
          // 1. Усики / Антенны / Рога
          if (hasTrait('antennae')) {
            ctx.strokeStyle = bodyStroke;
            ctx.lineWidth = 2;
            const antWave = Math.sin(t * 4) * 6;
            // Верхний ус
            ctx.beginPath();
            ctx.moveTo(cx - r, cy - 8);
            ctx.quadraticCurveTo(cx - r - 15, cy - 25 + antWave, cx - r - 25, cy - 30);
            ctx.stroke();
            // Нижний ус
            ctx.beginPath();
            ctx.moveTo(cx - r, cy + 8);
            ctx.quadraticCurveTo(cx - r - 15, cy + 25 - antWave, cx - r - 25, cy + 30);
            ctx.stroke();
          }

          // 2. Глаза
          if (hasTrait('eyes')) {
            ctx.fillStyle = eyeColor;
            ctx.beginPath();
            ctx.arc(cx - r * 0.4, cy - r * 0.4, 5, 0, Math.PI * 2);
            ctx.arc(cx - r * 0.4, cy + r * 0.4, 5, 0, Math.PI * 2);
            ctx.fill();

            // Зрачки
            ctx.fillStyle = pupilColor;
            ctx.beginPath();
            ctx.arc(cx - r * 0.55, cy - r * 0.4, 2.5, 0, Math.PI * 2);
            ctx.arc(cx - r * 0.55, cy + r * 0.4, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // 3. Жвалы / Клыки
          if (hasTrait('mandibles')) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            const bite = Math.sin(t * 5) * 5;
            // Верхний клык
            ctx.beginPath();
            ctx.moveTo(cx - r, cy - 6);
            ctx.lineTo(cx - r - 14, cy - 10 + bite);
            ctx.stroke();
            // Нижний клык
            ctx.beginPath();
            ctx.moveTo(cx - r, cy + 6);
            ctx.lineTo(cx - r - 14, cy + 10 - bite);
            ctx.stroke();
          }
        }

        // --- ХВОСТ / ПЛАВНИК ---
        if (hasTrait('tail') && (seg.type === 'tail' || idx === bodySegments.length - 1)) {
          ctx.strokeStyle = bodyStroke;
          ctx.lineWidth = 3;
          const tailWave = Math.sin(t * 5) * 16;
          ctx.beginPath();
          ctx.moveTo(cx + r, cy);
          ctx.quadraticCurveTo(cx + r + 20, cy + tailWave * 0.5, cx + r + 45, cy + tailWave);
          ctx.stroke();

          // Оперение / Плавник на конце хвоста
          ctx.fillStyle = bodyFill;
          ctx.beginPath();
          ctx.moveTo(cx + r + 35, cy + tailWave);
          ctx.lineTo(cx + r + 50, cy + tailWave - 10);
          ctx.lineTo(cx + r + 50, cy + tailWave + 10);
          ctx.fill();
        }
      });

      ctx.restore();
      requestAnimationFrame(render);
    }

    // Инициализация
    rebuildAnatomy();
    initShop();
    updateUI();
    requestAnimationFrame(render);
  </script>
</body>
</html>
