<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Warfront: Dynamic Frontline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b0f0d;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      user-select: none;
    }
    #gameCanvas {
      display: block;
      cursor: crosshair;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(14, 20, 16, 0.9);
      backdrop-filter: blur(6px);
      padding: 12px 16px;
      border: 1px solid #3d4f40;
      border-radius: 8px;
      color: #e0e8e2;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      z-index: 10;
    }
    .hud-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      color: #8fa895;
      text-transform: uppercase;
    }
    #minimap {
      border: 1px solid #4a6350;
      border-radius: 4px;
      background: #151d17;
      display: block;
      margin-bottom: 8px;
    }
    .stats {
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bar-bg {
      width: 100%;
      height: 7px;
      background: #232d26;
      border-radius: 3px;
      overflow: hidden;
    }
    #hp-bar-fill {
      height: 100%;
      width: 100%;
      background: #44bd32;
      transition: width 0.1s;
    }
    #respawn-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(139, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 100;
    }
    #respawn-screen h1 {
      font-size: 42px;
      letter-spacing: 3px;
      margin: 0 0 10px 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    #respawn-timer {
      font-size: 20px;
      color: #f5cd79;
    }
    #controls-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      pointer-events: none;
      background: rgba(0,0,0,0.6);
      padding: 5px 14px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="hud-title">Карта ТВД (Линия Фронта)</div>
  <canvas id="minimap" width="180" height="110"></canvas>
  <div class="stats">
    <div>ЗДОРОВЬЕ: <span id="hp-val">100</span>%</div>
    <div class="bar-bg"><div id="hp-bar-fill"></div></div>
    <div style="margin-top: 3px;">КОНТРОЛЬ КАРТЫ: <span id="control-val" style="color:#3880ff">50%</span></div>
  </div>
</div>

<div id="respawn-screen">
  <h1>ВЫ ПОГИБЛИ В БОЮ</h1>
  <div id="respawn-timer">Перерождение через: 3 сек...</div>
</div>

<div id="controls-hint">WASD — марш-бросок | Мышь — огонь | Давите врага числом для сдвига границы</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mCanvas = document.getElementById('minimap');
const mCtx = mCanvas.getContext('2d');

let screenW = canvas.width = window.innerWidth;
let screenH = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  screenW = canvas.width = window.innerWidth;
  screenH = canvas.height = window.innerHeight;
});

// --- ПАРАМЕТРЫ МИРА ---
const WORLD_W = 4000;
const WORLD_H = 2400;
const camera = { x: 0, y: 0 };

// Динамическая линия фронта: 40 полос по ширине мира
const SLICES = 40;
const SLICE_WIDTH = WORLD_W / SLICES;
// 1.0 = полный контроль Синих, 0.0 = полный контроль Красных
const territory = new Array(SLICES).fill(0.5);
// Инициализируем стартовые базы
for (let i = 0; i < SLICES; i++) {
  if (i < SLICES * 0.4) territory[i] = 1.0;
  else if (i > SLICES * 0.6) territory[i] = 0.0;
  else territory[i] = 0.5;
}

// Деревья (укрытия от пуль, замедляют шаг)
const trees = [];
for (let i = 0; i < 260; i++) {
  trees.push({
    x: 400 + Math.random() * (WORLD_W - 800),
    y: Math.random() * WORLD_H,
    r: 16 + Math.random() * 16,
    foliageR: 28 + Math.random() * 20
  });
}

// Окопы
const trenches = [
  { x: 900, y: 300, w: 45, h: 500 },
  { x: 900, y: 1400, w: 45, h: 600 },
  { x: 1980, y: 600, w: 60, h: 400 },
  { x: 1980, y: 1300, w: 60, h: 400 },
  { x: 3050, y: 400, w: 45, h: 600 },
  { x: 3050, y: 1400, w: 45, h: 600 }
];

// Управление
const keys = { w: false, a: false, s: false, d: false };
const mouse = { x: 0, y: 0, isDown: false };

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || e.key === 'ArrowUp') keys.w = true;
  if (k === 'a' || k === 'ф' || e.key === 'ArrowLeft') keys.a = true;
  if (k === 's' || k === 'ы' || e.key === 'ArrowDown') keys.s = true;
  if (k === 'd' || k === 'в' || e.key === 'ArrowRight') keys.d = true;
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || e.key === 'ArrowUp') keys.w = false;
  if (k === 'a' || k === 'ф' || e.key === 'ArrowLeft') keys.a = false;
  if (k === 's' || k === 'ы' || e.key === 'ArrowDown') keys.s = false;
  if (k === 'd' || k === 'в' || e.key === 'ArrowRight') keys.d = false;
});

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', e => { if (e.button === 0) mouse.isDown = true; });
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.isDown = false; });

// --- СУЩНОСТИ ---
class Unit {
  constructor(x, y, team, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.team = team; // 1 = Синие (наши), 2 = Красные
    this.isPlayer = isPlayer;
    this.hp = 100;
    this.baseSpeed = isPlayer ? 3.5 : 1.7 + Math.random() * 0.4;
    this.angle = 0;
    this.lastShot = 0;
    this.fireRate = isPlayer ? 170 : 750 + Math.random() * 450;
  }

  update(now) {
    let inWoods = false;
    for (let t of trees) {
      if (Math.hypot(t.x - this.x, t.y - this.y) < t.foliageR) {
        inWoods = true;
        break;
      }
    }
    const curSpeed = inWoods ? this.baseSpeed * 0.65 : this.baseSpeed;

    if (this.isPlayer) {
      let dx = 0;
      let dy = 0;
      if (keys.w) dy -= 1;
      if (keys.s) dy += 1;
      if (keys.a) dx -= 1;
      if (keys.d) dx += 1;

      if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
      this.move(dx * curSpeed, dy * curSpeed);

      const worldMouseX = mouse.x + camera.x;
      const worldMouseY = mouse.y + camera.y;
      this.angle = Math.atan2(worldMouseY - this.y, worldMouseX - this.x);

      if (mouse.isDown && now - this.lastShot > this.fireRate) {
        shoot(this.x, this.y, this.angle, this.team);
        this.lastShot = now;
      }
    } else {
      this.ai(now, curSpeed);
    }
  }

  move(vx, vy) {
    let nx = Math.max(20, Math.min(WORLD_W - 20, this.x + vx));
    let ny = Math.max(20, Math.min(WORLD_H - 20, this.y + vy));

    for (let t of trees) {
      if (Math.hypot(t.x - nx, t.y - ny) < t.r + this.radius) return;
    }
    this.x = nx;
    this.y = ny;
  }

  ai(now, speed) {
    let nearest = null;
    let minD = 420;

    for (let u of units) {
      if (u.team !== this.team && u.hp > 0) {
        let d = Math.hypot(u.x - this.x, u.y - this.y);
        if (d < minD) {
          minD = d;
          nearest = u;
        }
      }
    }

    if (nearest) {
      this.angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
      if (now - this.lastShot > this.fireRate) {
        shoot(this.x, this.y, this.angle + (Math.random() - 0.5) * 0.25, this.team);
        this.lastShot = now;
      }
      // Осторожное продвижение при перестрелке
      const dirX = this.team === 1 ? 1 : -1;
      this.move(dirX * speed * 0.3, (Math.random() - 0.5) * speed * 0.5);
    } else {
      // ИИ ищет спорный сектор и наступает туда
      const dirX = this.team === 1 ? 1 : -1;
      this.angle = dirX > 0 ? 0 : Math.PI;
      this.move(dirX * speed * 0.75, (Math.random() - 0.5) * speed * 0.6);
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Ствол
    ctx.fillStyle = '#111';
    ctx.fillRect(5, -2, 14, 4);

    // Тело
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.team === 1 ? (this.isPlayer ? '#2ecc71' : '#3880ff') : '#eb445a';
    ctx.fill();
    ctx.strokeStyle = '#0e1410';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (this.isPlayer) {
      ctx.beginPath();
      ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
      ctx.strokeStyle = '#2ecc71';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.restore();
  }
}

// Пули
const bullets = [];
function shoot(x, y, angle, team) {
  bullets.push({
    x: x + Math.cos(angle) * 15,
    y: y + Math.sin(angle) * 15,
    vx: Math.cos(angle) * 11,
    vy: Math.sin(angle) * 11,
    team: team,
    range: 55
  });
}

// --- СПАВН И РЕСПАВН ---
const units = [];
let player = new Unit(250, WORLD_H / 2, 1, true);
units.push(player);

let isRespawning = false;
function triggerPlayerRespawn() {
  if (isRespawning) return;
  isRespawning = true;
  const screen = document.getElementById('respawn-screen');
  const timerEl = document.getElementById('respawn-timer');
  screen.style.display = 'flex';

  let timeLeft = 3;
  timerEl.innerText = `Перерождение через: ${timeLeft} сек...`;

  const interval = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0) {
      timerEl.innerText = `Перерождение через: ${timeLeft} сек...`;
    } else {
      clearInterval(interval);
      screen.style.display = 'none';
      
      // Ищем самую передовую подконтрольную точку для респауна
      let safeSpawnX = 250;
      for (let i = 0; i < SLICES; i++) {
        if (territory[i] > 0.7) safeSpawnX = i * SLICE_WIDTH + 50;
        else break;
      }
      
      player.x = safeSpawnX;
      player.y = Math.random() * (WORLD_H - 400) + 200;
      player.hp = 100;
      isRespawning = false;
    }
  }, 1000);
}

// Стартовые боты
for (let i = 0; i < 35; i++) {
  units.push(new Unit(150 + Math.random() * 500, Math.random() * WORLD_H, 1));
  units.push(new Unit(WORLD_W - 150 - Math.random() * 500, Math.random() * WORLD_H, 2));
}

// Регулярный спавн подкреплений
setInterval(() => {
  const blueCount = units.filter(u => u.team === 1 && u.hp > 0).length;
  const redCount = units.filter(u => u.team === 2 && u.hp > 0).length;

  if (blueCount < 35) {
    units.push(new Unit(100 + Math.random() * 200, Math.random() * WORLD_H, 1));
  }
  if (redCount < 35) {
    units.push(new Unit(WORLD_W - 100 - Math.random() * 200, Math.random() * WORLD_H, 2));
  }
}, 2000);

// --- ГЛАВНЫЙ ЦИКЛ ---
function loop(now) {
  // 1. АПДЕЙТ ЮНИТОВ
  for (let i = units.length - 1; i >= 0; i--) {
    const u = units[i];
    if (u.hp <= 0) {
      if (u.isPlayer) {
        triggerPlayerRespawn();
      } else {
        units.splice(i, 1);
      }
      continue;
    }
    u.update(now);
  }

  // Пули
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.range--;

    let hit = false;
    for (let t of trees) {
      if (Math.hypot(t.x - b.x, t.y - b.y) < t.r) {
        hit = true;
        break;
      }
    }

    if (!hit) {
      for (let u of units) {
        if (u.team !== b.team && u.hp > 0) {
          if (Math.hypot(u.x - b.x, u.y - b.y) < u.radius + 2) {
            u.hp -= 34;
            hit = true;
            break;
          }
        }
      }
    }

    if (b.range <= 0 || hit) bullets.splice(i, 1);
  }

  // 2. ДИНАМИЧЕСКИЙ РАСЧЕТ ЛИНИИ ФРОНТА ПО ПОЛОСАМ
  for (let i = 0; i < SLICES; i++) {
    const startX = i * SLICE_WIDTH;
    const endX = startX + SLICE_WIDTH;

    // Считаем живых солдат в этой полосе
    let blueInSlice = 0;
    let redInSlice = 0;

    for (let u of units) {
      if (u.hp > 0 && u.x >= startX && u.x < endX) {
        if (u.team === 1) blueInSlice++;
        else redInSlice++;
      }
    }

    // Линия сдвигается туда, чьих солдат больше
    const diff = blueInSlice - redInSlice;
    if (diff > 0) {
      territory[i] = Math.min(1.0, territory[i] + 0.0015 * diff);
    } else if (diff < 0) {
      territory[i] = Math.max(0.0, territory[i] + 0.0015 * diff);
    }
  }

  // Камера следит за игроком
  camera.x = Math.max(0, Math.min(WORLD_W - screenW, player.x - screenW / 2));
  camera.y = Math.max(0, Math.min(WORLD_H - screenH, player.y - screenH / 2));

  // 3. ОТРИСОВКА МИРА
  ctx.clearRect(0, 0, screenW, screenH);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Отрисовка динамической земли (плавный градиент контроля)
  for (let i = 0; i < SLICES; i++) {
    const x = i * SLICE_WIDTH;
    const ctrl = territory[i]; // 1.0 (синий) ... 0.0 (красный)

    // Смешивание цветов земли в зависимости от оккупации
    const r = Math.floor(26 * ctrl + 60 * (1 - ctrl));
    const g = Math.floor(45 * ctrl + 25 * (1 - ctrl));
    const b = Math.floor(32 * ctrl + 25 * (1 - ctrl));

    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, 0, SLICE_WIDTH + 1, WORLD_H);

    // Легкая подсветка границы соприкосновения (фронта)
    if (i > 0 && Math.abs(territory[i] - territory[i-1]) > 0.2) {
      ctx.strokeStyle = 'rgba(245, 205, 121, 0.4)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, WORLD_H);
      ctx.stroke();
    }
  }

  // Окопы
  ctx.fillStyle = '#0f1411';
  trenches.forEach(t => {
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.strokeStyle = '#27382c';
    ctx.strokeRect(t.x, t.y, t.w, t.h);
  });

  // Пули
  ctx.fillStyle = '#f5cd79';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Юниты
  units.forEach(u => { if (u.hp > 0) u.draw(); });

  // Деревья
  trees.forEach(t => {
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fillStyle = '#3e2723';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(t.x, t.y, t.foliageR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(35, 75, 45, 0.78)';
    ctx.fill();
  });

  ctx.restore();

  // 4. МИНИКАРТА
  mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
  const sx = mCanvas.width / WORLD_W;
  const sy = mCanvas.height / WORLD_H;

  // Динамические полосы на миникарте
  for (let i = 0; i < SLICES; i++) {
    const x = i * SLICE_WIDTH * sx;
    const w = SLICE_WIDTH * sx;
    const ctrl = territory[i];

    // Синий -> Серый нейтрал -> Красный
    const r = Math.floor(41 * ctrl + 192 * (1 - ctrl));
    const g = Math.floor(128 * ctrl + 57 * (1 - ctrl));
    const b = Math.floor(185 * ctrl + 43 * (1 - ctrl));

    mCtx.fillStyle = `rgb(${r},${g},${b})`;
    mCtx.fillRect(x, 0, w + 1, mCanvas.height);
  }

  // Рамка экрана игрока
  mCtx.strokeStyle = '#ffffff';
  mCtx.lineWidth = 1;
  mCtx.strokeRect(camera.x * sx, camera.y * sy, screenW * sx, screenH * sy);

  // Бойцы
  units.forEach(u => {
    if (u.hp <= 0) return;
    mCtx.fillStyle = u.isPlayer ? '#2ecc71' : u.team === 1 ? '#fff' : '#e74c3c';
    mCtx.fillRect(u.x * sx, u.y * sy, u.isPlayer ? 3 : 2, u.isPlayer ? 3 : 2);
  });

  // HUD
  const hp = Math.max(0, player.hp);
  document.getElementById('hp-val').innerText = hp;
  document.getElementById('hp-bar-fill').style.width = hp + '%';

  const totalBlueControl = Math.round((territory.reduce((a, b) => a + b, 0) / SLICES) * 100);
  document.getElementById('control-val').innerText = totalBlueControl + '%';

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
