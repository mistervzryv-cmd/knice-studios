<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Frontline 1944 Mobile Edition</title>
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; margin: 0; padding: 0; }
    body {
      background: #080b09; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none; -webkit-user-select: none; touch-action: none;
      width: 100vw; height: 100vh;
    }
    #gameCanvas { display: block; width: 100%; height: 100%; }

    /* Меню */
    #menu-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, #162019 0%, #060807 90%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 200; color: #e0ece3; padding: 15px; text-align: center;
    }
    .menu-title { font-size: clamp(26px, 6vw, 42px); font-weight: 900; letter-spacing: 4px; margin-bottom: 4px; text-transform: uppercase; }
    .menu-sub { font-size: clamp(10px, 2.5vw, 13px); color: #7b9684; margin-bottom: 16px; }
    .class-selection { display: flex; gap: 10px; margin-bottom: 16px; }
    .class-card {
      background: rgba(255,255,255,0.03); border: 2px solid #283a2d; border-radius: 8px;
      padding: 10px 6px; width: clamp(90px, 22vw, 125px); cursor: pointer; text-align: center;
    }
    .class-card.active { border-color: #44bd32; background: rgba(68, 189, 50, 0.16); transform: scale(1.02); }
    .class-name { font-weight: bold; font-size: 11px; margin-bottom: 3px; color: #fff; }
    .class-desc { font-size: 9px; color: #8fa895; line-height: 1.2; }

    .diff-row { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; }
    .diff-btn {
      background: rgba(255,255,255,0.05); border: 1px solid #3d4f40; color: #a4b0be;
      padding: 7px 14px; border-radius: 5px; font-size: 11px; font-weight: bold;
    }
    .diff-btn.active-diff { border-color: #44bd32; background: rgba(68, 189, 50, 0.2); color: #fff; }
    .btn-action {
      background: #2e7d32; color: #fff; border: none; padding: 12px 42px;
      font-size: 16px; font-weight: bold; letter-spacing: 2px; border-radius: 6px;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
    }

    /* HUD */
    #hud {
      position: absolute; top: 10px; left: 10px;
      background: rgba(14, 20, 16, 0.92); backdrop-filter: blur(5px);
      padding: 8px 12px; border: 1px solid #3d4f40; border-radius: 8px;
      color: #e0e8e2; z-index: 10; display: none; font-size: 11px; width: 165px;
      pointer-events: none;
    }
    #minimap { border: 1px solid #4a6350; border-radius: 4px; background: #111713; display: block; margin-bottom: 6px; }
    .bar-bg { width: 100%; height: 6px; background: #232d26; border-radius: 3px; overflow: hidden; margin: 2px 0 4px 0; }
    #hp-bar-fill { height: 100%; width: 100%; background: #4cd137; }
    #stamina-bar-fill { height: 100%; width: 100%; background: #e1b12c; }

    #capture-hud {
      display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(14, 20, 16, 0.92); border: 1px solid #3d4f40; border-radius: 8px;
      padding: 6px 16px; text-align: center; color: #fff; z-index: 12; font-size: 11px;
      pointer-events: none;
    }
    #capture-bar-bg { width: 140px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    #capture-bar-fill { height: 100%; width: 50%; background: #f5cd79; }

    /* Тач Стики */
    .stick-zone {
      position: absolute; bottom: 25px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.03); border: 2px dashed rgba(255, 255, 255, 0.18);
      border-radius: 50%; z-index: 30; display: none;
    }
    #left-stick-zone { left: 25px; }
    #right-stick-zone { right: 85px; }
    .stick-thumb {
      position: absolute; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(76, 209, 55, 0.4); border: 2px solid #4cd137;
      top: 33px; left: 33px; pointer-events: none;
    }
    #right-stick-thumb { background: rgba(235, 68, 90, 0.4); border-color: #eb445a; }

    /* Экранные Кнопки Действий */
    #action-pad {
      position: absolute; bottom: 20px; right: 15px; display: none;
      flex-direction: column; gap: 8px; z-index: 40;
    }
    .touch-btn {
      width: 44px; height: 44px; border-radius: 50%; background: rgba(14, 20, 16, 0.88);
      border: 1.5px solid #3d4f40; color: #fff; font-weight: bold; font-size: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .touch-btn span { font-size: 7px; color: #8fa895; margin-top: 1px; }
    .touch-btn:active { background: #4cd137; color: #000; border-color: #fff; }

    /* Экраны Респауна и Финала */
    #respawn-screen, #gameover-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      backdrop-filter: blur(6px); flex-direction: column; justify-content: center; align-items: center;
      color: #fff; z-index: 150; background: rgba(10, 15, 12, 0.95); text-align: center; padding: 20px;
    }
    .end-title { font-size: 36px; font-weight: 900; letter-spacing: 3px; margin-bottom: 8px; }
  </style>
</head>
<body>

<div id="menu-overlay">
  <h1 class="menu-title">FRONTLINE 1944</h1>
  <div class="menu-sub">МОБИЛЬНОЕ ИЗДАНИЕ ТВД: 5 ВЫСОТ</div>

  <div class="class-selection">
    <div class="class-card active" onclick="selectClass('assault', this)">
      <div class="class-name">ШТУРМОВИК</div>
      <div class="class-desc">Скорость, 3 гранаты, захват.</div>
    </div>
    <div class="class-card" onclick="selectClass('sniper', this)">
      <div class="class-name">СНАЙПЕР</div>
      <div class="class-desc">Дальнобойный ваншот.</div>
    </div>
    <div class="class-card" onclick="selectClass('gunner', this)">
      <div class="class-name">ПУЛЕМЕТЧИК</div>
      <div class="class-desc">Броня, тяжелый шквал.</div>
    </div>
  </div>

  <div class="diff-row">
    <button type="button" class="diff-btn" onclick="setDifficulty('easy', this)">ЛЕГКО</button>
    <button type="button" class="diff-btn active-diff" onclick="setDifficulty('normal', this)">НОРМА</button>
    <button type="button" class="diff-btn" onclick="setDifficulty('hard', this)">ХАРД</button>
  </div>

  <button class="btn-action" onclick="startGame()">В БОЙ</button>
</div>

<div id="hud">
  <canvas id="minimap" width="140" height="85"></canvas>
  <div>HP: <span id="hp-val">100</span>% | СТАМИНА</div>
  <div class="bar-bg"><div id="hp-bar-fill"></div></div>
  <div class="bar-bg" style="margin-top:0;"><div id="stamina-bar-fill"></div></div>
  <div>СТАТУС: <b id="tactical-status" style="color:#4cd137">ГОТОВ</b></div>
  <div>ФРАГИ: <b id="kills-val" style="color: #e84118;">0</b> | БАЗЫ: <span id="blue-bases-count">2</span>/5</div>
</div>

<div id="capture-hud">
  <div id="capture-title">Высота 104</div>
  <div id="capture-bar-bg"><div id="capture-bar-fill"></div></div>
</div>

<div id="left-stick-zone" class="stick-zone"><div id="left-stick-thumb" class="stick-thumb"></div></div>
<div id="right-stick-zone" class="stick-zone"><div id="right-stick-thumb" class="stick-thumb"></div></div>

<div id="action-pad">
  <div class="touch-btn" id="btn-grenade">G<span>ГРАНАТА</span></div>
  <div class="touch-btn" id="btn-tank">E<span>ТАНК</span></div>
  <div class="touch-btn" id="btn-artillery">B<span>АРТА</span></div>
  <div class="touch-btn" id="btn-whistle">F<span>СВИСТОК</span></div>
</div>

<div id="respawn-screen">
  <h2>ВЫ ПАЛИ В БОЮ</h2>
  <div id="respawn-timer" style="color:#f5cd79; font-size: 15px; margin-top: 6px;">Возрождение на базе: 3 сек...</div>
</div>

<div id="gameover-screen">
  <div class="end-title" id="end-status">ПОБЕДА!</div>
  <div id="end-details" style="font-size: 14px; color: #a4b0be; margin-bottom: 20px; line-height: 1.5;"></div>
  <button class="btn-action" onclick="returnToMenu()">В ГЛАВНОЕ МЕНЮ</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// --- АУДИО (ГАРАНТИРОВАННЫЙ СТАРТ НА МОБИЛКАХ) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function resumeAudio() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  resumeAudio();
  const now = audioCtx.currentTime;

  if (type === 'shot') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(35, now + 0.08);
    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'sniper_shot') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.18);
    gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.18);
  } else if (type === 'cannon') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(25, now + 0.3);
    gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'hit') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.03);
    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.05);
  } else if (type === 'explosion') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(90, now); osc.frequency.exponentialRampToValueAtTime(18, now + 0.45);
    gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.45);
  } else if (type === 'whistle') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1700, now); osc.frequency.linearRampToValueAtTime(2300, now + 0.15);
    osc.frequency.linearRampToValueAtTime(1800, now + 0.3);
    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
  }
}

// --- КОНФИГУРАЦИЯ ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mCanvas = document.getElementById('minimap');
const mCtx = mCanvas.getContext('2d');

let screenW = canvas.width = window.innerWidth;
let screenH = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  screenW = canvas.width = window.innerWidth;
  screenH = canvas.height = window.innerHeight;
});

const WORLD_W = 4000;
const WORLD_H = 2200;
const camera = { x: 0, y: 0, shake: 0 };

let playerStats = { kills: 0, caps: 0, deaths: 0 };
let artilleryCooldown = 0;
let hitmarkerTimer = 0;
let floatingTexts = [];
let damageIndicators = [];
let respawnInterval = null;

let currentDifficulty = 'normal';
const diffCfg = {
  easy: { spread: 0.35, fireRateMult: 1.45, reactionDist: 360, tankAccuracy: 0.18 },
  normal: { spread: 0.20, fireRateMult: 1.0, reactionDist: 450, tankAccuracy: 0.08 },
  hard: { spread: 0.07, fireRateMult: 0.8, reactionDist: 540, tankAccuracy: 0.03 }
};

function setDifficulty(lvl, el) {
  currentDifficulty = lvl;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active-diff'));
  el.classList.add('active-diff');
}

let selectedClass = 'assault';
function selectClass(c, el) {
  selectedClass = c;
  document.querySelectorAll('.class-card').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function getRandomClass() {
  const r = Math.random();
  if (r < 0.65) return 'assault';
  if (r < 0.85) return 'gunner';
  return 'sniper';
}

// --- БАЗЫ И ФРОНТ ---
let bases = [];
function initBases() {
  bases = [
    { id: 1, name: "Лесопилка", x: 650, y: 550, owner: 1, capProgress: 1.0, radius: 160 },
    { id: 2, name: "Окопы у Ручья", x: 900, y: 1550, owner: 1, capProgress: 1.0, radius: 160 },
    { id: 3, name: "Высота 104", x: 2000, y: 1100, owner: 0, capProgress: 0.0, radius: 200 },
    { id: 4, name: "Восточная Роща", x: 3000, y: 650, owner: 2, capProgress: -1.0, radius: 160 },
    { id: 5, name: "Штабной Редут", x: 3350, y: 1600, owner: 2, capProgress: -1.0, radius: 190 }
  ];
}
initBases();

const FRONT_SECTIONS = 7;
const frontlineNodes = [];
for (let i = 0; i < FRONT_SECTIONS; i++) {
  frontlineNodes.push({
    y: (WORLD_H / (FRONT_SECTIONS - 1)) * i,
    x: WORLD_W * 0.5,
    targetX: WORLD_W * 0.5
  });
}

const trees = [];
for (let i = 0; i < 220; i++) {
  const tx = 300 + Math.random() * (WORLD_W - 600);
  const ty = Math.random() * WORLD_H;
  if (!bases.some(b => Math.hypot(b.x - tx, b.y - ty) < b.radius + 40)) {
    trees.push({ x: tx, y: ty, r: 15, foliageR: 26, alive: true });
  }
}

const trenches = [
  { x: 590, y: 440, w: 120, h: 40 },
  { x: 840, y: 1440, w: 120, h: 40 },
  { x: 1940, y: 990, w: 120, h: 40 },
  { x: 2940, y: 540, w: 120, h: 40 },
  { x: 3290, y: 1490, w: 120, h: 40 }
];

let craters = [];
let smokes = [];
let incomingMortars = [];
let tanks = [];

// --- ТАЧ-УПРАВЛЕНИЕ ---
const leftStick = { active: false, id: null, vx: 0, vy: 0 };
const rightStick = { active: false, id: null, angle: 0, firing: false };

const lZone = document.getElementById('left-stick-zone');
const lThumb = document.getElementById('left-stick-thumb');
const rZone = document.getElementById('right-stick-zone');
const rThumb = document.getElementById('right-stick-thumb');

window.addEventListener('touchstart', e => {
  resumeAudio();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const lRect = lZone.getBoundingClientRect();
    const rRect = rZone.getBoundingClientRect();

    if (!leftStick.active && t.clientX >= lRect.left - 25 && t.clientX <= lRect.right + 25 &&
        t.clientY >= lRect.top - 25 && t.clientY <= lRect.bottom + 25) {
      leftStick.active = true; leftStick.id = t.identifier;
      updateLeftStick(t.clientX, t.clientY, lRect);
    } else if (!rightStick.active && t.clientX >= rRect.left - 25 && t.clientX <= rRect.right + 25 &&
               t.clientY >= rRect.top - 25 && t.clientY <= rRect.bottom + 25) {
      rightStick.active = true; rightStick.id = t.identifier;
      updateRightStick(t.clientX, t.clientY, rRect);
    }
  }
}, { passive: false });

window.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (leftStick.active && t.identifier === leftStick.id) {
      updateLeftStick(t.clientX, t.clientY, lZone.getBoundingClientRect());
    } else if (rightStick.active && t.identifier === rightStick.id) {
      updateRightStick(t.clientX, t.clientY, rZone.getBoundingClientRect());
    }
  }
}, { passive: false });

function endTouchHandler(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === leftStick.id) {
      leftStick.active = false; leftStick.id = null;
      leftStick.vx = 0; leftStick.vy = 0;
      lThumb.style.transform = `translate(0px, 0px)`;
    } else if (t.identifier === rightStick.id) {
      rightStick.active = false; rightStick.id = null;
      rightStick.firing = false;
      rThumb.style.transform = `translate(0px, 0px)`;
    }
  }
}
window.addEventListener('touchend', endTouchHandler);
window.addEventListener('touchcancel', endTouchHandler);

function updateLeftStick(cx, cy, rect) {
  const mx = rect.left + rect.width / 2;
  const my = rect.top + rect.height / 2;
  let dx = cx - mx; let dy = cy - my;
  const d = Math.hypot(dx, dy);
  const maxR = 36;
  if (d > maxR) { dx = (dx / d) * maxR; dy = (dy / d) * maxR; }
  leftStick.vx = dx / maxR; leftStick.vy = dy / maxR;
  lThumb.style.transform = `translate(${dx}px, ${dy}px)`;
}

function updateRightStick(cx, cy, rect) {
  const mx = rect.left + rect.width / 2;
  const my = rect.top + rect.height / 2;
  let dx = cx - mx; let dy = cy - my;
  const d = Math.hypot(dx, dy);
  const maxR = 36;
  if (d > 12) { // Мертвая зона
    rightStick.angle = Math.atan2(dy, dx);
    rightStick.firing = true;
  } else {
    rightStick.firing = false;
  }
  if (d > maxR) { dx = (dx / d) * maxR; dy = (dy / d) * maxR; }
  rThumb.style.transform = `translate(${dx}px, ${dy}px)`;
}

document.getElementById('btn-grenade').addEventListener('touchstart', e => { e.stopPropagation(); resumeAudio(); throwGrenade(); });
document.getElementById('btn-tank').addEventListener('touchstart', e => { e.stopPropagation(); resumeAudio(); toggleTank(); });
document.getElementById('btn-artillery').addEventListener('touchstart', e => { e.stopPropagation(); resumeAudio(); callArtillery(); });
document.getElementById('btn-whistle').addEventListener('touchstart', e => { e.stopPropagation(); resumeAudio(); commandWhistle(); });

// --- ТАНКИ ---
class Tank {
  constructor(x, y, team) {
    this.x = x; this.y = y; this.team = team;
    this.hp = 550; this.maxHp = 550;
    this.hullAngle = team === 1 ? 0 : Math.PI;
    this.turretAngle = this.hullAngle;
    this.driver = null; this.radius = 24; this.speed = 2.0;
    this.lastShot = 0; this.fireRate = 1300;
  }

  update(now) {
    if (this.driver && this.driver.isPlayer) {
      if (leftStick.active) {
        this.hullAngle = Math.atan2(leftStick.vy, leftStick.vx);
        this.x = Math.max(35, Math.min(WORLD_W - 35, this.x + leftStick.vx * this.speed));
        this.y = Math.max(35, Math.min(WORLD_H - 35, this.y + leftStick.vy * this.speed));

        trees.forEach(t => {
          if (t.alive && Math.hypot(t.x - this.x, t.y - this.y) < t.r + this.radius) {
            t.alive = false; playSound('explosion'); craters.push({ x: t.x, y: t.y, r: 18 });
          }
        });
      }

      if (rightStick.firing) {
        this.turretAngle = rightStick.angle;
        if (now - this.lastShot > this.fireRate) {
          shootCannon(this.x, this.y, this.turretAngle, this.team, true);
          this.lastShot = now; camera.shake = 7;
        }
      }
    } else {
      this.ai(now);
    }
  }

  ai(now) {
    let nearest = null; let minD = 650;
    const diff = diffCfg[currentDifficulty];

    tanks.forEach(tk => {
      if (tk !== this && tk.team !== this.team && tk.hp > 0) {
        const d = Math.hypot(tk.x - this.x, tk.y - this.y);
        if (d < minD) { minD = d; nearest = tk; }
      }
    });

    units.forEach(u => {
      if (u.team !== this.team && u.hp > 0) {
        const d = Math.hypot(u.x - this.x, u.y - this.y);
        if (d < minD) { minD = d; nearest = u; }
      }
    });

    let targetX, targetY;
    if (this.hp < 160) {
      const home = this.team === 1 ? bases[0] : bases[4];
      targetX = home.x; targetY = home.y;
    } else if (nearest) {
      if (minD > 320) { targetX = nearest.x; targetY = nearest.y; }
      else if (minD < 180) {
        const back = Math.atan2(this.y - nearest.y, this.x - nearest.x);
        targetX = this.x + Math.cos(back) * 100; targetY = this.y + Math.sin(back) * 100;
      }
    } else {
      const targetBase = bases.find(b => b.owner !== this.team) || bases[2];
      targetX = targetBase.x; targetY = targetBase.y;
    }

    if (targetX !== undefined && targetY !== undefined) {
      const moveAngle = Math.atan2(targetY - this.y, targetX - this.x);
      this.hullAngle = moveAngle;
      this.x = Math.max(40, Math.min(WORLD_W - 40, this.x + Math.cos(moveAngle) * (this.speed * 0.7)));
      this.y = Math.max(40, Math.min(WORLD_H - 40, this.y + Math.sin(moveAngle) * (this.speed * 0.7)));

      trees.forEach(t => {
        if (t.alive && Math.hypot(t.x - this.x, t.y - this.y) < t.r + this.radius) {
          t.alive = false; playSound('explosion'); craters.push({ x: t.x, y: t.y, r: 18 });
        }
      });
    }

    if (nearest) {
      const targetTurret = Math.atan2(nearest.y - this.y, nearest.x - this.x);
      let dAng = targetTurret - this.turretAngle;
      while (dAng < -Math.PI) dAng += Math.PI * 2;
      while (dAng > Math.PI) dAng -= Math.PI * 2;
      this.turretAngle += dAng * 0.08;

      const rate = this.team === 2 ? this.fireRate * diff.fireRateMult : this.fireRate;
      if (now - this.lastShot > rate && Math.abs(dAng) < 0.25) {
        const sp = this.team === 2 ? (Math.random() - 0.5) * diff.tankAccuracy : 0.06;
        shootCannon(this.x, this.y, this.turretAngle + sp, this.team, false);
        this.lastShot = now;
      }
    }
  }

  draw() {
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.save(); ctx.rotate(this.hullAngle);
    ctx.fillStyle = this.team === 1 ? '#27496d' : '#8b2635';
    ctx.fillRect(-22, -15, 44, 30);
    ctx.fillStyle = '#141414';
    ctx.fillRect(-24, -18, 48, 6); ctx.fillRect(-24, 12, 48, 6);
    ctx.restore();

    ctx.save(); ctx.rotate(this.turretAngle);
    ctx.fillStyle = '#111'; ctx.fillRect(0, -3, 30, 6);
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fillStyle = this.team === 1 ? '#3880ff' : '#eb445a';
    ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore(); ctx.restore();
  }
}

function initTanks() {
  tanks = [
    new Tank(bases[0].x + 40, bases[0].y + 40, 1),
    new Tank(bases[4].x - 40, bases[4].y - 40, 2)
  ];
}

// --- БОЙЦЫ (SLIDE COLLISION) ---
class Unit {
  constructor(x, y, team, isPlayer = false, classType = 'assault') {
    this.x = x; this.y = y; this.radius = 10;
    this.team = team; this.isPlayer = isPlayer; this.classType = classType;
    this.stamina = 100; this.angle = 0; this.lastShot = 0;
    this.followingPlayer = false; this.grenades = 3; this.inTank = null;
    this.tactic = 'normal'; this.suppressionTimer = 0;
    this.flankOffset = (Math.random() - 0.5) * 550;

    if (classType === 'sniper') {
      this.baseSpeed = isPlayer ? 3.3 : 1.5; this.fireRate = 950;
      this.bulletDamage = 110; this.bulletSpeed = 18; this.hp = 85; this.maxHp = 85;
    } else if (classType === 'gunner') {
      this.baseSpeed = isPlayer ? 2.8 : 1.35; this.fireRate = 120;
      this.bulletDamage = 26; this.bulletSpeed = 11; this.hp = 140; this.maxHp = 140;
    } else {
      this.baseSpeed = isPlayer ? 3.6 : 1.8; this.fireRate = 190;
      this.bulletDamage = 35; this.bulletSpeed = 12; this.hp = 100; this.maxHp = 100;
    }
  }

  update(now) {
    if (this.inTank) {
      this.x = this.inTank.x; this.y = this.inTank.y;
      this.hp = Math.round((this.inTank.hp / this.inTank.maxHp) * 100);
      if (this.inTank.hp <= 0) { this.inTank = null; this.hp = 0; }
      return;
    }

    const inTrench = trenches.some(t => this.x > t.x && this.x < t.x + t.w && this.y > t.y && this.y < t.y + t.h);
    const inCrater = craters.some(c => Math.hypot(c.x - this.x, c.y - this.y) < c.r);
    const nearTree = trees.some(t => t.alive && Math.hypot(t.x - this.x, t.y - this.y) < t.foliageR);

    if (inTrench || inCrater || nearTree) {
      this.tactic = 'entrenched';
    } else if (this.suppressionTimer > 0) {
      this.tactic = 'suppressed'; this.suppressionTimer--;
    } else {
      this.tactic = 'normal';
    }

    let speedMult = 1.0;
    if (this.stamina < 20) speedMult *= 0.6;

    if (this.isPlayer) {
      if (leftStick.active) {
        this.stamina = Math.max(0, this.stamina - 0.25);
        this.move(leftStick.vx * this.baseSpeed * speedMult, leftStick.vy * this.baseSpeed * speedMult);
      } else {
        this.stamina = Math.min(100, this.stamina + 0.4);
      }

      if (rightStick.firing) {
        this.angle = rightStick.angle;
        if (now - this.lastShot > this.fireRate) {
          let spread = 0;
          if (this.stamina < 30) spread += (Math.random() - 0.5) * 0.15;
          if (this.tactic === 'suppressed') spread += (Math.random() - 0.5) * 0.25;
          shoot(this.x, this.y, this.angle + spread, this.team, this.bulletDamage, this.bulletSpeed, true, this.classType === 'sniper');
          this.lastShot = now;
        }
      } else if (leftStick.active) {
        this.angle = Math.atan2(leftStick.vy, leftStick.vx);
      }

      for (let i = crates.length - 1; i >= 0; i--) {
        if (Math.hypot(crates[i].x - this.x, crates[i].y - this.y) < 25) {
          this.hp = Math.min(this.maxHp, this.hp + 40);
          this.grenades = Math.min(5, this.grenades + 1);
          crates.splice(i, 1);
        }
      }
    } else {
      this.ai(now, speedMult);
    }
  }

  move(vx, vy) {
    let nx = this.x + vx; let ny = this.y + vy;

    for (let t of trees) {
      if (!t.alive) continue;
      const minD = t.r + this.radius;
      if (Math.hypot(t.x - nx, t.y - this.y) < minD) nx = this.x;
      if (Math.hypot(t.x - this.x, t.y - ny) < minD) ny = this.y;

      const curD = Math.hypot(t.x - nx, t.y - ny);
      if (curD < minD && curD > 0) {
        const push = Math.atan2(ny - t.y, nx - t.x);
        nx = t.x + Math.cos(push) * (minD + 1);
        ny = t.y + Math.sin(push) * (minD + 1);
      }
    }

    for (let u of units) {
      if (u !== this && u.hp > 0 && !u.inTank) {
        const d = Math.hypot(u.x - nx, u.y - ny);
        if (d < 22 && d > 0) {
          const push = Math.atan2(ny - u.y, nx - u.x);
          nx += Math.cos(push) * 1.5; ny += Math.sin(push) * 1.5;
        }
      }
    }

    this.x = Math.max(20, Math.min(WORLD_W - 20, nx));
    this.y = Math.max(20, Math.min(WORLD_H - 20, ny));
  }

  ai(now, speedMult) {
    let nearest = null;
    const diff = diffCfg[currentDifficulty];
    let baseReact = this.team === 2 ? diff.reactionDist : 450;
    let minD = this.classType === 'sniper' ? baseReact * 1.4 : baseReact;
    let isTargetTank = false;

    tanks.forEach(tk => {
      if (tk.team !== this.team && tk.hp > 0) {
        const d = Math.hypot(tk.x - this.x, tk.y - this.y);
        if (d < minD) { minD = d; nearest = tk; isTargetTank = true; }
      }
    });

    units.forEach(u => {
      if (u.team !== this.team && u.hp > 0 && !u.inTank) {
        if (smokes.some(s => Math.hypot(s.x - u.x, s.y - u.y) < s.r || Math.hypot(s.x - this.x, s.y - this.y) < s.r)) return;
        const d = Math.hypot(u.x - this.x, u.y - this.y);
        if (d < minD) { minD = d; nearest = u; isTargetTank = false; }
      }
    });

    if (nearest) {
      this.angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);

      if (isTargetTank && minD < 220 && this.classType === 'assault' && Math.random() < 0.007) {
        grenades.push({ x: this.x, y: this.y, tx: nearest.x, ty: nearest.y, timer: 60, isPlayerShot: false });
      }

      const rate = this.team === 2 ? this.fireRate * diff.fireRateMult : this.fireRate;
      let sp = this.team === 2 ? diff.spread : 0.2;
      if (this.classType === 'sniper') sp *= 0.3;
      if (this.classType === 'gunner') sp *= 1.3;

      if (this.classType === 'sniper') {
        if (minD < 320) {
          const back = this.angle + Math.PI;
          this.move(Math.cos(back) * this.baseSpeed * speedMult * 0.6, Math.sin(back) * this.baseSpeed * speedMult * 0.6);
        }
      } else if (this.classType === 'gunner') {
        if (this.tactic !== 'entrenched' && minD < 130) {
          const back = this.angle + Math.PI;
          this.move(Math.cos(back) * this.baseSpeed * speedMult * 0.4, Math.sin(back) * this.baseSpeed * speedMult * 0.4);
        }
      } else {
        if (minD < 130) {
          const back = this.angle + Math.PI;
          this.move(Math.cos(back) * this.baseSpeed * speedMult * 0.5, Math.sin(back) * this.baseSpeed * speedMult * 0.5);
        } else {
          const dirX = this.team === 1 ? 1 : -1;
          this.move(dirX * this.baseSpeed * speedMult * 0.35, (Math.random() - 0.5) * 0.8);
        }
      }

      if (now - this.lastShot > rate) {
        const spreadMod = this.tactic === 'entrenched' ? sp * 0.5 : sp;
        shoot(this.x, this.y, this.angle + (Math.random() - 0.5) * spreadMod, this.team, this.bulletDamage, this.bulletSpeed, false, this.classType === 'sniper');
        this.lastShot = now;
      }
    } else if (this.followingPlayer && player && player.hp > 0) {
      const dToP = Math.hypot(player.x - this.x, player.y - this.y);
      if (dToP > 80) {
        this.angle = Math.atan2(player.y - this.y, player.x - this.x);
        this.move(Math.cos(this.angle) * this.baseSpeed * speedMult, Math.sin(this.angle) * this.baseSpeed * speedMult);
      }
    } else {
      const targetBase = bases.find(b => b.owner !== this.team) || bases[2];
      const targetY = Math.max(100, Math.min(WORLD_H - 100, targetBase.y + this.flankOffset));
      const angle = Math.atan2(targetY - this.y, targetBase.x - this.x);
      this.angle = angle;
      this.move(Math.cos(angle) * this.baseSpeed * speedMult * 0.6, Math.sin(angle) * this.baseSpeed * speedMult * 0.6);
    }
  }

  draw() {
    if (this.inTank) return;
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);

    ctx.fillStyle = '#111';
    if (this.classType === 'sniper') {
      ctx.fillRect(4, -1.5, 19, 3); ctx.fillStyle = '#2d3436'; ctx.fillRect(8, -3.5, 7, 2);
    } else if (this.classType === 'gunner') {
      ctx.fillRect(4, -3.5, 15, 7); ctx.fillStyle = '#636e72'; ctx.fillRect(16, -5, 3, 10);
    } else {
      ctx.fillRect(5, -2, 14, 4);
    }

    ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.team === 1 ? (this.isPlayer ? '#2ecc71' : '#3880ff') : '#eb445a';
    ctx.fill(); ctx.strokeStyle = '#0e1410'; ctx.lineWidth = 2; ctx.stroke();

    if (this.tactic === 'entrenched') {
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
      ctx.strokeStyle = '#f5cd79'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (this.followingPlayer) {
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
      ctx.strokeStyle = '#4cd137'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();
  }
}

// --- ПУЛИ И АРТИЛЛЕРИЯ ---
let bullets = [];
let cannonShells = [];
let grenades = [];
let explosions = [];
let crates = [];

function shoot(x, y, angle, team, dmg, spd, isPlayerShot = false, isSniper = false) {
  bullets.push({
    x: x + Math.cos(angle) * 15, y: y + Math.sin(angle) * 15,
    vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
    damage: dmg, team: team,
    life: isSniper ? 75 : 55,
    isPlayerShot: isPlayerShot
  });
  if (isPlayerShot) {
    if (isSniper) playSound('sniper_shot');
    else playSound('shot');
  }
}

function shootCannon(x, y, angle, team, isPlayerShot = false) {
  playSound('cannon');
  cannonShells.push({
    x: x + Math.cos(angle) * 32, y: y + Math.sin(angle) * 32,
    vx: Math.cos(angle) * 18, vy: Math.sin(angle) * 18,
    team: team, life: 60,
    isPlayerShot: isPlayerShot
  });
}

function throwGrenade() {
  if (!player || player.hp <= 0 || player.grenades <= 0 || player.inTank) return;
  player.grenades--;
  const dist = 220;
  grenades.push({
    x: player.x, y: player.y,
    tx: player.x + Math.cos(player.angle) * dist,
    ty: player.y + Math.sin(player.angle) * dist,
    timer: 60, isPlayerShot: true
  });
}

function toggleTank() {
  if (!player || player.hp <= 0) return;
  if (player.inTank) {
    player.inTank.driver = null;
    player.x = player.inTank.x + 38; player.y = player.inTank.y;
    player.inTank = null;
  } else {
    const near = tanks.find(t => t.hp > 0 && Math.hypot(t.x - player.x, t.y - player.y) < 60 && !t.driver);
    if (near && near.team === player.team) {
      near.driver = player; player.inTank = near;
    }
  }
}

function callArtillery() {
  if (artilleryCooldown > 0 || !player || player.hp <= 0 || player.inTank) return;
  artilleryCooldown = 600;
  playSound('whistle');
  const tx = player.x + Math.cos(player.angle) * 280;
  const ty = player.y + Math.sin(player.angle) * 280;

  for (let i = 0; i < 4; i++) {
    incomingMortars.push({
      x: tx + (Math.random() - 0.5) * 150,
      y: ty + (Math.random() - 0.5) * 150,
      delay: 45 + i * 25,
      type: 'explosive'
    });
  }
}

function commandWhistle() {
  if (!player || player.hp <= 0 || player.inTank) return;
  playSound('whistle');
  units.forEach(u => {
    if (u.team === 1 && !u.isPlayer && u.hp > 0 && !u.inTank) {
      if (Math.hypot(u.x - player.x, u.y - player.y) < 420) u.followingPlayer = true;
    }
  });
}

// --- УПРАВЛЕНИЕ МАТЧЕМ ---
let units = [];
let player = null;
let gameRunning = false;
let isRespawning = false;

function startGame() {
  resumeAudio();
  if (respawnInterval) clearInterval(respawnInterval);

  document.getElementById('menu-overlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('left-stick-zone').style.display = 'block';
  document.getElementById('right-stick-zone').style.display = 'block';
  document.getElementById('action-pad').style.display = 'flex';
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById('respawn-screen').style.display = 'none';

  initBases();
  initTanks();

  playerStats = { kills: 0, caps: 0, deaths: 0 };
  artilleryCooldown = 0;
  isRespawning = false;

  bullets = []; cannonShells = []; grenades = []; explosions = [];
  crates = []; craters = []; smokes = []; incomingMortars = [];
  floatingTexts = []; damageIndicators = [];

  units = [];
  player = new Unit(bases[0].x, bases[0].y, 1, true, selectedClass);
  units.push(player);

  for (let i = 0; i < 20; i++) {
    units.push(new Unit(bases[0].x + (Math.random() - 0.5) * 150, bases[0].y + (Math.random() - 0.5) * 220, 1, false, getRandomClass()));
    units.push(new Unit(bases[4].x + (Math.random() - 0.5) * 150, bases[4].y + (Math.random() - 0.5) * 220, 2, false, getRandomClass()));
  }

  gameRunning = true;
  requestAnimationFrame(loop);
}

function returnToMenu() {
  gameRunning = false;
  if (respawnInterval) clearInterval(respawnInterval);
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('capture-hud').style.display = 'none';
  document.getElementById('left-stick-zone').style.display = 'none';
  document.getElementById('right-stick-zone').style.display = 'none';
  document.getElementById('action-pad').style.display = 'none';
  document.getElementById('respawn-screen').style.display = 'none';
  document.getElementById('menu-overlay').style.display = 'flex';
}

function triggerRespawn() {
  if (isRespawning) return;
  isRespawning = true;
  playerStats.deaths++;
  const screen = document.getElementById('respawn-screen');
  screen.style.display = 'flex';

  let timeLeft = 3;
  document.getElementById('respawn-timer').innerText = `Возрождение на базе: ${timeLeft} сек...`;

  if (respawnInterval) clearInterval(respawnInterval);
  respawnInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0) {
      document.getElementById('respawn-timer').innerText = `Возрождение на базе: ${timeLeft} сек...`;
    } else {
      clearInterval(respawnInterval);
      screen.style.display = 'none';

      const blueBases = bases.filter(b => b.owner === 1);
      const spawnBase = blueBases.length > 0 ? blueBases.reduce((prev, curr) => curr.x > prev.x ? curr : prev) : bases[0];

      let safeX = spawnBase.x; let safeY = spawnBase.y;
      for (let attempt = 0; attempt < 30; attempt++) {
        const tx = spawnBase.x + (Math.random() - 0.5) * 100;
        const ty = spawnBase.y + (Math.random() - 0.5) * 100;
        if (!trees.some(t => t.alive && Math.hypot(t.x - tx, t.y - ty) < t.r + player.radius + 6)) {
          safeX = tx; safeY = ty; break;
        }
      }

      player.x = safeX; player.y = safeY; player.hp = player.maxHp;
      player.stamina = 100; player.inTank = null;
      isRespawning = false;
    }
  }, 1000);
}

function checkEndGame() {
  if (!gameRunning) return;
  const blue = bases.filter(b => b.owner === 1).length;
  const red = bases.filter(b => b.owner === 2).length;

  if (blue === bases.length) endGame(true, "ПОБЕДА!");
  else if (red === bases.length) endGame(false, "ПОРАЖЕНИЕ");
}

function endGame(won, title) {
  gameRunning = false;
  if (respawnInterval) clearInterval(respawnInterval);
  const screen = document.getElementById('gameover-screen');
  document.getElementById('end-status').innerText = title;
  document.getElementById('end-status').style.color = won ? '#4cd137' : '#e84118';
  document.getElementById('end-details').innerHTML = `
    Ликвидировано: <b>${playerStats.kills}</b> бойцов<br>
    Захвачено высот: <b>${playerStats.caps}</b><br>
    Смертей: <b>${playerStats.deaths}</b>
  `;
  screen.style.display = 'flex';
}

setInterval(() => {
  if (!gameRunning) return;
  const blueB = bases.filter(b => b.owner === 1);
  const redB = bases.filter(b => b.owner === 2);

  if (units.filter(u => u.team === 1 && u.hp > 0).length < 24 && blueB.length > 0) {
    const sb = blueB[Math.floor(Math.random() * blueB.length)];
    units.push(new Unit(sb.x + (Math.random() - 0.5) * 80, sb.y + (Math.random() - 0.5) * 80, 1, false, getRandomClass()));
  }
  if (units.filter(u => u.team === 2 && u.hp > 0).length < 24 && redB.length > 0) {
    const sb = redB[Math.floor(Math.random() * redB.length)];
    units.push(new Unit(sb.x + (Math.random() - 0.5) * 80, sb.y + (Math.random() - 0.5) * 80, 2, false, getRandomClass()));
  }
}, 3000);

// --- ГЛАВНЫЙ ЦИКЛ ---
function loop(now) {
  if (!gameRunning) return;

  if (artilleryCooldown > 0) artilleryCooldown--;

  // 1. Апдейт бойцов
  for (let i = units.length - 1; i >= 0; i--) {
    const u = units[i];
    if (u.hp <= 0) {
      if (Math.random() < 0.35) crates.push({ x: u.x, y: u.y });
      if (u.isPlayer) triggerRespawn();
      else units.splice(i, 1);
      continue;
    }
    u.update(now);
  }

  // 2. Апдейт танков
  tanks.forEach(t => { if (t.hp > 0) t.update(now); });

  // 3. Минометы
  for (let i = incomingMortars.length - 1; i >= 0; i--) {
    const m = incomingMortars[i];
    m.delay--;
    if (m.delay <= 0) {
      playSound('explosion');
      explosions.push({ x: m.x, y: m.y, radius: 15, maxRadius: 100, alpha: 1.0 });
      craters.push({ x: m.x, y: m.y, r: 24 });
      camera.shake = 10;

      trees.forEach(t => { if (t.alive && Math.hypot(t.x - m.x, t.y - m.y) < 65) t.alive = false; });
      units.forEach(u => {
        const d = Math.hypot(u.x - m.x, u.y - m.y);
        if (d < 110) {
          u.hp -= Math.floor((1 - d / 110) * 190);
          if (u.team === 2 && u.hp <= 0) {
            playerStats.kills++;
            floatingTexts.push({ x: u.x, y: u.y, text: "+1 ФРАГ", alpha: 1.0 });
            hitmarkerTimer = 8; playSound('hit');
          }
        }
      });
      tanks.forEach(t => { if (Math.hypot(t.x - m.x, t.y - m.y) < 90) t.hp -= 120; });
      incomingMortars.splice(i, 1);
    }
  }

  // 4. Пули
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;

    let hit = false;
    for (let t of trees) {
      if (t.alive && Math.hypot(t.x - b.x, t.y - b.y) < t.r) { hit = true; break; }
    }

    if (!hit) {
      for (let tk of tanks) {
        if (tk.hp > 0 && Math.hypot(tk.x - b.x, tk.y - b.y) < tk.radius) {
          if (tk.team !== b.team) {
            tk.hp -= Math.floor(b.damage * 0.15);
            if (b.isPlayerShot) { hitmarkerTimer = 5; playSound('hit'); }
          }
          hit = true; break;
        }
      }
    }

    if (!hit) {
      for (let u of units) {
        if (u.team !== b.team && u.hp > 0 && !u.inTank) {
          const dist = Math.hypot(u.x - b.x, u.y - b.y);
          if (dist < 35) u.suppressionTimer = 40;

          if (dist < u.radius + 2) {
            const dmg = u.tactic === 'entrenched' ? b.damage * 0.5 : b.damage;
            u.hp -= dmg; hit = true;

            if (b.isPlayerShot) {
              hitmarkerTimer = 7; playSound('hit');
              if (u.hp <= 0) {
                playerStats.kills++;
                floatingTexts.push({ x: u.x, y: u.y, text: "+1 ФРАГ", alpha: 1.0 });
              }
            }
            if (u.isPlayer) {
              damageIndicators.push({ angle: Math.atan2(b.y - u.y, b.x - u.x), alpha: 1.0 });
            }
            break;
          }
        }
      }
    }
    if (b.life <= 0 || hit) bullets.splice(i, 1);
  }

  // 5. Фугасы
  for (let i = cannonShells.length - 1; i >= 0; i--) {
    const s = cannonShells[i];
    s.x += s.vx; s.y += s.vy; s.life--;

    let explode = false;
    for (let t of trees) {
      if (t.alive && Math.hypot(t.x - s.x, t.y - s.y) < t.r + 5) {
        t.alive = false; explode = true; break;
      }
    }

    for (let tk of tanks) {
      if (tk.team !== s.team && tk.hp > 0 && Math.hypot(tk.x - s.x, tk.y - s.y) < tk.radius + 5) {
        tk.hp -= 150; explode = true;
        if (s.isPlayerShot) { hitmarkerTimer = 8; playSound('hit'); }
        break;
      }
    }

    if (s.life <= 0 || explode) {
      playSound('explosion');
      explosions.push({ x: s.x, y: s.y, radius: 10, maxRadius: 80, alpha: 1.0 });
      craters.push({ x: s.x, y: s.y, r: 20 });
      camera.shake = 6;

      units.forEach(u => {
        const d = Math.hypot(u.x - s.x, u.y - s.y);
        if (d < 90) {
          u.hp -= Math.floor((1 - d / 90) * 170);
          if (s.isPlayerShot && u.team === 2 && u.hp <= 0) {
            playerStats.kills++;
            floatingTexts.push({ x: u.x, y: u.y, text: "+1 ФРАГ", alpha: 1.0 });
          }
        }
      });
      cannonShells.splice(i, 1);
    }
  }

  // 6. Гранаты
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.x += (g.tx - g.x) * 0.08; g.y += (g.ty - g.y) * 0.08; g.timer--;
    if (g.timer <= 0) {
      playSound('explosion');
      explosions.push({ x: g.x, y: g.y, radius: 10, maxRadius: 75, alpha: 1.0 });
      craters.push({ x: g.x, y: g.y, r: 18 });
      camera.shake = 7;

      trees.forEach(t => { if (t.alive && Math.hypot(t.x - g.x, t.y - g.y) < 40) t.alive = false; });
      units.forEach(u => {
        const d = Math.hypot(u.x - g.x, u.y - g.y);
        if (d < 85) {
          u.hp -= Math.floor((1 - d / 85) * 160);
          if (g.isPlayerShot && u.team === 2 && u.hp <= 0) {
            playerStats.kills++;
            floatingTexts.push({ x: u.x, y: u.y, text: "+1 ФРАГ", alpha: 1.0 });
          }
        }
      });
      tanks.forEach(t => { if (Math.hypot(t.x - g.x, t.y - g.y) < 70) t.hp -= 120; });
      grenades.splice(i, 1);
    }
  }

  for (let i = explosions.length - 1; i >= 0; i--) {
    const exp = explosions[i];
    exp.radius += 4; exp.alpha -= 0.05;
    if (exp.alpha <= 0) explosions.splice(i, 1);
  }

  // 7. Захват баз
  let playerAtBase = null;
  bases.forEach(b => {
    let blue = units.filter(u => u.team === 1 && Math.hypot(u.x - b.x, u.y - b.y) < b.radius).length;
    let red = units.filter(u => u.team === 2 && Math.hypot(u.x - b.x, u.y - b.y) < b.radius).length;
    const diff = blue - red;
    const oldOwner = b.owner;

    if (diff > 0) b.capProgress = Math.min(1.0, b.capProgress + 0.004);
    else if (diff < 0) b.capProgress = Math.max(-1.0, b.capProgress - 0.004);

    if (b.capProgress > 0.6) b.owner = 1;
    else if (b.capProgress < -0.6) b.owner = 2;
    else if (Math.abs(b.capProgress) < 0.2) b.owner = 0;

    if (oldOwner !== 1 && b.owner === 1) playerStats.caps++;
    if (player && Math.hypot(player.x - b.x, player.y - b.y) < b.radius) playerAtBase = b;
  });

  const capHud = document.getElementById('capture-hud');
  if (playerAtBase) {
    capHud.style.display = 'block';
    document.getElementById('capture-title').innerText = `${playerAtBase.name} (${playerAtBase.owner === 1 ? 'АЛЬЯНС' : playerAtBase.owner === 2 ? 'ВРАГ' : 'НЕЙТРАЛ'})`;
    const pct = Math.round(((playerAtBase.capProgress + 1) / 2) * 100);
    const fillEl = document.getElementById('capture-bar-fill');
    fillEl.style.width = pct + '%';
    fillEl.style.background = playerAtBase.owner === 1 ? '#3880ff' : playerAtBase.owner === 2 ? '#eb445a' : '#f5cd79';
  } else {
    capHud.style.display = 'none';
  }

  // 8. Векторная линия фронта
  for (let i = 0; i < FRONT_SECTIONS; i++) {
    const nodeY = frontlineNodes[i].y;
    let weightSum = 0, weightedX = 0;

    bases.forEach(b => {
      const distY = Math.abs(b.y - nodeY);
      const w = 1 / (1 + (distY * distY) * 0.000003);
      const target = b.owner === 1 ? b.x + 350 : (b.owner === 2 ? b.x - 350 : b.x);
      weightedX += target * w; weightSum += w;
    });

    frontlineNodes[i].targetX = weightSum > 0 ? (weightedX / weightSum) : (WORLD_W * 0.5);
    frontlineNodes[i].x += (frontlineNodes[i].targetX - frontlineNodes[i].x) * 0.04;
  }

  // Камера
  let shakeX = 0, shakeY = 0;
  if (camera.shake > 0) {
    shakeX = (Math.random() - 0.5) * camera.shake;
    shakeY = (Math.random() - 0.5) * camera.shake;
    camera.shake = Math.max(0, camera.shake - 0.5);
  }

  camera.x = Math.max(0, Math.min(WORLD_W - screenW, player.x - screenW / 2)) + shakeX;
  camera.y = Math.max(0, Math.min(WORLD_H - screenH, player.y - screenH / 2)) + shakeY;

  // Туман войны
  const visibleUnits = new Set();
  units.forEach(u => {
    if (u.team === 1) {
      visibleUnits.add(u);
    } else {
      const seen = units.some(blue => blue.team === 1 && Math.hypot(blue.x - u.x, blue.y - u.y) < 450);
      if (seen) visibleUnits.add(u);
    }
  });

  // --- РЕНДЕР ---
  ctx.clearRect(0, 0, screenW, screenH);
  ctx.save(); ctx.translate(-camera.x, -camera.y);

  ctx.fillStyle = '#141c16'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  craters.forEach(c => {
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fillStyle = '#0a0d0b'; ctx.fill(); ctx.strokeStyle = '#232b25'; ctx.lineWidth = 2; ctx.stroke();
  });

  ctx.fillStyle = '#0b0f0c';
  trenches.forEach(t => {
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.strokeStyle = '#27382c'; ctx.strokeRect(t.x, t.y, t.w, t.h);
  });

  // Векторная линия фронта
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(frontlineNodes[0].x, frontlineNodes[0].y);
  for (let i = 0; i < FRONT_SECTIONS - 1; i++) {
    const xc = (frontlineNodes[i].x + frontlineNodes[i + 1].x) / 2;
    const yc = (frontlineNodes[i].y + frontlineNodes[i + 1].y) / 2;
    ctx.quadraticCurveTo(frontlineNodes[i].x, frontlineNodes[i].y, xc, yc);
  }
  ctx.lineTo(frontlineNodes[FRONT_SECTIONS - 1].x, frontlineNodes[FRONT_SECTIONS - 1].y);
  ctx.strokeStyle = 'rgba(245, 205, 121, 0.45)';
  ctx.lineWidth = 4; ctx.setLineDash([12, 10]); ctx.stroke();
  ctx.restore();

  // Базы
  bases.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = b.owner === 1 ? 'rgba(56, 128, 255, 0.05)' : b.owner === 2 ? 'rgba(235, 68, 90, 0.05)' : 'rgba(255, 255, 255, 0.03)';
    ctx.fill(); ctx.strokeStyle = b.owner === 1 ? '#3880ff' : b.owner === 2 ? '#eb445a' : '#555';
    ctx.lineWidth = 2; ctx.stroke();

    ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI * 2); ctx.fillStyle = '#222'; ctx.fill();
    ctx.fillStyle = b.owner === 1 ? '#3880ff' : b.owner === 2 ? '#eb445a' : '#f5cd79';
    ctx.fillRect(b.x, b.y - 18, 24, 15);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y - 18, 24, 15);
  });

  tanks.forEach(tk => { if (tk.hp > 0) tk.draw(); });

  crates.forEach(cr => {
    ctx.fillStyle = '#27ae60'; ctx.fillRect(cr.x - 7, cr.y - 7, 14, 14);
    ctx.fillStyle = '#fff'; ctx.fillRect(cr.x - 5, cr.y - 2, 10, 4); ctx.fillRect(cr.x - 2, cr.y - 5, 4, 10);
  });

  grenades.forEach(g => {
    ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#2f3640'; ctx.fill(); ctx.strokeStyle = '#f5cd79'; ctx.stroke();
  });

  cannonShells.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9f43'; ctx.fill();
  });

  explosions.forEach(exp => {
    ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(243, 156, 18, ${exp.alpha})`; ctx.fill();
  });

  ctx.fillStyle = '#f5cd79';
  bullets.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2); ctx.fill();
  });

  units.forEach(u => {
    if (u.hp > 0 && visibleUnits.has(u)) u.draw();
  });

  trees.forEach(t => {
    if (!t.alive) return;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fillStyle = '#3e2723'; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x, t.y, t.foliageR, 0, Math.PI * 2); ctx.fillStyle = 'rgba(32, 68, 41, 0.8)'; ctx.fill();
  });

  ctx.restore();

  // Хитмаркер
  if (hitmarkerTimer > 0) {
    hitmarkerTimer--;
    ctx.save(); ctx.translate(screenW / 2, screenH / 2);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-6, -6); ctx.lineTo(-2, -2);
    ctx.moveTo(6, -6);  ctx.lineTo(2, -2);
    ctx.moveTo(-6, 6);  ctx.lineTo(-2, 2);
    ctx.moveTo(6, 6);   ctx.lineTo(2, 2);
    ctx.stroke(); ctx.restore();
  }

  // Фраги
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.6; ft.alpha -= 0.02;
    if (ft.alpha <= 0) { floatingTexts.splice(i, 1); continue; }
    ctx.save(); ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = `rgba(232, 65, 24, ${ft.alpha})`;
    ctx.fillText(ft.text, ft.x - camera.x, ft.y - camera.y);
    ctx.restore();
  }

  // Индикатор урона
  for (let i = damageIndicators.length - 1; i >= 0; i--) {
    const di = damageIndicators[i];
    di.alpha -= 0.025;
    if (di.alpha <= 0) { damageIndicators.splice(i, 1); continue; }
    ctx.save(); ctx.translate(screenW / 2, screenH / 2); ctx.rotate(di.angle);
    ctx.beginPath(); ctx.arc(0, 0, 80, -0.35, 0.35);
    ctx.strokeStyle = `rgba(235, 68, 90, ${di.alpha})`; ctx.lineWidth = 5; ctx.stroke();
    ctx.restore();
  }

  // Миникарта
  mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
  const sx = mCanvas.width / WORLD_W; const sy = mCanvas.height / WORLD_H;

  mCtx.save();
  mCtx.fillStyle = 'rgba(41, 128, 185, 0.4)';
  mCtx.beginPath(); mCtx.moveTo(0, 0);
  for (let i = 0; i < FRONT_SECTIONS - 1; i++) {
    const x1 = frontlineNodes[i].x * sx, y1 = frontlineNodes[i].y * sy;
    const x2 = frontlineNodes[i + 1].x * sx, y2 = frontlineNodes[i + 1].y * sy;
    mCtx.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2);
  }
  mCtx.lineTo(frontlineNodes[FRONT_SECTIONS - 1].x * sx, mCanvas.height);
  mCtx.lineTo(0, mCanvas.height); mCtx.closePath(); mCtx.fill();

  mCtx.fillStyle = 'rgba(192, 57, 43, 0.4)';
  mCtx.beginPath(); mCtx.moveTo(mCanvas.width, 0);
  for (let i = 0; i < FRONT_SECTIONS - 1; i++) {
    const x1 = frontlineNodes[i].x * sx, y1 = frontlineNodes[i].y * sy;
    const x2 = frontlineNodes[i + 1].x * sx, y2 = frontlineNodes[i + 1].y * sy;
    mCtx.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2);
  }
  mCtx.lineTo(frontlineNodes[FRONT_SECTIONS - 1].x * sx, mCanvas.height);
  mCtx.lineTo(mCanvas.width, mCanvas.height); mCtx.closePath(); mCtx.fill();

  mCtx.beginPath();
  mCtx.moveTo(frontlineNodes[0].x * sx, frontlineNodes[0].y * sy);
  for (let i = 0; i < FRONT_SECTIONS - 1; i++) {
    const x1 = frontlineNodes[i].x * sx, y1 = frontlineNodes[i].y * sy;
    const x2 = frontlineNodes[i + 1].x * sx, y2 = frontlineNodes[i + 1].y * sy;
    mCtx.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2);
  }
  mCtx.strokeStyle = '#f5cd79'; mCtx.lineWidth = 1.5; mCtx.stroke();
  mCtx.restore();

  bases.forEach(b => {
    mCtx.fillStyle = b.owner === 1 ? '#3880ff' : b.owner === 2 ? '#eb445a' : '#f5cd79';
    mCtx.beginPath(); mCtx.arc(b.x * sx, b.y * sy, 3, 0, Math.PI * 2); mCtx.fill();
  });

  units.forEach(u => {
    if (u.hp <= 0 || !visibleUnits.has(u)) return;
    mCtx.fillStyle = u.isPlayer ? '#2ecc71' : (u.team === 1 ? '#fff' : '#e74c3c');
    mCtx.fillRect(u.x * sx, u.y * sy, 2, 2);
  });

  // UI
  const hpP = Math.max(0, Math.round((player.hp / player.maxHp) * 100));
  document.getElementById('hp-val').innerText = player.inTank ? `ТАНК: ${hpP}` : hpP;
  document.getElementById('hp-bar-fill').style.width = hpP + '%';

  const stP = Math.max(0, Math.round(player.stamina));
  document.getElementById('stamina-bar-fill').style.width = (player.inTank ? 100 : stP) + '%';
  document.getElementById('kills-val').innerText = playerStats.kills;

  const tacStatus = document.getElementById('tactical-status');
  if (player.inTank) { tacStatus.innerText = "В ТАНКЕ"; tacStatus.style.color = "#3880ff"; }
  else if (player.tactic === 'entrenched') { tacStatus.innerText = "В УКРЫТИИ (-50%)"; tacStatus.style.color = "#f5cd79"; }
  else if (player.tactic === 'suppressed') { tacStatus.innerText = "ПОДАВЛЕН"; tacStatus.style.color = "#e84118"; }
  else if (player.stamina < 20) { tacStatus.innerText = "ИСТОЩЕНИЕ"; tacStatus.style.color = "#e1b12c"; }
  else { tacStatus.innerText = "ГОТОВ"; tacStatus.style.color = "#4cd137"; }

  document.getElementById('blue-bases-count').innerText = bases.filter(b => b.owner === 1).length;

  checkEndGame();
  requestAnimationFrame(loop);
}
</script>
