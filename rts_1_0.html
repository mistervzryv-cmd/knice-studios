<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HTML5 RTS - Master Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e6edf3}
canvas#game{display:block;width:100%;height:100%;cursor:default}

#top-bar{
    position:fixed;top:0;left:0;right:0;height:46px;
    background:linear-gradient(180deg,rgba(15,20,28,.95) 0%,rgba(10,14,20,.85) 100%);
    border-bottom:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;
    user-select:none;z-index:20;font-size:13px;backdrop-filter:blur(6px)
}
.res-group{display:flex;gap:20px;align-items:center}
.res-item{display:flex;align-items:center;gap:6px;font-weight:600}
.res-icon{width:14px;height:14px;border-radius:3px;display:inline-block}
.icon-food{background:#2ecc71;box-shadow:0 0 6px rgba(46,204,113,.4)}
.icon-wood{background:#e67e22;box-shadow:0 0 6px rgba(230,126,34,.4)}
.icon-gold{background:#f1c40f;box-shadow:0 0 6px rgba(241,196,15,.4)}
.icon-pop{background:#9b59b6;box-shadow:0 0 6px rgba(155,89,182,.4)}

#meta-group{display:flex;gap:18px;align-items:center;font-weight:500}
.badge{background:rgba(255,255,255,.08);padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.08)}
.badge-gold{color:#ffe45c;border-color:rgba(255,228,92,.3)}

#bottom-bar{
    position:fixed;bottom:0;left:0;right:0;height:160px;
    background:linear-gradient(0deg,rgba(10,14,22,.96) 0%,rgba(16,22,34,.9) 100%);
    border-top:1px solid rgba(255,255,255,.12);
    display:grid;grid-template-columns:220px 1fr 280px;
    user-select:none;z-index:20;backdrop-filter:blur(8px)
}

#minimap-wrapper{
    padding:10px;display:flex;align-items:center;justify-content:center;
    border-right:1px solid rgba(255,255,255,.08);position:relative
}
#minimap{
    border:1px solid rgba(255,255,255,.2);background:#000;
    width:200px;height:136px;cursor:crosshair;border-radius:4px
}

#panel-selection{
    padding:12px 18px;display:flex;gap:20px;align-items:center;
    border-right:1px solid rgba(255,255,255,.08);overflow:hidden
}
#portrait-box{
    width:70px;height:70px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.15);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-weight:bold;
    font-size:24px;color:#8ab4f8;flex-shrink:0
}
#entity-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#entity-title{font-size:16px;font-weight:bold;color:#fff}
#entity-hp-wrap{width:180px;height:8px;background:rgba(0,0,0,.6);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
#entity-hp-fill{height:100%;background:#2ecc71;width:100%;transition:width .1s}
#entity-desc{font-size:12px;color:#9aa0a6}

#panel-actions{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.actions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hud-btn{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:5px;color:#e6edf3;padding:8px 6px;font-size:11px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:all .15s;text-align:center
}
.hud-btn:hover{background:rgba(255,255,255,.12);border-color:#ffe45c;color:#ffe45c;transform:translateY(-1px)}
.hud-btn:active{transform:translateY(0)}
.hud-btn kbd{font-size:9px;background:rgba(0,0,0,.4);padding:1px 4px;border-radius:3px;color:#ffe45c}

#groups-hud{
    position:fixed;left:14px;top:54px;display:flex;gap:6px;z-index:20
}
.group-badge{
    width:24px;height:24px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);
    border-radius:4px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;color:#9aa0a6;cursor:pointer
}
.group-badge.active{border-color:#ffe45c;color:#ffe45c;background:rgba(255,228,92,.15)}

#end-screen{
    position:fixed;inset:0;background:rgba(8,11,16,.9);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;backdrop-filter:blur(8px)
}
#end-title{font-size:60px;font-weight:900;letter-spacing:3px;margin:0 0 16px}
#end-stats{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
    padding:24px 36px;border-radius:10px;min-width:360px;line-height:2;
    font-size:15px;margin-bottom:24px
}
#restart-btn{
    padding:14px 40px;font-size:16px;font-weight:700;color:#0b0f17;
    background:#ffe45c;border:none;border-radius:6px;cursor:pointer;
    box-shadow:0 4px 18px rgba(255,228,92,.35);transition:all .2s
}
#restart-btn:hover{background:#fff285;transform:scale(1.05)}
</style>
</head>
<body>
<div id="top-bar">
    <div class="res-group">
        <div class="res-item"><span class="res-icon icon-food"></span><span id="res-food">300</span></div>
        <div class="res-item"><span class="res-icon icon-wood"></span><span id="res-wood">250</span></div>
        <div class="res-item"><span class="res-icon icon-gold"></span><span id="res-gold">200</span></div>
        <div class="res-item"><span class="res-icon icon-pop"></span><span id="res-pop">2/10</span></div>

<canvas id="game"></canvas>

<div id="bottom-bar">
    <div id="minimap-wrapper">
        <canvas id="minimap" width="200" height="136"></canvas>
    </div>
    <div id="panel-selection">
        <div id="portrait-box">-</div>
        <div id="entity-info">
            <div id="entity-title">None Selected</div>
            <div id="entity-hp-wrap"><div id="entity-hp-fill"></div></div>
            <div id="entity-desc">Select units or buildings using LMB or Drag Box</div>

    <div id="panel-actions">
        <div style="font-size:11px;color:#8ab4f8;font-weight:bold;margin-bottom:2px">COMMANDS & BUILD</div>
        <div class="actions-grid">
            <button class="hud-btn" id="btn-build-th"><kbd>1</kbd> Citadel</button>
            <button class="hud-btn" id="btn-build-barracks"><kbd>2</kbd> Barracks</button>

            <button class="hud-btn" id="btn-build-mine"><kbd>4</kbd> Mine</button>
            <button class="hud-btn" id="btn-train-worker"><kbd>Q</kbd> Worker</button>
            <button class="hud-btn" id="btn-train-warrior"><kbd>E</kbd> Warrior</button>
            <button class="hud-btn" id="btn-upgrade"><kbd>U</kbd> Upgrade</button>
            <button class="hud-btn" id="btn-cancel"><kbd>Esc</kbd> Cancel</button>
        </div>
    </div>
</div>

<div id="end-screen">
    <div id="end-title">VICTORY</div>
    <div id="end-stats"></div>
    <button id="restart-btn">Play Again</button>
</div>

<script>
const canvas=document.getElementById('game')
const ctx=canvas.getContext('2d')
const minimapCanvas=document.getElementById('minimap')
const mctx=minimapCanvas.getContext('2d')

const resFoodEl=document.getElementById('res-food')
const resWoodEl=document.getElementById('res-wood')
const resGoldEl=document.getElementById('res-gold')
const resPopEl=document.getElementById('res-pop')
const hudTimerEl=document.getElementById('hud-timer')
const hudKillsEl=document.getElementById('hud-kills')
const portraitBox=document.getElementById('portrait-box')
const entityTitle=document.getElementById('entity-title')
const entityHpFill=document.getElementById('entity-hp-fill')
const entityDesc=document.getElementById('entity-desc')

const endScreen=document.getElementById('end-screen')
const endTitle=document.getElementById('end-title')
const endStats=document.getElementById('end-stats')
const restartBtn=document.getElementById('restart-btn')

const TILE_SIZE=32
const MAP_WIDTH=80
const MAP_HEIGHT=50
const MAX_BUILD_DISTANCE=8

const TILE_TYPES={
    LAND:'land',
    WATER:'water',
    FOREST:'forest',
    GOLD:'gold'
}

const BUILDING_TYPES={
    TOWN_HALL:'townHall',
    BARRACKS:'barracks',
    FARM:'farm',
    MINE:'mine'
}

const UNIT_TYPES={
    WORKER:'worker',
    WARRIOR:'warrior'
}

const COLORS={
    land:'#3f6e36',
    landGrid:'#396331',
    water:'#23537d',
    forest:'#1e4f28',
    forestTree:'#13381b',
    gold:'#a6851e',
    player:'#4da6ff',
    enemy:'#ff4757',
    selected:'#ffe45c',
    validGhost:'rgba(46,204,113,.45)',
    invalidGhost:'rgba(231,76,60,.45)',
    buildZone:'rgba(77,166,255,.06)'
}

function resize(){
    canvas.width=innerWidth
    canvas.height=innerHeight
}
addEventListener('resize',resize)
resize()

class SoundSystem{
    constructor(){
        this.ctx=null
    }

    init(){
        if(!this.ctx){
            const AudioContext=window.AudioContext||window.webkitAudioContext
            if(AudioContext) this.ctx=new AudioContext()
        }
        if(this.ctx&&this.ctx.state==='suspended'){
            this.ctx.resume()
        }
    }

    tone(freq,type,duration,gainVal=0.1){
        if(!this.ctx) return
        try{
            const osc=this.ctx.createOscillator()
            const g=this.ctx.createGain()
            osc.type=type
            osc.frequency.setValueAtTime(freq,this.ctx.currentTime)
            g.gain.setValueAtTime(gainVal,this.ctx.currentTime)
            g.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+duration)
            osc.connect(g)
            g.connect(this.ctx.destination)
            osc.start()
            osc.stop(this.ctx.currentTime+duration)
        }catch(e){}
    }

    playSelect(){
        this.init()
        this.tone(680,'sine',0.06,0.06)
    }

    playOrder(){
        this.init()
        this.tone(480,'sine',0.08,0.07)
    }

    playBuild(){
        this.init()
        this.tone(200,'triangle',0.12,0.12)
        setTimeout(()=>{this.tone(320,'triangle',0.1,0.1)},70)
    }

    playAttack(){
        this.init()
        this.tone(140,'sawtooth',0.09,0.1)
    }

    playSpawn(){
        this.init()
        this.tone(520,'sine',0.1,0.08)
        setTimeout(()=>{this.tone(780,'sine',0.12,0.08)},80)
    }

    playVictory(){
        this.init()
        const notes=[440,554,659,880]
        notes.forEach((freq,idx)=>{
            setTimeout(()=>{this.tone(freq,'triangle',0.3,0.15)},idx*120)
        })
    }

    playDefeat(){
        this.init()
        const notes=[440,392,349,261]
        notes.forEach((freq,idx)=>{
            setTimeout(()=>{this.tone(freq,'sawtooth',0.35,0.15)},idx*140)
        })
    }
}

class ParticleSystem{
    constructor(){
        this.particles=[]
    }

    emit(x,y,color,count=6,speed=1.5,life=0.5,radius=2.5){
        for(let i=0;i<count;i++){
            const angle=Math.random()*Math.PI*2
            const spd=(Math.random()*0.7+0.3)*speed
            this.particles.push({
                x,y,
                vx:Math.cos(angle)*spd,
                vy:Math.sin(angle)*spd,
                color,
                life,
                maxLife:life,
                radius
            })
        }
    }

    update(dt){
        for(const p of this.particles){
            p.x+=p.vx*dt*60
            p.y+=p.vy*dt*60
            p.life-=dt
        }
        this.particles=this.particles.filter(p=>p.life>0)
    }

    draw(ctx){
        for(const p of this.particles){
            const alpha=Math.max(0,p.life/p.maxLife)
            ctx.save()
            ctx.globalAlpha=alpha
            ctx.fillStyle=p.color
            ctx.beginPath()
            ctx.arc(p.x*TILE_SIZE,p.y*TILE_SIZE,p.radius,0,Math.PI*2)
            ctx.fill()
            ctx.restore()
        }
    }
}

class Tile{
    constructor(x,y,type){
        this.x=x
        this.y=y
        this.type=type
        this.building=null
        this.unit=null
        this.resourceType=null
        this.resourceAmount=0

        if(type===TILE_TYPES.FOREST){
            this.resourceType='wood'
            this.resourceAmount=1000
        }
        if(type===TILE_TYPES.GOLD){
            this.resourceType='gold'
            this.resourceAmount=1000
        }
    }

    isWalkable(){
        return this.type!==TILE_TYPES.WATER&&!this.building
    }
}

class GameMap{
    constructor(width,height){
        this.width=width
        this.height=height
        this.tiles=[]
        this.generate()
    }

    generate(){
        this.tiles=Array.from({length:this.height},(_,y)=>
            Array.from({length:this.width},(_,x)=>{
                const r=Math.random()
                let type=TILE_TYPES.LAND
                if(r<.13) type=TILE_TYPES.WATER
                else if(r<.25) type=TILE_TYPES.FOREST
                else if(r<.29) type=TILE_TYPES.GOLD
                return new Tile(x,y,type)
            })
        )
        this.makeSafeArea(6,6,8)
        this.makeSafeArea(this.width-7,this.height-7,8)
    }

    makeSafeArea(cx,cy,r){
        for(let y=cy-r;y<=cy+r;y++){
            for(let x=cx-r;x<=cx+r;x++){
                if(this.inBounds(x,y)){
                    const d=Math.hypot(x-cx,y-cy)
                    if(d<=r){
                        const tile=this.getTile(x,y)
                        tile.type=TILE_TYPES.LAND
                        tile.resourceType=null
                        tile.resourceAmount=0
                    }
                }
            }
        }
    }

    inBounds(x,y){
        return x>=0&&y>=0&&x<this.width&&y<this.height
    }

    getTile(x,y){
        if(!this.inBounds(x,y)) return null
        return this.tiles[y][x]
    }
}

class Player{
    constructor(name,team){
        this.name=name
        this.team=team
        this.resources={
            food:300,
            wood:250,
            gold:200
        }
        this.buildings=[]
        this.units=[]
        this.defeated=false
        this.stats={
            workersCreated:1,
            warriorsCreated:0,
            buildingsBuilt:1,
            enemiesKilled:0,
            gathered:{food:0,wood:0,gold:0}
        }
    }

    get population(){
        return this.units.filter(u=>u.hp>0).length
    }

    get queuedUnitsCount(){
        let count=0
        for(const b of this.buildings) count+=b.productionQueue.length
        return count
    }

    get maxPopulation(){
        let cap=0
        for(const b of this.buildings){
            if(b.underConstruction) continue
            if(b.type===BUILDING_TYPES.TOWN_HALL){
                if(b.level===3) cap+=20
                else if(b.level===2) cap+=12
                else cap+=6
            }
            if(b.type===BUILDING_TYPES.FARM) cap+=5
        }
        return Math.min(60,cap)
    }

    canAfford(cost){
        return Object.entries(cost).every(([r,v])=>(this.resources[r]||0)>=v)
    }

    spend(cost){
        if(!this.canAfford(cost)) return false
        for(const [r,v] of Object.entries(cost)) this.resources[r]-=v
        return true
    }

    addResource(type,amount){
        this.resources[type]=(this.resources[type]||0)+amount
        if(this.stats.gathered[type]!==undefined) this.stats.gathered[type]+=amount
    }
}

class Building{
    constructor(game,x,y,owner,constructionTime=5){
        this.game=game
        this.x=x
        this.y=y
        this.owner=owner
        this.type='building'
        this.maxHp=500
        this.hp=50
        this.underConstruction=true
        this.constructionTime=constructionTime
        this.constructionProgress=0
        this.productionQueue=[]
        this.productionProgress=0
    }

    update(dt){
        if(this.underConstruction){
            this.constructionProgress+=dt
            const p=Math.min(1,this.constructionProgress/this.constructionTime)
            this.hp=Math.max(1,Math.floor(this.maxHp*(0.1+0.9*p)))

            if(Math.random()<0.3){
                this.game.particles.emit(this.x+0.5,this.y+0.5,'#d2b48c',1,0.8,0.3,2)
            }

            if(this.constructionProgress>=this.constructionTime){
                this.underConstruction=false
                this.hp=this.maxHp
                this.game.sounds.playBuild()
                this.game.particles.emit(this.x+0.5,this.y+0.5,'#2ecc71',12,2,0.6,3)
            }
        }
    }
}

class TownHall extends Building{
    constructor(game,x,y,owner,instant=false){
        super(game,x,y,owner,8)
        this.type=BUILDING_TYPES.TOWN_HALL
        this.level=1
        this.maxLevel=3
        this.maxHp=1000
        this.isUpgrading=false
        this.upgradeProgress=0
        this.upgradeDuration=0
        this.upgradeCosts={1:{wood:200,gold:150},2:{wood:350,gold:300}}
        this.upgradeTimes={1:10,2:15}

        if(instant){
            this.underConstruction=false
            this.hp=this.maxHp
            this.constructionProgress=this.constructionTime
        }else{
            this.hp=100
        }
    }

    canUpgrade(){
        if(this.underConstruction||this.isUpgrading||this.level>=this.maxLevel) return false
        if(this.productionQueue.length>0) return false
        return this.owner.canAfford(this.upgradeCosts[this.level])
    }

    startUpgrade(){
        if(!this.canUpgrade()) return false
        if(!this.owner.spend(this.upgradeCosts[this.level])) return false
        this.isUpgrading=true
        this.upgradeProgress=0
        this.upgradeDuration=this.upgradeTimes[this.level]
        this.game.sounds.playBuild()
        return true
    }

    update(dt){
        super.update(dt)
        if(this.isUpgrading){
            this.upgradeProgress+=dt
            if(Math.random()<0.2){
                this.game.particles.emit(this.x+0.5,this.y+0.5,'#9b59b6',1,0.8,0.4,2)
            }
            if(this.upgradeProgress>=this.upgradeDuration){
                this.isUpgrading=false
                this.level++
                if(this.level===2){
                    this.maxHp=1600
                    this.hp=Math.min(this.maxHp,this.hp+600)
                }else if(this.level===3){
                    this.maxHp=2400
                    this.hp=Math.min(this.maxHp,this.hp+800)
                }
                this.game.sounds.playSpawn()
                this.game.particles.emit(this.x+0.5,this.y+0.5,'#f1c40f',18,2.5,0.7,3)
            }
        }
    }
}

class Barracks extends Building{
    constructor(game,x,y,owner){
        super(game,x,y,owner,6)
        this.type=BUILDING_TYPES.BARRACKS
        this.maxHp=700
        this.hp=70
    }
}

class Farm extends Building{
    constructor(game,x,y,owner){
        super(game,x,y,owner,4)
        this.type=BUILDING_TYPES.FARM
        this.maxHp=350
        this.hp=35
        this.foodTimer=0
        this.foodInterval=2.5
        this.foodYield=4
    }

    update(dt){
        super.update(dt)
        if(!this.underConstruction&&this.hp>0){
            this.foodTimer+=dt
            if(this.foodTimer>=this.foodInterval){
                this.foodTimer=0
                this.owner.addResource('food',this.foodYield)
            }
        }
    }
}

class Mine extends Building{
    constructor(game,x,y,owner){
        super(game,x,y,owner,5)
        this.type=BUILDING_TYPES.MINE
        this.maxHp=450
        this.hp=45
    }
}

class Unit{
    constructor(game,x,y,owner){
        this.game=game
        this.x=x
        this.y=y
        this.owner=owner
        this.selected=false
        this.path=[]
        this.pathIndex=0
        this.moveSpeed=3
        this.radius=.28
        this.target=null
        this.state='idle'
        this.hp=this.maxHp=100
    }

    get tileX(){
        return Math.floor(this.x)
    }

    get tileY(){
        return Math.floor(this.y)
    }

    setPath(path){
        this.path=path||[]
        this.pathIndex=0
        this.state=this.path.length?'moving':'idle'
    }

    moveAlongPath(dt){
        if(this.pathIndex>=this.path.length){
            if(this.state==='moving') this.state='idle'
            return true
        }

        const node=this.path[this.pathIndex]
        const tx=node.x+.5
        const ty=node.y+.5
        const dx=tx-this.x
        const dy=ty-this.y
        const dist=Math.hypot(dx,dy)

        if(dist<.06){
            this.x=tx
            this.y=ty
            this.pathIndex++
            return this.pathIndex>=this.path.length
        }

        const step=this.moveSpeed*dt
        this.x+=dx/dist*Math.min(step,dist)
        this.y+=dy/dist*Math.min(step,dist)
        return false
    }
}

class Worker extends Unit{
    constructor(game,x,y,owner){
        super(game,x,y,owner)
        this.type=UNIT_TYPES.WORKER
        this.maxHp=this.hp=70
        this.moveSpeed=2.7
        this.carrying={type:null,amount:0}
        this.workTarget=null
        this.gatherTimer=0
    }

    get maxCarry(){
        const th=this.findTownHall()
        if(th&&th.level===3) return 80
        if(th&&th.level===2) return 65
        return 50
    }

    get gatherRateMultiplier(){
        const th=this.findTownHall()
        if(th&&th.level===3) return 1.4
        if(th&&th.level===2) return 1.2
        return 1.0
    }

    commandGather(tile){
        if(!tile||!tile.resourceType||tile.resourceAmount<=0) return false
        this.workTarget=tile
        this.target=null
        this.carrying={type:null,amount:0}
        this.moveToTile(tile.x,tile.y)
        return true
    }

    moveToTile(x,y){
        const path=this.game.findPath(this.tileX,this.tileY,x,y,true)
        this.setPath(path)
    }

    findTownHall(){
        return this.owner.buildings.find(b=>b.type===BUILDING_TYPES.TOWN_HALL&&!b.underConstruction)
    }

    update(dt){
        if(this.state==='moving'){
            const arrived=this.moveAlongPath(dt)
            if(arrived&&this.workTarget) this.state='gathering'
            return
        }

        if(this.state==='gathering'){
            if(!this.workTarget||this.workTarget.resourceAmount<=0){
                this.workTarget=null
                this.state='idle'
                return
            }

            this.gatherTimer+=dt*this.gatherRateMultiplier
            if(this.gatherTimer>=1){
                this.gatherTimer=0
                const amount=Math.min(10,this.workTarget.resourceAmount)
                this.workTarget.resourceAmount-=amount
                this.carrying.type=this.workTarget.resourceType
                this.carrying.amount+=amount

                if(this.carrying.amount>=this.maxCarry||this.workTarget.resourceAmount<=0){
                    const townHall=this.findTownHall()
                    if(townHall){
                        const oldTarget=this.workTarget
                        this.workTarget=null
                        this.moveToTile(townHall.x,townHall.y)
                        this.state='returning'
                        this.returnTarget=oldTarget
                    }else{
                        this.state='idle'
                    }
                }
            }
            return
        }

        if(this.state==='returning'){
            const arrived=this.moveAlongPath(dt)
            if(arrived){
                if(this.carrying.type&&this.carrying.amount){
                    this.owner.addResource(this.carrying.type,this.carrying.amount)
                }
                this.carrying={type:null,amount:0}

                if(this.returnTarget&&this.returnTarget.resourceAmount>0){
                    this.workTarget=this.returnTarget
                    this.moveToTile(this.workTarget.x,this.workTarget.y)
                    this.state='moving'
                }else{
                    this.returnTarget=null
                    this.state='idle'
                }
            }
        }
    }
}

class Warrior extends Unit{
    constructor(game,x,y,owner){
        super(game,x,y,owner)
        this.type=UNIT_TYPES.WARRIOR
        this.maxHp=this.hp=120
        this.moveSpeed=2.8
        this.damage=20
        this.attackRange=1.2
        this.attackCooldown=0
        this.attackInterval=1
        this.target=null
        this.targetType=null
    }

    commandMove(x,y){
        this.target=null
        this.targetType=null
        const path=this.game.findPath(this.tileX,this.tileY,x,y,false)
        this.setPath(path)
    }

    commandAttack(target){
        if(!target||target.owner===this.owner||target.hp<=0) return
        this.target=target
        this.targetType=target instanceof Unit?'unit':'building'
        this.path=[]
        this.pathIndex=0
        this.state='attacking'
    }

    getTargetPosition(){
        if(this.target instanceof Unit) return {x:this.target.x,y:this.target.y}
        return {x:this.target.x+.5,y:this.target.y+.5}
    }

    getTargetRange(){
        return this.target instanceof Unit?this.attackRange:this.attackRange+0.35
    }

    update(dt){
        if(this.attackCooldown>0) this.attackCooldown-=dt

        if(this.state==='moving'){
            this.moveAlongPath(dt)
            return
        }

        if(this.state==='attacking'||this.state==='chasing'){
            if(!this.target||this.target.hp<=0){
                this.target=null
                this.targetType=null
                this.state='idle'
                return
            }

            const pos=this.getTargetPosition()
            const dist=Math.hypot(pos.x-this.x,pos.y-this.y)
            const range=this.getTargetRange()

            if(dist>range){
                const tx=Math.floor(pos.x)
                const ty=Math.floor(pos.y)
                const path=this.game.findPath(this.tileX,this.tileY,tx,ty,false)
                if(path&&path.length){
                    this.path=path
                    this.pathIndex=0
                    this.state='chasing'
                }else{
                    this.state='idle'
                }
                return
            }

            this.state='attacking'
            if(this.attackCooldown<=0){
                this.game.combat.attack(this,this.target)
                this.attackCooldown=this.attackInterval
            }
        }
    }
}

class CombatSystem{
    constructor(game){
        this.game=game
        this.damageLog=[]
    }

    attack(attacker,target){
        if(!attacker||!target||target.hp<=0) return
        if(attacker.owner===target.owner) return

        let damage=attacker.damage||0
        if(target instanceof Building) damage=Math.round(damage*.75)

        target.hp-=damage
        this.game.sounds.playAttack()

        const tx=target instanceof Unit?target.x:target.x+.5
        const ty=target instanceof Unit?target.y:target.y+.5

        this.game.particles.emit(tx,ty,target instanceof Unit?'#e74c3c':'#f39c12',5,1.8,0.3,2.5)

        this.damageLog.push({
            x:tx,
            y:ty,
            amount:damage,
            time:1
        })

        if(target.hp<=0){
            if(attacker&&attacker.owner) attacker.owner.stats.enemiesKilled++
            this.destroy(target)
        }
    }

    destroy(target){
        target.hp=0
        const tx=target instanceof Unit?target.x:target.x+.5
        const ty=target instanceof Unit?target.y:target.y+.5
        this.game.particles.emit(tx,ty,'#ff4757',16,2.5,0.6,3)

        if(target instanceof Unit){
            target.state='dead'
            target.target=null
        }

        if(target instanceof Building){
            const tile=this.game.map.getTile(target.x,target.y)
            if(tile&&tile.building===target) tile.building=null

            const index=target.owner.buildings.indexOf(target)
            if(index>=0) target.owner.buildings.splice(index,1)

            const globalIndex=this.game.buildings.indexOf(target)
            if(globalIndex>=0) this.game.buildings.splice(globalIndex,1)

            if(target.type===BUILDING_TYPES.TOWN_HALL){
                target.owner.defeated=true
            }
        }
    }

    update(dt){
        for(const hit of this.damageLog) hit.time-=dt
        this.damageLog=this.damageLog.filter(hit=>hit.time>0)
    }
}

class BuildingSystem{
    constructor(game){
        this.game=game
        this.costs={
            [BUILDING_TYPES.TOWN_HALL]:{wood:150,gold:100},
            [BUILDING_TYPES.BARRACKS]:{wood:120,gold:50},
            [BUILDING_TYPES.FARM]:{wood:70},
            [BUILDING_TYPES.MINE]:{wood:100}
        }
    }

    canPlace(type,x,y,player,checkRadius=true){
        const map=this.game.map
        if(!map.inBounds(x,y)) return false
        const tile=map.getTile(x,y)
        if(!tile||tile.building||tile.type===TILE_TYPES.WATER) return false

        const occupiedByUnit=this.game.units.some(u=>u.hp>0&&u.tileX===x&&u.tileY===y)
        if(occupiedByUnit) return false

        if(type===BUILDING_TYPES.MINE){
            if(tile.type!==TILE_TYPES.GOLD) return false
        }else{
            if(tile.type===TILE_TYPES.GOLD) return false
        }

        if(checkRadius){
            const hasTownHall=player.buildings.some(b=>b.type===BUILDING_TYPES.TOWN_HALL)
            if(hasTownHall||player.buildings.length>0){
                let nearExisting=false
                for(const b of player.buildings){
                    const d=Math.hypot(b.x-x,b.y-y)
                    if(d<=MAX_BUILD_DISTANCE){
                        nearExisting=true
                        break
                    }
                }
                if(!nearExisting) return false
            }
        }
        return true
    }

    create(type,x,y,owner,ignoreRadius=false){
        if(!this.canPlace(type,x,y,owner,!ignoreRadius)) return null
        const cost=this.costs[type]
        if(!owner.spend(cost)) return null

        let building=null
        if(type===BUILDING_TYPES.TOWN_HALL) building=new TownHall(this.game,x,y,owner)
        if(type===BUILDING_TYPES.BARRACKS) building=new Barracks(this.game,x,y,owner)
        if(type===BUILDING_TYPES.FARM) building=new Farm(this.game,x,y,owner)
        if(type===BUILDING_TYPES.MINE) building=new Mine(this.game,x,y,owner)

        if(!building) return null

        owner.buildings.push(building)
        owner.stats.buildingsBuilt++
        this.game.map.getTile(x,y).building=building
        this.game.sounds.playBuild()
        return building
    }
}

class ProductionSystem{
    constructor(game){
        this.game=game
        this.times={
            [UNIT_TYPES.WORKER]:5,
            [UNIT_TYPES.WARRIOR]:6
        }
        this.costs={
            [UNIT_TYPES.WORKER]:{food:50},
            [UNIT_TYPES.WARRIOR]:{food:50,gold:50}
        }
    }

    queue(building,type){
        if(!building||building.underConstruction||building.isUpgrading) return false
        if(type===UNIT_TYPES.WORKER&&building.type!==BUILDING_TYPES.TOWN_HALL) return false
        if(type===UNIT_TYPES.WARRIOR&&building.type!==BUILDING_TYPES.BARRACKS) return false

        const owner=building.owner
        if(owner.population+owner.queuedUnitsCount>=owner.maxPopulation) return false
        if(!owner.spend(this.costs[type])) return false

        building.productionQueue.push(type)
        this.game.sounds.playOrder()
        return true
    }

    update(dt){
        for(const player of [this.game.player,this.game.enemy]){
            const th=player.buildings.find(b=>b.type===BUILDING_TYPES.TOWN_HALL&&!b.underConstruction)
            const speedBoost=th?(th.level===3?1.5:(th.level===2?1.25:1.0)):1.0

            for(const building of player.buildings){
                if(building.underConstruction||building.isUpgrading) continue
                if(!building.productionQueue.length) continue

                building.productionProgress+=dt*speedBoost
                const type=building.productionQueue[0]

                if(building.productionProgress>=this.times[type]){
                    building.productionProgress=0
                    building.productionQueue.shift()
                    this.spawn(building,type)
                }
            }
        }
    }

    spawn(building,type){
        const spots=[
            [building.x+1,building.y],
            [building.x-1,building.y],
            [building.x,building.y+1],
            [building.x,building.y-1]
        ]

        let spawn=null
        for(const [x,y] of spots){
            const tile=this.game.map.getTile(x,y)
            if(tile&&tile.isWalkable()&&!this.game.getUnitAtTile(x,y)){
                spawn={x:x+.5,y:y+.5}
                break
            }
        }

        if(!spawn) return

        let unit=null
        if(type===UNIT_TYPES.WORKER){
            unit=new Worker(this.game,spawn.x,spawn.y,building.owner)
            building.owner.stats.workersCreated++
        }
        if(type===UNIT_TYPES.WARRIOR){
            unit=new Warrior(this.game,spawn.x,spawn.y,building.owner)
            building.owner.stats.warriorsCreated++
        }

        if(unit){
            building.owner.units.push(unit)
            this.game.units.push(unit)
            if(building.owner===this.game.player){
                this.game.sounds.playSpawn()
            }
        }
    }
}

class Camera{
    constructor(){
        this.x=0
        this.y=0
        this.zoom=1
    }

    update(dt,input){
        const speed=550*dt/this.zoom
        if(input.keys.has('w')||input.keys.has('arrowup')) this.y-=speed
        if(input.keys.has('s')||input.keys.has('arrowdown')) this.y+=speed
        if(input.keys.has('a')||input.keys.has('arrowleft')) this.x-=speed
        if(input.keys.has('d')||input.keys.has('arrowright')) this.x+=speed

        this.x=Math.max(0,Math.min(this.x,MAP_WIDTH*TILE_SIZE-canvas.width/this.zoom))
        this.y=Math.max(0,Math.min(this.y,MAP_HEIGHT*TILE_SIZE-(canvas.height-160)/this.zoom))
    }

    screenToWorld(sx,sy){
        return {
            x:sx/this.zoom+this.x,
            y:sy/this.zoom+this.y
        }
    }

    screenToTile(sx,sy){
        const p=this.screenToWorld(sx,sy)
        return {
            x:Math.floor(p.x/TILE_SIZE),
            y:Math.floor(p.y/TILE_SIZE)
        }
    }

    apply(context){
        context.scale(this.zoom,this.zoom)
        context.translate(-this.x,-this.y)
    }

    zoomAt(sx,sy,delta){
        const before=this.screenToWorld(sx,sy)
        this.zoom*=delta
        this.zoom=Math.max(0.6,Math.min(2.2,this.zoom))
        const after=this.screenToWorld(sx,sy)
        this.x+=before.x-after.x
        this.y+=before.y-after.y
    }
}

class Input{
    constructor(game){
        this.game=game
        this.keys=new Set()
        this.mouseX=0
        this.mouseY=0
        this.isMouseDown=false
        this.dragStart=null
        this.isDragging=false

        addEventListener('keydown',e=>{
            this.keys.add(e.key.toLowerCase())

            if(e.ctrlKey&&['1','2','3','4'].includes(e.key)){
                e.preventDefault()
                game.assignControlGroup(parseInt(e.key))
                return
            }

            if(['1','2','3','4'].includes(e.key)&&!e.ctrlKey){
                if(game.hasControlGroup(parseInt(e.key))){
                    game.selectControlGroup(parseInt(e.key))
                    return
                }
            }

            if(e.key==='1') game.buildMode=BUILDING_TYPES.TOWN_HALL
            if(e.key==='2') game.buildMode=BUILDING_TYPES.BARRACKS
            if(e.key==='3') game.buildMode=BUILDING_TYPES.FARM
            if(e.key==='4') game.buildMode=BUILDING_TYPES.MINE
            if(e.key.toLowerCase()==='q') game.queueSelectedWorker()
            if(e.key.toLowerCase()==='e') game.queueSelectedWarrior()
            if(e.key.toLowerCase()==='u') game.upgradeSelectedTownHall()
            if(e.key==='Escape') game.buildMode=null
        })

        addEventListener('keyup',e=>{
            this.keys.delete(e.key.toLowerCase())
        })

        canvas.addEventListener('mousedown',e=>{
            if(e.button===0){
                this.isMouseDown=true
                this.dragStart={x:e.clientX,y:e.clientY}
                this.isDragging=false
            }
        })

        canvas.addEventListener('mousemove',e=>{
            this.mouseX=e.clientX
            this.mouseY=e.clientY
            if(this.isMouseDown&&this.dragStart){
                const dist=Math.hypot(e.clientX-this.dragStart.x,e.clientY-this.dragStart.y)
                if(dist>6) this.isDragging=true
            }
        })

        canvas.addEventListener('mouseup',e=>{
            if(e.button===0&&this.isMouseDown){
                if(this.isDragging&&this.dragStart){
                    game.handleBoxSelection(this.dragStart.x,this.dragStart.y,e.clientX,e.clientY)
                }else{
                    game.handleLeftClick(e.clientX,e.clientY)
                }
                this.isMouseDown=false
                this.isDragging=false
                this.dragStart=null
            }
        })

        canvas.addEventListener('contextmenu',e=>{
            e.preventDefault()
            game.handleRightClick(e.clientX,e.clientY)
        })

        canvas.addEventListener('wheel',e=>{
            game.camera.zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.89)
        },{passive:true})

        minimapCanvas.addEventListener('mousedown',e=>this.handleMinimap(e))
        minimapCanvas.addEventListener('mousemove',e=>{if(e.buttons===1) this.handleMinimap(e)})

        document.getElementById('btn-build-th').onclick=()=>{game.buildMode=BUILDING_TYPES.TOWN_HALL}
        document.getElementById('btn-build-barracks').onclick=()=>{game.buildMode=BUILDING_TYPES.BARRACKS}
        document.getElementById('btn-build-farm').onclick=()=>{game.buildMode=BUILDING_TYPES.FARM}
        document.getElementById('btn-build-mine').onclick=()=>{game.buildMode=BUILDING_TYPES.MINE}
        document.getElementById('btn-train-worker').onclick=()=>{game.queueSelectedWorker()}
        document.getElementById('btn-train-warrior').onclick=()=>{game.queueSelectedWarrior()}
        document.getElementById('btn-upgrade').onclick=()=>{game.upgradeSelectedTownHall()}
        document.getElementById('btn-cancel').onclick=()=>{game.buildMode=null}

        for(let i=1;i<=4;i++){
            document.getElementById(`gb-${i}`).onclick=()=>{game.selectControlGroup(i)}
        }
    }

    handleMinimap(e){
        const rect=minimapCanvas.getBoundingClientRect()
        const mx=e.clientX-rect.left
        const my=e.clientY-rect.top
        const mapX=mx/rect.width*MAP_WIDTH*TILE_SIZE
        const mapY=my/rect.height*MAP_HEIGHT*TILE_SIZE
        this.game.camera.x=mapX-canvas.width/(2*this.game.camera.zoom)
        this.game.camera.y=mapY-(canvas.height-160)/(2*this.game.camera.zoom)
    }
}

class Renderer{
    constructor(game){
        this.game=game
    }

    draw(){
        ctx.setTransform(1,0,0,1,0,0)
        ctx.fillStyle='#0d1117'
        ctx.fillRect(0,0,canvas.width,canvas.height)

        ctx.save()
        this.game.camera.apply(ctx)

        this.drawMap()
        this.drawBuildZones()
        this.drawPaths()
        this.drawBuildings()
        this.drawUnits()
        this.drawHover()
        this.game.particles.draw(ctx)
        this.drawDamageNumbers()

        ctx.restore()

        this.drawSelectionBox()
        this.drawMinimap()
        this.updateHUD()
    }

    drawMap(){
        const map=this.game.map
        const cam=this.game.camera
        const startX=Math.max(0,Math.floor(cam.x/TILE_SIZE))
        const endX=Math.min(map.width-1,Math.ceil((cam.x+canvas.width/cam.zoom)/TILE_SIZE))
        const startY=Math.max(0,Math.floor(cam.y/TILE_SIZE))
        const endY=Math.min(map.height-1,Math.ceil((cam.y+(canvas.height-160)/cam.zoom)/TILE_SIZE))

        for(let y=startY;y<=endY;y++){
            for(let x=startX;x<=endX;x++){
                const tile=map.tiles[y][x]
                let color=COLORS.land

                if(tile.type===TILE_TYPES.WATER) color=COLORS.water
                if(tile.type===TILE_TYPES.FOREST) color=COLORS.forest
                if(tile.type===TILE_TYPES.GOLD) color=COLORS.gold

                ctx.fillStyle=color
                ctx.fillRect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE)

                ctx.strokeStyle=COLORS.landGrid
                ctx.strokeRect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE)

                if(tile.type===TILE_TYPES.FOREST){
                    ctx.fillStyle=COLORS.forestTree
                    ctx.beginPath()
                    ctx.arc(x*TILE_SIZE+10,y*TILE_SIZE+17,7,0,Math.PI*2)
                    ctx.arc(x*TILE_SIZE+20,y*TILE_SIZE+13,8,0,Math.PI*2)
                    ctx.arc(x*TILE_SIZE+25,y*TILE_SIZE+20,6,0,Math.PI*2)
                    ctx.fill()
                }

                if(tile.type===TILE_TYPES.GOLD){
                    ctx.fillStyle='#ffe066'
                    ctx.beginPath()
                    ctx.arc(x*TILE_SIZE+16,y*TILE_SIZE+16,6,0,Math.PI*2)
                    ctx.fill()
                }
            }
        }
    }

    drawBuildZones(){
        if(!this.game.buildMode) return
        ctx.fillStyle=COLORS.buildZone
        for(const b of this.game.player.buildings){
            ctx.beginPath()
            ctx.arc((b.x+.5)*TILE_SIZE,(b.y+.5)*TILE_SIZE,MAX_BUILD_DISTANCE*TILE_SIZE,0,Math.PI*2)
            ctx.fill()
        }
    }

    drawBuildings(){
        for(const building of this.game.buildings){
            const x=building.x*TILE_SIZE
            const y=building.y*TILE_SIZE
            const isSelected=this.game.selected===building

            if(isSelected){
                ctx.strokeStyle=COLORS.selected
                ctx.lineWidth=2
                ctx.strokeRect(x-2,y-2,TILE_SIZE+4,TILE_SIZE+4)
                ctx.lineWidth=1
            }

            ctx.fillStyle=building.owner.team===1?COLORS.player:COLORS.enemy

            if(building.type===BUILDING_TYPES.TOWN_HALL){
                ctx.fillRect(x+3,y+3,TILE_SIZE-6,TILE_SIZE-6)
                ctx.fillStyle=building.level===3?'#f1c40f':(building.level===2?'#ecf0f1':'#95a5a6')
                ctx.fillRect(x+9,y+9,14,14)
                if(building.level>=2){
                    ctx.strokeStyle='#f39c12'
                    ctx.strokeRect(x+5,y+5,TILE_SIZE-10,TILE_SIZE-10)
                }
            }

            if(building.type===BUILDING_TYPES.BARRACKS){
                ctx.fillRect(x+5,y+6,TILE_SIZE-10,TILE_SIZE-10)
                ctx.fillStyle='#2c3e50'
                ctx.fillRect(x+11,y+11,10,15)
            }

            if(building.type===BUILDING_TYPES.FARM){
                ctx.fillRect(x+3,y+3,TILE_SIZE-6,TILE_SIZE-6)
                ctx.strokeStyle='#e5c17c'
                for(let i=0;i<4;i++) ctx.strokeRect(x+7+i*5,y+6,3,20)
                ctx.fillStyle='#27ae60'
                ctx.fillRect(x+6,y+7,TILE_SIZE-12,4)
            }

            if(building.type===BUILDING_TYPES.MINE){
                ctx.fillRect(x+4,y+8,TILE_SIZE-8,TILE_SIZE-11)
                ctx.fillStyle='#2c3e50'
                ctx.beginPath()
                ctx.arc(x+16,y+15,8,0,Math.PI*2)
                ctx.fill()
            }

            if(building.underConstruction){
                ctx.fillStyle='rgba(30,35,45,.7)'
                ctx.fillRect(x+2,y+2,TILE_SIZE-4,TILE_SIZE-4)
                ctx.strokeStyle='#f39c12'
                ctx.lineWidth=1.5
                ctx.beginPath()
                ctx.moveTo(x+4,y+4)
                ctx.lineTo(x+TILE_SIZE-4,y+TILE_SIZE-4)
                ctx.moveTo(x+TILE_SIZE-4,y+4)
                ctx.lineTo(x+4,y+TILE_SIZE-4)
                ctx.stroke()
                ctx.lineWidth=1
                const p=building.constructionProgress/building.constructionTime
                this.bar(x,y+TILE_SIZE-6,TILE_SIZE,p,'#3498db')
            }else if(building.isUpgrading){
                const p=building.upgradeProgress/building.upgradeDuration
                this.bar(x,y+TILE_SIZE-6,TILE_SIZE,p,'#9b59b6')
            }

            this.bar(x,y-5,TILE_SIZE,building.hp/building.maxHp,'#2ecc71')
        }
    }

    drawUnits(){
        for(const unit of this.game.units){
            const x=unit.x*TILE_SIZE
            const y=unit.y*TILE_SIZE
            const isSelected=this.game.selectedGroup.has(unit)||(this.game.selected===unit)

            if(isSelected){
                ctx.strokeStyle=COLORS.selected
                ctx.lineWidth=1.8
                ctx.beginPath()
                ctx.arc(x,y,13,0,Math.PI*2)
                ctx.stroke()
                ctx.lineWidth=1
            }

            ctx.fillStyle=unit.owner.team===1?COLORS.player:COLORS.enemy

            if(unit.type===UNIT_TYPES.WORKER){
                ctx.beginPath()
                ctx.arc(x,y,7,0,Math.PI*2)
                ctx.fill()
            }

            if(unit.type===UNIT_TYPES.WARRIOR){
                ctx.beginPath()
                ctx.moveTo(x,y-10)
                ctx.lineTo(x+9,y+7)
                ctx.lineTo(x-9,y+7)
                ctx.closePath()
                ctx.fill()
            }

            this.bar(x-10,y-15,20,unit.hp/unit.maxHp,'#2ecc71')

            if(unit.carrying&&unit.carrying.amount>0){
                ctx.fillStyle='#fff'
                ctx.font='10px sans-serif'
                ctx.textAlign='center'
                ctx.fillText(unit.carrying.amount,x,y+19)
            }
        }
    }

    drawPaths(){
        for(const unit of this.game.selectedGroup){
            if(!unit.path||!unit.path.length) continue
            ctx.strokeStyle='rgba(255,228,92,.4)'
            ctx.lineWidth=1.5
            ctx.beginPath()
            ctx.moveTo(unit.x*TILE_SIZE,unit.y*TILE_SIZE)
            for(let i=unit.pathIndex;i<unit.path.length;i++){
                ctx.lineTo((unit.path[i].x+.5)*TILE_SIZE,(unit.path[i].y+.5)*TILE_SIZE)
            }
            ctx.stroke()
            ctx.lineWidth=1
        }
    }

    drawDamageNumbers(){
        for(const hit of this.game.combat.damageLog){
            const alpha=Math.max(0,hit.time)
            ctx.fillStyle=`rgba(255,235,80,${alpha})`
            ctx.font='bold 13px sans-serif'
            ctx.textAlign='center'
            ctx.fillText(`-${hit.amount}`,hit.x*TILE_SIZE,hit.y*TILE_SIZE-20-(1-hit.time)*14)
        }
    }

    drawHover(){
        const t=this.game.camera.screenToTile(this.game.input.mouseX,this.game.input.mouseY)
        if(!this.game.map.inBounds(t.x,t.y)) return

        if(this.game.buildMode){
            const canAfford=this.game.player.canAfford(this.game.buildingSystem.costs[this.game.buildMode])
            const canPlace=this.game.buildingSystem.canPlace(this.game.buildMode,t.x,t.y,this.game.player)
            const isValid=canAfford&&canPlace

            ctx.fillStyle=isValid?COLORS.validGhost:COLORS.invalidGhost
            ctx.fillRect(t.x*TILE_SIZE,t.y*TILE_SIZE,TILE_SIZE,TILE_SIZE)

            ctx.strokeStyle=isValid?'#2ecc71':'#e74c3c'
            ctx.lineWidth=2
            ctx.strokeRect(t.x*TILE_SIZE,t.y*TILE_SIZE,TILE_SIZE,TILE_SIZE)
            ctx.lineWidth=1
        }
    }

    drawSelectionBox(){
        if(this.game.input.isDragging&&this.game.input.dragStart){
            const start=this.game.input.dragStart
            const cur={x:this.game.input.mouseX,y:this.game.input.mouseY}
            const sx=Math.min(start.x,cur.x)
            const sy=Math.min(start.y,cur.y)
            const sw=Math.abs(cur.x-start.x)
            const sh=Math.abs(cur.y-start.y)

            ctx.fillStyle='rgba(77,166,255,.15)'
            ctx.fillRect(sx,sy,sw,sh)
            ctx.strokeStyle='#4da6ff'
            ctx.lineWidth=1.5
            ctx.strokeRect(sx,sy,sw,sh)
            ctx.lineWidth=1
        }
    }

    drawMinimap(){
        mctx.fillStyle='#111'
        mctx.fillRect(0,0,minimapCanvas.width,minimapCanvas.height)

        const sx=minimapCanvas.width/MAP_WIDTH
        const sy=minimapCanvas.height/MAP_HEIGHT

        for(let y=0;y<MAP_HEIGHT;y++){
            for(let x=0;x<MAP_WIDTH;x++){
                const t=this.game.map.tiles[y][x]
                if(t.type===TILE_TYPES.WATER) mctx.fillStyle='#23537d'
                else if(t.type===TILE_TYPES.FOREST) mctx.fillStyle='#1e4f28'
                else if(t.type===TILE_TYPES.GOLD) mctx.fillStyle='#a6851e'
                else mctx.fillStyle='#2b4e23'
                mctx.fillRect(x*sx,y*sy,sx,sy)
            }
        }

        for(const b of this.game.buildings){
            mctx.fillStyle=b.owner.team===1?'#4da6ff':'#ff4757'
            mctx.fillRect(b.x*sx-1,b.y*sy-1,sx*1.8,sy*1.8)
        }

        for(const u of this.game.units){
            mctx.fillStyle=u.owner.team===1?'#ffffff':'#ff6b81'
            mctx.fillRect(u.x*sx,u.y*sy,2.5,2.5)
        }

        const cam=this.game.camera
        const cx=cam.x/TILE_SIZE*sx
        const cy=cam.y/TILE_SIZE*sy
        const cw=(canvas.width/cam.zoom)/TILE_SIZE*sx
        const ch=((canvas.height-160)/cam.zoom)/TILE_SIZE*sy

        mctx.strokeStyle='#ffe45c'
        mctx.lineWidth=1.5
        mctx.strokeRect(cx,cy,cw,ch)
        mctx.lineWidth=1
    }

    bar(x,y,w,p,color){
        ctx.fillStyle='rgba(0,0,0,.6)'
        ctx.fillRect(x,y,w,4)
        ctx.fillStyle=color
        ctx.fillRect(x,y,w*Math.max(0,Math.min(1,p)),4)
    }

    updateHUD(){
        const p=this.game.player
        resFoodEl.textContent=Math.floor(p.resources.food)
        resWoodEl.textContent=Math.floor(p.resources.wood)
        resGoldEl.textContent=Math.floor(p.resources.gold)
        resPopEl.textContent=`${p.population}/${p.maxPopulation}`
        hudKillsEl.textContent=`Kills: ${p.stats.enemiesKilled}`

        for(let i=1;i<=4;i++){
            const el=document.getElementById(`gb-${i}`)
            if(el){
                const grp=this.game.controlGroups[i]
                el.classList.toggle('active',grp&&grp.length>0)
            }
        }

        const groupSize=this.game.selectedGroup.size
        if(groupSize>1){
            portraitBox.textContent='⚔'
            entityTitle.textContent=`Units Selected (${groupSize})`
            entityHpWrap.style.display='none'
            let warriors=0, workers=0
            for(const u of this.game.selectedGroup){
                if(u.type===UNIT_TYPES.WARRIOR) warriors++
                if(u.type===UNIT_TYPES.WORKER) workers++
            }
            entityDesc.textContent=`Warriors: ${warriors} | Workers: ${workers}`
            return
        }

        const selected=this.game.selected
        if(selected){
            entityHpWrap.style.display='block'
            entityHpFill.style.width=`${Math.max(0,selected.hp/selected.maxHp*100)}%`

            if(selected instanceof Building){
                portraitBox.textContent='🏛'
                let title=selected.type.toUpperCase()
                if(selected.type===BUILDING_TYPES.TOWN_HALL) title+=` (Lvl ${selected.level})`
                entityTitle.textContent=title

                if(selected.underConstruction){
                    const rem=(selected.constructionTime-selected.constructionProgress).toFixed(1)
                    entityDesc.textContent=`Under construction: ${rem}s left`
                }else if(selected.isUpgrading){
                    const rem=(selected.upgradeDuration-selected.upgradeProgress).toFixed(1)
                    entityDesc.textContent=`Upgrading: ${rem}s left`
                }else if(selected.productionQueue.length){
                    entityDesc.textContent=`Queue: ${selected.productionQueue.join(', ')}`
                }else{
                    entityDesc.textContent=`HP: ${Math.ceil(selected.hp)}/${selected.maxHp}`
                }
            }else if(selected instanceof Unit){
                portraitBox.textContent=selected.type===UNIT_TYPES.WORKER?'⛏':'⚔'
                entityTitle.textContent=selected.type.toUpperCase()
                let desc=`HP: ${Math.ceil(selected.hp)}/${selected.maxHp} | State: ${selected.state}`
                if(selected.carrying&&selected.carrying.amount){
                    desc+=` | Holding: ${selected.carrying.amount} ${selected.carrying.type}`
                }
                entityDesc.textContent=desc
            }
        }else{
            portraitBox.textContent='-'
            entityTitle.textContent='None Selected'
            entityHpWrap.style.display='none'
            entityDesc.textContent='Select units or buildings using LMB or Drag Box'
        }
    }
}

class Game{
    constructor(){
        this.sounds=new SoundSystem()
        this.particles=new ParticleSystem()
        this.camera=new Camera()
        this.controlGroups={}
        this.selectedGroup=new Set()

        this.restart()
        this.renderer=new Renderer(this)
        this.input=new Input(this)

        restartBtn.onclick=()=>this.restart()

        this.lastTime=performance.now()
        requestAnimationFrame(t=>this.loop(t))
    }

    restart(){
        this.gameTime=0
        this.gameOver=null
        endScreen.style.display='none'

        this.map=new GameMap(MAP_WIDTH,MAP_HEIGHT)
        this.player=new Player('Player',1)
        this.enemy=new Player('Enemy',2)

        this.units=[]
        this.buildings=[]
        this.selected=null
        this.selectedGroup.clear()
        this.buildMode=null
        this.controlGroups={1:[],2:[],3:[],4:[]}

        this.buildingSystem=new BuildingSystem(this)
        this.productionSystem=new ProductionSystem(this)
        this.combat=new CombatSystem(this)
        this.ai=null

        this.setupBases()
    }

    setupBases(){
        const pTH=new TownHall(this,6,6,this.player,true)
        const eTH=new TownHall(this,MAP_WIDTH-7,MAP_HEIGHT-7,this.enemy,true)

        this.player.buildings.push(pTH)
        this.enemy.buildings.push(eTH)
        this.buildings.push(pTH,eTH)

        this.map.getTile(6,6).building=pTH
        this.map.getTile(MAP_WIDTH-7,MAP_HEIGHT-7).building=eTH

        const worker=new Worker(this,7.5,6.5,this.player)
        this.player.units.push(worker)
        this.units.push(worker)

        const enemyWorker=new Worker(this,MAP_WIDTH-8.5,MAP_HEIGHT-7.5,this.enemy)
        this.enemy.units.push(enemyWorker)
        this.units.push(enemyWorker)
    }

    formatTime(sec){
        const m=Math.floor(sec/60)
        const s=Math.floor(sec%60)
        return `${m<10?'0'+m:m}:${s<10?'0'+s:s}`
    }

    showGameOverScreen(type){
        endScreen.style.display='flex'
        const isVictory=type==='victory'
        endTitle.textContent=isVictory?'VICTORY':'DEFEAT'
        endTitle.style.color=isVictory?'#2ecc71':'#ff4757'

        if(isVictory) this.sounds.playVictory()
        else this.sounds.playDefeat()

        const pStats=this.player.stats
        endStats.innerHTML=`
            <b>Match Time:</b> ${this.formatTime(this.gameTime)}<br>
            <b>Enemies Defeated:</b> ${pStats.enemiesKilled}<br>
            <b>Workers Recruited:</b> ${pStats.workersCreated}<br>
            <b>Warriors Recruited:</b> ${pStats.warriorsCreated}<br>
            <b>Buildings Constructed:</b> ${pStats.buildingsBuilt}<br>
            <b>Total Wood Harvested:</b> ${Math.floor(pStats.gathered.wood)}<br>
            <b>Total Gold Mined:</b> ${Math.floor(pStats.gathered.gold)}<br>
            <b>Total Farmed Food:</b> ${Math.floor(pStats.gathered.food)}
        `
    }

    assignControlGroup(num){
        const units=[...this.selectedGroup].filter(u=>u.hp>0&&u.owner===this.player)
        if(units.length){
            this.controlGroups[num]=units
            this.sounds.playSelect()
        }
    }

    hasControlGroup(num){
        return this.controlGroups[num]&&this.controlGroups[num].some(u=>u.hp>0)
    }

    selectControlGroup(num){
        const valid=(this.controlGroups[num]||[]).filter(u=>u.hp>0)
        this.controlGroups[num]=valid
        if(valid.length){
            this.clearSelection()
            for(const u of valid){
                this.selectedGroup.add(u)
                u.selected=true
            }
            this.selected=valid[0]
            this.sounds.playSelect()
        }
    }

    clearSelection(){
        for(const u of this.units) u.selected=false
        this.selectedGroup.clear()
        this.selected=null
    }

    handleBoxSelection(x1,y1,x2,y2){
        this.clearSelection()
        const minX=Math.min(x1,x2)
        const maxX=Math.max(x1,x2)
        const minY=Math.min(y1,y2)
        const maxY=Math.max(y1,y2)

        for(const u of this.units){
            if(u.owner!==this.player||u.hp<=0) continue
            const sx=(u.x*TILE_SIZE-this.camera.x)*this.camera.zoom
            const sy=(u.y*TILE_SIZE-this.camera.y)*this.camera.zoom

            if(sx>=minX&&sx<=maxX&&sy>=minY&&sy<=maxY){
                this.selectedGroup.add(u)
                u.selected=true
            }
        }

        if(this.selectedGroup.size>0){
            this.selected=[...this.selectedGroup][0]
            this.sounds.playSelect()
        }
    }

    handleLeftClick(sx,sy){
        if(this.gameOver) return
        if(sy>=canvas.height-160||sy<=46) return

        const tilePos=this.camera.screenToTile(sx,sy)
        if(!this.map.inBounds(tilePos.x,tilePos.y)) return

        if(this.buildMode){
            const b=this.buildingSystem.create(this.buildMode,tilePos.x,tilePos.y,this.player)
            if(b){
                this.buildings.push(b)
                this.buildMode=null
            }
            return
        }

        const unit=this.getUnitAtTile(tilePos.x,tilePos.y)
        if(unit&&unit.owner===this.player){
            this.clearSelection()
            this.selected=unit
            this.selectedGroup.add(unit)
            unit.selected=true
            this.sounds.playSelect()
            return
        }

        const building=this.getBuildingAtTile(tilePos.x,tilePos.y)
        if(building&&building.owner===this.player){
            this.clearSelection()
            this.selected=building
            this.sounds.playSelect()
            return
        }

        this.clearSelection()
    }

    handleRightClick(sx,sy){
        if(this.gameOver||sy>=canvas.height-160) return
        if(!this.selectedGroup.size&&!this.selected) return

        const pos=this.camera.screenToTile(sx,sy)
        if(!this.map.inBounds(pos.x,pos.y)) return

        const enemyUnit=this.getUnitAtTile(pos.x,pos.y)
        const enemyBuilding=this.getBuildingAtTile(pos.x,pos.y)
        const target=(enemyUnit&&enemyUnit.owner!==this.player)?enemyUnit:
                     (enemyBuilding&&enemyBuilding.owner!==this.player)?enemyBuilding:null

        const tile=this.map.getTile(pos.x,pos.y)

        let index=0
        const units=[...this.selectedGroup]
        if(!units.length&&this.selected instanceof Unit) units.push(this.selected)

        for(const unit of units){
            if(unit instanceof Warrior){
                if(target){
                    unit.commandAttack(target)
                }else{
                    const offsetX=(index%3)-1
                    const offsetY=Math.floor(index/3)
                    unit.commandMove(pos.x+offsetX,pos.y+offsetY)
                }
            }else if(unit instanceof Worker){
                if(tile&&tile.resourceType&&tile.resourceAmount>0){
                    unit.commandGather(tile)
                }else{
                    unit.workTarget=null
                    unit.returnTarget=null
                    unit.setPath(this.findPath(unit.tileX,unit.tileY,pos.x,pos.y,false))
                }
            }
            index++
        }
        this.sounds.playOrder()
    }

    queueSelectedWorker(){
        const th=this.player.buildings.find(b=>b.type===BUILDING_TYPES.TOWN_HALL&&!b.underConstruction)
        if(th) this.productionSystem.queue(th,UNIT_TYPES.WORKER)
    }

    queueSelectedWarrior(){
        const barracks=this.player.buildings.find(b=>b.type===BUILDING_TYPES.BARRACKS&&!b.underConstruction)
        if(barracks) this.productionSystem.queue(barracks,UNIT_TYPES.WARRIOR)
    }

    upgradeSelectedTownHall(){
        if(this.selected&&this.selected instanceof TownHall&&this.selected.owner===this.player){
            this.selected.startUpgrade()
            return
        }
        const th=this.player.buildings.find(b=>b.type===BUILDING_TYPES.TOWN_HALL&&!b.underConstruction)
        if(th) th.startUpgrade()
    }

    findPath(startX,startY,endX,endY,allowResourceTarget=false){
        if(!this.map.inBounds(startX,startY)||!this.map.inBounds(endX,endY)) return []
        const start={x:startX,y:startY}
        const goal={x:endX,y:endY}
        if(start.x===goal.x&&start.y===goal.y) return []

        const goalTile=this.map.getTile(goal.x,goal.y)
        if(!goalTile) return []

        const passable=(x,y)=>{
            const tile=this.map.getTile(x,y)
            if(!tile||tile.type===TILE_TYPES.WATER) return false
            if(tile.building&&!(x===start.x&&y===start.y)) return false
            if(!allowResourceTarget&&tile.unit&&!(x===goal.x&&y===goal.y)) return false
            return true
        }

        if(!passable(goal.x,goal.y)&&!(goalTile.building===this.selected)){
            const alternatives=[
                [goal.x+1,goal.y],[goal.x-1,goal.y],[goal.x,goal.y+1],[goal.x,goal.y-1]
            ].filter(([x,y])=>this.map.inBounds(x,y)&&passable(x,y))

            if(alternatives.length){
                goal.x=alternatives[0][0]
                goal.y=alternatives[0][1]
            }else return []
        }

        const open=[]
        const closed=new Set()
        const nodes=new Map()
        const key=(x,y)=>`${x},${y}`
        const heuristic=(x,y)=>Math.abs(x-goal.x)+Math.abs(y-goal.y)

        const first={x:start.x,y:start.y,g:0,h:heuristic(start.x,start.y),parent:null}
        first.f=first.g+first.h
        open.push(first)
        nodes.set(key(first.x,first.y),first)

        const dirs=[[1,0],[-1,0],[0,1],[0,-1]]

        while(open.length){
            let best=0
            for(let i=1;i<open.length;i++){
                if(open[i].f<open[best].f) best=i
            }

            const current=open.splice(best,1)[0]
            const currentKey=key(current.x,current.y)

            if(current.x===goal.x&&current.y===goal.y){
                const path=[]
                let n=current
                while(n){
                    if(!(n.x===start.x&&n.y===start.y)) path.unshift({x:n.x,y:n.y})
                    n=n.parent
                }
                return path
            }

            closed.add(currentKey)

            for(const [dx,dy] of dirs){
                const nx=current.x+dx
                const ny=current.y+dy
                if(!this.map.inBounds(nx,ny)||!passable(nx,ny)) continue

                const nk=key(nx,ny)
                if(closed.has(nk)) continue

                const g=current.g+1
                const existing=nodes.get(nk)

                if(!existing||g<existing.g){
                    const node={x:nx,y:ny,g,h:heuristic(nx,ny),parent:current}
                    node.f=node.g+node.h
                    nodes.set(nk,node)
                    const index=open.indexOf(existing)
                    if(index>=0) open.splice(index,1)
                    open.push(node)
                }
            }
        }
        return []
    }

    getUnitAtTile(x,y,ignore=null){
        return this.units.find(u=>{
            if(u===ignore||u.hp<=0) return false
            return Math.floor(u.x)===x&&Math.floor(u.y)===y
        })
    }

    getBuildingAtTile(x,y){
        return this.buildings.find(b=>b.x===x&&b.y===y&&b.hp>0)
    }

    enemyAI(dt){
        if(!this.ai){
            this.ai={
                timer:0,
                attackTimer:0,
                attackInterval:35,
                attackGroups:[],
                buildTimer:0
            }
        }

        this.ai.timer+=dt
        this.ai.attackTimer+=dt
        this.ai.buildTimer+=dt

        const enemy=this.enemy
        const townHall=enemy.buildings.find(b=>b.type===BUILDING_TYPES.TOWN_HALL)
        if(!townHall){
            enemy.defeated=true
            return
        }

        const workers=enemy.units.filter(u=>u.type===UNIT_TYPES.WORKER)
        const warriors=enemy.units.filter(u=>u.type===UNIT_TYPES.WARRIOR)
        const barracks=enemy.buildings.find(b=>b.type===BUILDING_TYPES.BARRACKS&&!b.underConstruction)

        for(const worker of workers){
            if(worker.state==='idle'){
                const resource=this.findNearestResource(worker.tileX,worker.tileY)
                if(resource) worker.commandGather(resource)
            }
        }

        if(townHall&&!townHall.underConstruction&&!townHall.isUpgrading){
            if(townHall.level<townHall.maxLevel){
                const cost=townHall.upgradeCosts[townHall.level]
                if(enemy.resources.wood>=cost.wood+80&&enemy.resources.gold>=cost.gold+50){
                    townHall.startUpgrade()
                }
            }
        }

        const pendingBarracks=enemy.buildings.find(b=>b.type===BUILDING_TYPES.BARRACKS)
        if(!pendingBarracks&&enemy.resources.wood>=120&&enemy.resources.gold>=50){
            const spots=this.getBuildSpotsNear(townHall,BUILDING_TYPES.BARRACKS,enemy)
            if(spots.length){
                const b=this.buildingSystem.create(BUILDING_TYPES.BARRACKS,spots[0].x,spots[0].y,enemy,true)
                if(b) this.buildings.push(b)
            }
        }

        if(this.ai.buildTimer>=6){
            this.ai.buildTimer=0
            const needFarms=enemy.population+enemy.queuedUnitsCount>=enemy.maxPopulation-2
            if((needFarms||enemy.resources.food<100)&&enemy.resources.wood>=70){
                const spots=this.getBuildSpotsNear(townHall,BUILDING_TYPES.FARM,enemy)
                if(spots.length){
                    const b=this.buildingSystem.create(BUILDING_TYPES.FARM,spots[0].x,spots[0].y,enemy,true)
                    if(b) this.buildings.push(b)
                }
            }

            if(enemy.resources.wood>=100){
                const goldTile=this.findNearestResource(townHall.x,townHall.y,'gold')
                if(goldTile&&this.buildingSystem.canPlace(BUILDING_TYPES.MINE,goldTile.x,goldTile.y,enemy,false)){
                    const b=this.buildingSystem.create(BUILDING_TYPES.MINE,goldTile.x,goldTile.y,enemy,true)
                    if(b) this.buildings.push(b)
                }
            }
        }

        if(workers.length<4&&townHall&&!townHall.underConstruction&&!townHall.isUpgrading){
            if(townHall.productionQueue.length<1&&enemy.resources.food>=50){
                this.productionSystem.queue(townHall,UNIT_TYPES.WORKER)
            }
        }

        if(barracks&&barracks.productionQueue.length<2&&enemy.resources.food>=50&&enemy.resources.gold>=50){
            if(enemy.population+enemy.queuedUnitsCount<enemy.maxPopulation){
                this.productionSystem.queue(barracks,UNIT_TYPES.WARRIOR)
            }
        }

        if(this.ai.attackTimer>=this.ai.attackInterval){
            this.ai.attackTimer=0
            if(warriors.length>=2){
                const group=warriors.filter(w=>w.state!=='attacking'&&w.state!=='chasing')
                if(group.length>=2) this.launchAttack(group)
            }
        }

        for(const group of this.ai.attackGroups){
            if(!group.active) continue
            const alive=group.units.filter(u=>u.hp>0)
            if(!alive.length){group.active=false;continue}

            const target=this.choosePlayerTarget(alive)
            if(!target){group.active=false;continue}

            for(const warrior of alive){
                if(warrior.state==='idle'||warrior.state==='moving') warrior.commandAttack(target)
            }
            group.units=alive
        }
    }

    findNearestResource(x,y,type=null){
        let nearest=null
        let best=Infinity
        for(let yy=0;yy<this.map.height;yy++){
            for(let xx=0;xx<this.map.width;xx++){
                const tile=this.map.getTile(xx,yy)
                if(!tile.resourceType||tile.resourceAmount<=0) continue
                if(type&&tile.resourceType!==type) continue
                const d=Math.abs(xx-x)+Math.abs(yy-y)
                if(d<best){best=d;nearest=tile}
            }
        }
        return nearest
    }

    getBuildSpotsNear(building,type,player){
        const result=[]
        for(let radius=1;radius<=8;radius++){
            for(let y=building.y-radius;y<=building.y+radius;y++){
                for(let x=building.x-radius;x<=building.x+radius;x++){
                    if(this.map.inBounds(x,y)&&this.buildingSystem.canPlace(type,x,y,player,false)){
                        result.push({x,y})
                    }
                }
            }
            if(result.length) return result
        }
        return result
    }

    launchAttack(units){
        const group={units:[...units],active:true}
        this.ai.attackGroups.push(group)
        const target=this.choosePlayerTarget(units)
        if(target){
            for(const warrior of units) warrior.commandAttack(target)
        }
    }

    choosePlayerTarget(units){
        const targets=[...this.player.units,...this.player.buildings].filter(t=>t.hp>0)
        if(!targets.length) return null

        let bestTarget=null
        let bestScore=Infinity

        for(const target of targets){
            let score=0
            for(const unit of units){
                const tx=target instanceof Unit?target.x:target.x+.5
                const ty=target instanceof Unit?target.y:target.y+.5
                score+=Math.hypot(unit.x-tx,unit.y-ty)
            }
            if(target instanceof TownHall) score-=25
            if(target instanceof Barracks) score-=10
            if(target instanceof Worker) score-=8

            if(score<bestScore){
                bestScore=score
                bestTarget=target
            }
        }
        return bestTarget
    }

    cleanup(){
        const dead=this.units.filter(u=>u.hp<=0)
        for(const unit of dead){
            const index=unit.owner.units.indexOf(unit)
            if(index>=0) unit.owner.units.splice(index,1)
            this.selectedGroup.delete(unit)
            if(this.selected===unit) this.selected=null
        }

        this.units=this.units.filter(u=>u.hp>0)

        if(!this.gameOver){
            if(this.player.defeated){
                this.gameOver='defeat'
                this.showGameOverScreen('defeat')
            }else if(this.enemy.defeated){
                this.gameOver='victory'
                this.showGameOverScreen('victory')
            }
        }
    }

    update(dt){
        if(!this.gameOver){
            this.gameTime+=dt
            hudTimerEl.textContent=this.formatTime(this.gameTime)
        }

        this.camera.update(dt,this.input)
        this.particles.update(dt)

        if(this.gameOver) return

        for(const b of this.buildings) b.update(dt)
        for(const unit of this.units) unit.update(dt)

        this.productionSystem.update(dt)
        this.combat.update(dt)
        this.enemyAI(dt)
        this.cleanup()
    }

    loop(time){
        const dt=Math.min((time-this.lastTime)/1000,0.1)
        this.lastTime=time

        this.update(dt)
        this.renderer.draw()

        requestAnimationFrame(t=>this.loop(t))
    }
}

const game=new Game()
</script>
