<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mega Evolution Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      background: #030712;
      color: #f1f5f9;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Верхняя панель статов */
    .top-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #0f172a;
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      z-index: 10;
    }

    .stat-badge { display: flex; flex-direction: column; gap: 1px; }
    .stat-cells { color: #38bdf8; }
    .stat-body { color: #4ade80; }
    .stat-dna { color: #c084fc; }
    .stat-rate { color: #f59e0b; }

    /* Рабочая область: либо Игра, либо Магазин */
    .main-view {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    .view-screen {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
    }

    #gameScreen { z-index: 1; }
    #shopScreen {
      z-index: 2;
      background: #0b1120;
      overflow-y: auto;
      padding: 12px;
      display: none;
      gap: 10px;
    }

    /* Аквариум и холст */
    .canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: #020617;
      touch-action: none; /* Для идеального тач-управления */
    }

    #bioCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .era-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #38bdf8;
      pointer-events: none;
    }

    .touch-hint {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 0.65rem;
      color: #94a3b8;
      pointer-events: none;
    }

    /* Нижний мобильный блок кнопок */
    .action-controls {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #090d16;
      border-top: 1px solid #1e293b;
    }

    .btn-action {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: none;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #fff;
    }

    .btn-action:active { transform: scale(0.96); }

    .btn-feed { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .btn-grow { background: linear-gradient(135deg, #16a34a, #15803d); }
    .btn-dna { background: linear-gradient(135deg, #7e22ce, #6b21a8); }
    .btn-action:disabled { background: #1e293b; color: #64748b; }

    /* Нижний мобильный навбар (Табы: Игра / Магазин / Перерождение) */
    .bottom-nav {
      display: flex;
      background: #0f172a;
      border-top: 1px solid #334155;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .nav-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-tab.active {
      color: #38bdf8;
      border-top: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    /* Карточки в мобильном магазине */
    .shop-section {
      background: #131d33;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shop-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .btn-choice {
      background: #0a0f1d;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .btn-choice.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #fff;
    }

    .upgrade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0f1d;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      gap: 6px;
    }

    .upgrade-item.bought {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.05);
    }

    .upgrade-info h4 { font-size: 0.78rem; color: #f1f5f9; }
    .upgrade-info p { font-size: 0.65rem; color: #64748b; }

    .btn-buy {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 6px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 6px;
      white-space: nowrap;
    }
    .btn-buy:disabled { background: #1e293b; color: #475569; }
    .btn-buy.purchased { background: #22c55e; color: #fff; }

    .ascend-banner {
      background: linear-gradient(135deg, #f59e0b, #b45309);
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .floating-text {
      position: absolute;
      font-weight: bold;
      color: #38bdf8;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      z-index: 100;
      font-size: 0.9rem;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
  </style>
</head>
<body>

  <!-- Статы -->
  <div class="top-stats">
    <div class="stat-badge stat-cells"><span>Биомасса</span><span id="cellsCount">1</span></div>
    <div class="stat-badge stat-body"><span>Клетки</span><span id="bodyCellsCount">1</span></div>
    <div class="stat-badge stat-dna"><span>ДНК</span><span id="dnaCount">0</span></div>
    <div class="stat-badge stat-rate"><span>Синтез</span><span id="passiveIncome">0/с</span></div>
  </div>

  <!-- Главный вид (Экраны) -->
  <div class="main-view">
    <!-- Экран 1: Игра и Охота -->
    <div class="view-screen" id="gameScreen">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="bioCanvas"></canvas>
        <div class="era-badge" id="eraBadge">Эра 1: Микроб</div>
        <div class="touch-hint">👆 Касайся / Веди пальцем</div>
      </div>

      <div class="action-controls">
        <button class="btn-action btn-feed" id="clickBtn">
          <span>Питание</span>
          <small id="clickPowerText">+1</small>
        </button>
        <button class="btn-action btn-grow" id="growBodyBtn">
          <span>+1 Клетка</span>
          <small id="bodyCostText">10 🦠</small>
        </button>
        <button class="btn-action btn-dna" id="synthDnaBtn" disabled>
          <span>Мутация</span>
          <small id="dnaCostText">25 🦠</small>
        </button>
      </div>
    </div>

    <!-- Экран 2: Магазин и Кастомизация -->
    <div class="view-screen" id="shopScreen">
      <div class="ascend-banner" id="ascendBanner">
        <div style="font-weight: 800; font-size: 0.85rem;">⚡ ВЕЛИКАЯ МЕГА-ЭВОЛЮЦИЯ!</div>
        <p style="font-size: 0.7rem;">Переродись в Титана (Множитель силы x2.5 + 15 ДНК)!</p>
        <button class="btn-buy" style="background:#fff; color:#78350f; width:100%; padding:8px;" onclick="ascendCreature()">ПЕРЕРОДИТЬСЯ</button>
      </div>

      <div class="shop-section">
        <div class="shop-section-title">Класс / Анатомия:</div>
        <div class="choice-grid">
          <button class="btn-choice active" onclick="setArchetype('insect')">🐛 Хитин</button>
          <button class="btn-choice" onclick="setArchetype('dragon')">🐉 Дракон</button>
          <button class="btn-choice" onclick="setArchetype('beast')">🐺 Зверь</button>
          <button class="btn-choice" onclick="setArchetype('kraken')">🐙 Кракен</button>
          <button class="btn-choice" onclick="setArchetype('griffin')">🦅 Грифон</button>
          <button class="btn-choice" onclick="setArchetype('xenomorph')">👾 Чужой</button>
        </div>

        <div class="shop-section-title" style="margin-top:4px;">Покров / Кожа:</div>
        <div class="choice-grid">
          <button class="btn-choice active" onclick="setSkin('smooth')">Кожа</button>
          <button class="btn-choice" onclick="setSkin('chitin')">Панцирь</button>
          <button class="btn-choice" onclick="setSkin('scales')">Чешуя</button>
          <button class="btn-choice" onclick="setSkin('fur')">Шерсть</button>
          <button class="btn-choice" onclick="setSkin('crystal')">Кристалл</button>
          <button class="btn-choice" onclick="setSkin('bioglow')">Неон/Яд</button>
        </div>
      </div>

      <div class="shop-section">
        <div class="shop-section-title">Апгрейды & Органы:</div>
        <div id="upgradesList" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>
  </div>

  <!-- Мобильный таб-бар -->
  <div class="bottom-nav">
    <button class="nav-tab active" onclick="openScreen('game')">🎮 Аквариум</button>
    <button class="nav-tab" onclick="openScreen('shop')">🧬 Мутации & ДНК</button>
  </div>

  <script>
    const state = {
      biomass: 1,
      bodyCells: 1,
      bodyCellCost: 10,
      dna: 0,
      dnaCost: 25,
      clickPower: 1,
      passiveBiomass: 0,
      ascendLevel: 0,
      archetype: 'insect',
      skin: 'smooth',
      worldWidth: 1000,
      worldHeight: 800
    };

    const upgradesData = [
      { id: 'mitochondria', name: 'Митохондрии', desc: '+1 биомасса за клик', cost: 12, type: 'biomass', effect: () => state.clickPower += 1, bought: false },
      { id: 'cilia', name: 'Реснички-фильтраторы', desc: 'Авто-сбор: +2/сек', cost: 40, type: 'biomass', effect: () => state.passiveBiomass += 2, bought: false },
      { id: 'chloroplast', name: 'Хлоропласты (Фотосинтез)', desc: '+12 биом/сек', cost: 150, type: 'biomass', trait: 'plant', effect: () => state.passiveBiomass += 12, bought: false },
      { id: 'muscles', name: 'Мускулы', desc: '+35/сек, +8 клик', cost: 450, type: 'biomass', effect: () => { state.passiveBiomass += 35; state.clickPower += 8; }, bought: false },
      { id: 'eyes', name: 'Хищные глаза', desc: '+10 к клику', cost: 1, type: 'dna', trait: 'eyes', effect: () => state.clickPower += 10, bought: false },
      { id: 'antennae', name: 'Усики-локаторы', desc: '+20/с авто-сбор', cost: 2, type: 'dna', trait: 'antennae', effect: () => state.passiveBiomass += 20, bought: false },
      { id: 'legs', name: 'Лапы / Конечности', desc: '+45/с авто-сбор', cost: 5, type: 'dna', trait: 'legs', effect: () => state.passiveBiomass += 45, bought: false },
      { id: 'mandibles', name: 'Острые Клыки', desc: '+70 к клику', cost: 10, type: 'dna', trait: 'mandibles', effect: () => state.clickPower += 70, bought: false },
      { id: 'wings', name: 'Крылья', desc: '+250/с, +100 клик', cost: 25, type: 'dna', trait: 'wings', effect: () => { state.passiveBiomass += 250; state.clickPower += 100; }, bought: false },
      { id: 'bioluminescence', name: 'Биосвечение & Яд', desc: '+600/с, +200 клик', cost: 45, type: 'dna', trait: 'glow', effect: () => { state.passiveBiomass += 600; state.clickPower += 200; }, bought: false }
    ];

    function hasTrait(id) {
      const upg = upgradesData.find(u => u.id === id);
      return upg ? upg.bought : false;
    }

    // Переключение экранов
    window.openScreen = function(screen) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('gameScreen').style.display = screen === 'game' ? 'flex' : 'none';
      document.getElementById('shopScreen').style.display = screen === 'shop' ? 'flex' : 'none';
    };

    window.setArchetype = function(type) {
      state.archetype = type;
      event.target.parentElement.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    };

    window.setSkin = function(skin) {
      state.skin = skin;
      event.target.parentElement.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    };

    function initShop() {
      const list = document.getElementById('upgradesList');
      list.innerHTML = '';
      upgradesData.forEach(upg => {
        const item = document.createElement('div');
        item.className = `upgrade-item ${upg.bought ? 'bought' : ''}`;
        item.id = `upg-${upg.id}`;
        item.innerHTML = `
          <div class="upgrade-info">
            <h4>${upg.name}</h4>
            <p>${upg.desc}</p>
          </div>
          <button class="btn-buy ${upg.bought ? 'purchased' : ''}" id="btn-${upg.id}" onclick="buyUpgrade('${upg.id}')">
            ${upg.bought ? 'Взято' : `${upg.cost} ${upg.type === 'biomass' ? '🦠' : '🧬'}`}
          </button>
        `;
        list.appendChild(item);
      });
    }

    window.buyUpgrade = function(id) {
      const upg = upgradesData.find(u => u.id === id);
      if (!upg || upg.bought) return;
      if (upg.type === 'biomass' && state.biomass >= upg.cost) {
        state.biomass -= upg.cost;
        finishBuy(upg);
      } else if (upg.type === 'dna' && state.dna >= upg.cost) {
        state.dna -= upg.cost;
        finishBuy(upg);
      }
    };

    function finishBuy(upg) {
      upg.bought = true;
      upg.effect();
      const item = document.getElementById(`upg-${upg.id}`);
      const btn = document.getElementById(`btn-${upg.id}`);
      item.classList.add('bought');
      btn.classList.add('purchased');
      btn.textContent = 'Взято';
      btn.disabled = true;
      updateUI();
    }

    window.ascendCreature = function() {
      state.ascendLevel += 1;
      state.bodyCells = 4;
      state.bodyCellCost = 15;
      state.dna += 15;
      state.clickPower = Math.floor(state.clickPower * 2.5);
      state.passiveBiomass = Math.floor(state.passiveBiomass * 2.5);
      spine.length = 4;
      playerCreature.pulse = 2.0;
      updateUI();
      openScreen('game');
    };

    function feedCreature(x, y) {
      state.biomass += state.clickPower;
      playerCreature.pulse = 1.25;
      createFloatText(x || (window.innerWidth / 2), y || (window.innerHeight / 2), `+${state.clickPower}`);
      updateUI();
    }

    document.getElementById('clickBtn').addEventListener('click', (e) => feedCreature(e.clientX, e.clientY));
    document.getElementById('growBodyBtn').addEventListener('click', () => {
      if (state.biomass >= state.bodyCellCost) {
        state.biomass -= state.bodyCellCost;
        state.bodyCellCost = Math.floor(state.bodyCellCost * 1.45);
        state.bodyCells += 1;
        initSpineSegments();
        playerCreature.pulse = 1.35;
        updateUI();
      }
    });

    document.getElementById('synthDnaBtn').addEventListener('click', () => {
      if (state.biomass >= state.dnaCost) {
        state.biomass -= state.dnaCost;
        state.dna += 1;
        state.dnaCost = Math.floor(state.dnaCost * 1.38);
        updateUI();
      }
    });

    function createFloatText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = `${x - 10}px`;
      el.style.top = `${y - 20}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    function updateUI() {
      document.getElementById('cellsCount').textContent = Math.floor(state.biomass).toLocaleString();
      document.getElementById('bodyCellsCount').textContent = state.bodyCells;
      document.getElementById('dnaCount').textContent = state.dna;
      document.getElementById('passiveIncome').textContent = `+${state.passiveBiomass}/с`;
      document.getElementById('clickPowerText').textContent = `+${state.clickPower}`;
      document.getElementById('bodyCostText').textContent = `${state.bodyCellCost} 🦠`;
      document.getElementById('dnaCostText').textContent = `${state.dnaCost} 🦠`;

      const c = state.bodyCells;
      let era = 'Эра 1: Микроб';
      if (state.ascendLevel > 0) era = `⚡ Титан [Мега ${state.ascendLevel}]`;
      else if (c <= 3) era = 'Эра 2: Колония';
      else if (c <= 7) era = 'Эра 3: Личинка';
      else if (c <= 15) era = 'Эра 4: Членистоногое';
      else era = 'Эра 5: Хищный Зверь';
      document.getElementById('eraBadge').textContent = era;

      document.getElementById('growBodyBtn').disabled = state.biomass < state.bodyCellCost;
      document.getElementById('synthDnaBtn').disabled = state.biomass < state.dnaCost;

      const ascendBanner = document.getElementById('ascendBanner');
      ascendBanner.style.display = state.bodyCells >= 25 ? 'flex' : 'none';

      upgradesData.forEach(upg => {
        if (!upg.bought) {
          const btn = document.getElementById(`btn-${upg.id}`);
          if (btn) {
            btn.disabled = upg.type === 'biomass' ? state.biomass < upg.cost : state.dna < upg.cost;
          }
        }
      });
    }

    setInterval(() => {
      if (state.passiveBiomass > 0) {
        state.biomass += state.passiveBiomass / 10;
        updateUI();
      }
    }, 100);

    // ==========================================
    // --- АДАПТИВНЫЙ CANVAS И МОБИЛЬНЫЙ ТАЧ ---
    // ==========================================
    const canvas = document.getElementById('bioCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const foodParticles = [];
    for (let i = 0; i < 25; i++) {
      foodParticles.push({
        x: Math.random() * state.worldWidth,
        y: Math.random() * state.worldHeight,
        r: 3 + Math.random() * 3,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7
      });
    }

    const spine = [];
    const segmentLength = 12;

    function initSpineSegments() {
      const count = Math.max(1, state.bodyCells);
      while (spine.length < count) {
        const last = spine[spine.length - 1] || { x: 500, y: 400, angle: 0 };
        spine.push({ x: last.x - segmentLength, y: last.y, angle: 0 });
      }
    }

    const playerCreature = {
      worldX: 500,
      worldY: 400,
      targetWorldX: 500,
      targetWorldY: 400,
      angle: 0,
      pulse: 1,
      speed: 4.0
    };

    const camera = { x: 500, y: 400 };

    // Тач-управление на мобилке
    function handleTouch(e) {
      e.preventDefault();
      const touch = e.touches[0] || e.changedTouches[0];
      const rect = canvas.getBoundingClientRect();
      const screenX = touch.clientX - rect.left;
      const screenY = touch.clientY - rect.top;
      playerCreature.targetWorldX = camera.x + (screenX - canvas.width / 2);
      playerCreature.targetWorldY = camera.y + (screenY - canvas.height / 2);
    }

    canvas.addEventListener('touchstart', (e) => {
      handleTouch(e);
      const touch = e.touches[0];
      feedCreature(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener('touchmove', handleTouch, { passive: false });

    // Рендер
    function render(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = time * 0.002;

      // Ограничение границ мира
      playerCreature.targetWorldX = Math.max(30, Math.min(state.worldWidth - 30, playerCreature.targetWorldX));
      playerCreature.targetWorldY = Math.max(30, Math.min(state.worldHeight - 30, playerCreature.targetWorldY));

      const dx = playerCreature.targetWorldX - playerCreature.worldX;
      const dy = playerCreature.targetWorldY - playerCreature.worldY;
      const dist = Math.hypot(dx, dy);

      if (dist > 3) {
        playerCreature.angle = Math.atan2(dy, dx);
        playerCreature.worldX += Math.cos(playerCreature.angle) * Math.min(dist * 0.08, playerCreature.speed);
        playerCreature.worldY += Math.sin(playerCreature.angle) * Math.min(dist * 0.08, playerCreature.speed);
      }
      playerCreature.pulse += (1 - playerCreature.pulse) * 0.08;

      camera.x += (playerCreature.worldX - camera.x) * 0.08;
      camera.y += (playerCreature.worldY - camera.y) * 0.08;

      ctx.save();
      ctx.translate(canvas.width / 2 - camera.x, canvas.height / 2 - camera.y);

      // Сетка мира
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= state.worldWidth; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, state.worldHeight); ctx.stroke();
      }
      for (let y = 0; y <= state.worldHeight; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(state.worldWidth, y); ctx.stroke();
      }
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 0, state.worldWidth, state.worldHeight);

      // Еда
      foodParticles.forEach((f) => {
        f.x += f.vx; f.y += f.vy;
        if (f.x < 15 || f.x > state.worldWidth - 15) f.vx *= -1;
        if (f.y < 15 || f.y > state.worldHeight - 15) f.vy *= -1;

        if (Math.hypot(playerCreature.worldX - f.x, playerCreature.worldY - f.y) < 24) {
          f.x = Math.random() * state.worldWidth;
          f.y = Math.random() * state.worldHeight;
          state.biomass += state.clickPower * 0.5;
          playerCreature.pulse = 1.25;
          updateUI();
        }

        ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Позвоночник
      spine[0] = { x: playerCreature.worldX, y: playerCreature.worldY, angle: playerCreature.angle };
      for (let i = 1; i < spine.length; i++) {
        const prev = spine[i - 1];
        const cur = spine[i];
        const segAngle = Math.atan2(cur.y - prev.y, cur.x - prev.x);
        cur.angle = segAngle;
        cur.x = prev.x + Math.cos(segAngle) * segmentLength;
        cur.y = prev.y + Math.sin(segAngle) * segmentLength;
      }

      let skinColor = '#0ea5e9';
      let skinStroke = '#38bdf8';
      let eyeColor = '#ffffff';

      const archColors = {
        insect: { fill: '#d97706', stroke: '#fbbf24', eye: '#ef4444' },
        dragon: { fill: '#16a34a', stroke: '#4ade80', eye: '#facc15' },
        beast: { fill: '#92400e', stroke: '#f59e0b', eye: '#38bdf8' },
        kraken: { fill: '#7c3aed', stroke: '#c084fc', eye: '#a855f7' },
        griffin: { fill: '#dc2626', stroke: '#f87171', eye: '#ffffff' },
        xenomorph: { fill: '#059669', stroke: '#34d399', eye: '#a855f7' }
      };

      if (archColors[state.archetype]) {
        skinColor = archColors[state.archetype].fill;
        skinStroke = archColors[state.archetype].stroke;
        eyeColor = archColors[state.archetype].eye;
      }

      if (hasTrait('chloroplast')) {
        skinColor = '#15803d';
        skinStroke = '#86efac';
      }

      const numCells = state.bodyCells;

      if (numCells < 4) {
        spine.forEach((seg, idx) => {
          const r = (20 - idx * 3) * playerCreature.pulse;
          ctx.save();
          ctx.translate(seg.x, seg.y);
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(8, r), 0, Math.PI * 2);
          ctx.fillStyle = skinColor + 'cc';
          ctx.strokeStyle = skinStroke;
          ctx.lineWidth = 2.5;
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(-2, -2, r * 0.35, 0, Math.PI * 2);
          ctx.fillStyle = '#0f172a';
          ctx.fill();
          ctx.restore();
        });
      } else {
        const leftPoints = [];
        const rightPoints = [];

        for (let i = 0; i < spine.length; i++) {
          const seg = spine[i];
          let radius = 16;
          if (i === 0) radius = 19;
          else if (i < spine.length * 0.4) radius = 20;
          else radius = Math.max(5, 20 * (1 - (i / spine.length)));
          radius *= playerCreature.pulse;

          const normalAngle = seg.angle + Math.PI / 2;
          leftPoints.push({ x: seg.x + Math.cos(normalAngle) * radius, y: seg.y + Math.sin(normalAngle) * radius });
          rightPoints.push({ x: seg.x - Math.cos(normalAngle) * radius, y: seg.y - Math.sin(normalAngle) * radius });
        }

        if (hasTrait('legs') && spine.length >= 3) {
          ctx.strokeStyle = skinStroke;
          ctx.lineWidth = 3;
          for (let i = 2; i < spine.length - 1; i += 2) {
            const seg = spine[i];
            const legWalk = Math.sin(t * 8 + i) * 10;
            const norm = seg.angle + Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(seg.x, seg.y);
            ctx.lineTo(seg.x + Math.cos(norm) * 20 + legWalk, seg.y + Math.sin(norm) * 20);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(seg.x, seg.y);
            ctx.lineTo(seg.x - Math.cos(norm) * 20 - legWalk, seg.y - Math.sin(norm) * 20);
            ctx.stroke();
          }
        }

        ctx.beginPath();
        const head = spine[0];
        ctx.moveTo(head.x + Math.cos(head.angle) * 20, head.y + Math.sin(head.angle) * 20);
        for (let i = 0; i < leftPoints.length; i++) ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
        ctx.lineTo(spine[spine.length - 1].x, spine[spine.length - 1].y);
        for (let i = rightPoints.length - 1; i >= 0; i--) ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
        ctx.closePath();

        ctx.fillStyle = skinColor;
        ctx.fill();
        ctx.strokeStyle = skinStroke;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (hasTrait('glow') || state.skin === 'bioglow') {
          ctx.strokeStyle = '#d8b4fe';
          ctx.lineWidth = 4;
          ctx.beginPath();
          for (let i = 0; i < spine.length; i++) {
            if (i === 0) ctx.moveTo(spine[i].x, spine[i].y);
            else ctx.lineTo(spine[i].x, spine[i].y);
          }
          ctx.stroke();
        }
      }

      // Голова
      const headSeg = spine[0];
      ctx.save();
      ctx.translate(headSeg.x, headSeg.y);
      ctx.rotate(headSeg.angle);

      if (hasTrait('eyes') || numCells >= 2) {
        ctx.fillStyle = eyeColor;
        ctx.beginPath();
        ctx.arc(6, -8, 4, 0, Math.PI * 2);
        ctx.arc(6, 8, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(8, -8, 2, 0, Math.PI * 2);
        ctx.arc(8, 8, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (hasTrait('antennae')) {
        ctx.strokeStyle = skinStroke;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(10, -5); ctx.lineTo(26, -18);
        ctx.moveTo(10, 5); ctx.lineTo(26, 18);
        ctx.stroke();
      }

      if (hasTrait('mandibles')) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(12, -6); ctx.lineTo(22, -10);
        ctx.moveTo(12, 6); ctx.lineTo(22, 10);
        ctx.stroke();
      }
      ctx.restore();

      ctx.restore();
      requestAnimationFrame(render);
    }

    initSpineSegments();
    initShop();
    updateUI();
    requestAnimationFrame(render);
  </script>
</body>
</html>
