<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Идеальный Мир 2026: Глобальная Война</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #020617; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; user-select: none; }
        #map { height: 100vh; width: 100vw; background-color: #020617; }
        
        .aoh-panel {
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; color: #f8fafc;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); backdrop-filter: blur(8px);
        }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #020617 100%); z-index: 3000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .menu-container { width: 650px; padding: 40px; border-radius: 12px; text-align: center; }
        .menu-container h1 { color: #38bdf8; font-size: 32px; margin-bottom: 10px; }
        
        select, .btn {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px;
            background: #1e293b; border: 1px solid #475569; color: #f8fafc; font-size: 14px; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        .btn { background: #059669; border-color: #10b981; }
        .btn:hover:not(:disabled) { background: #10b981; }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; border-color: #475569; }

        #top-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 60px; z-index: 1000; display: none;
            align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #334155;
        }
        .stats { display: flex; gap: 15px; font-size: 14px; font-weight: 600; flex-wrap: wrap;}
        .stat-box { background: #1e293b; padding: 6px 12px; border-radius: 6px; border: 1px solid #475569; }
        
        #btn-next-turn { width: auto; margin: 0; padding: 8px 20px; background: #2563eb; border-color: #3b82f6; }

        .side-panel {
            position: absolute; top: 70px; width: 340px; max-height: calc(100vh - 100px);
            z-index: 1000; transition: right 0.3s ease, left 0.3s ease; padding: 20px; display: none; flex-direction: column;
            border: 2px solid #334155; border-radius: 12px; overflow-y: auto; background: rgba(15, 23, 42, 0.95);
        }
        #diplomacy-panel { right: -400px; border-right: none; border-radius: 12px 0 0 12px; }
        #diplomacy-panel.active { right: 0; }
        
        #division-panel { left: -400px; border-left: none; border-radius: 0 12px 12px 0; }
        #division-panel.active { left: 0; }

        .panel-title { font-size: 20px; font-weight: bold; text-align: center; color: #fff; margin-bottom: 5px; }
        .panel-subtitle { font-size: 13px; text-align: center; color: #94a3b8; margin-bottom: 15px; }
        
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .stat-card { background: #1e293b; padding: 8px; border-radius: 6px; text-align: center; border: 1px solid #334155; font-size: 12px; }
        .stat-card b { font-size: 14px; display: block; color: #fbbf24; }
        
        .btn-war { background: #dc2626; border-color: #ef4444; }
        .btn-action { background: #8b5cf6; border-color: #7c3aed; }
        .btn-target { background: #d97706; border-color: #f59e0b; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .army-icon {
            background-color: #2563eb; color: white; border: 2px solid #fff;
            border-radius: 4px; text-align: center; font-weight: bold; font-size: 11px;
            line-height: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); cursor: pointer;
        }
        .army-enemy { background-color: #dc2626; border-color: #fca5a5; }
        .army-selected { border: 2px solid #fde047; box-shadow: 0 0 15px #fde047; }

        #log-panel {
            position: absolute; bottom: 20px; right: 20px; width: 400px; max-height: 200px;
            overflow-y: auto; z-index: 1000; padding: 15px; font-size: 12px; border-radius: 8px; display: none;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #334155; padding-bottom: 3px; }
        
        .order-line { stroke-dasharray: 5, 5; animation: dash 20s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: 1000; } }
    </style>
</head>

    <div id="start-screen">

        let divIdCounter = 0;

        // Генерация списка стран
        const uniqueFactions = [...new Set(regionsData.map(r => r.faction))];
        const select = document.getElementById('country-select');
        uniqueFactions.sort().forEach(fid => {
            let name = regionsData.find(r => r.faction === fid).name;
            select.innerHTML += `<option value="${fid}">${name}</option>`;
        });
        select.value = 'aze';

        function addLog(msg, isTurn = false) {
            const p = document.getElementById('log-panel');
            p.innerHTML = `<div class="log-entry" style="${isTurn ? 'color:#38bdf8; font-weight:bold; border-bottom:2px solid #38bdf8;' : ''}">${msg}</div>` + p.innerHTML;
        }

        function getRelKey(f1, f2) { return f1 < f2 ? `${f1}_${f2}` : `${f2}_${f1}`; }
        function getStatus(f1, f2) { return statuses[getRelKey(f1, f2)] || 'peace'; }
        function setStatus(f1, f2, status) { statuses[getRelKey(f1, f2)] = status; }

        function startGame() {
            playerFacId = document.getElementById('country-select').value;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('top-bar').style.display = 'flex';
            document.getElementById('log-panel').style.display = 'block';

            uniqueFactions.forEach(fid => {
                let facRegions = regionsData.filter(r => r.faction === fid);
                let totalEcon = facRegions.reduce((sum, r) => sum + r.econ, 0);
                let totalPop = facRegions.reduce((sum, r) => sum + r.pop, 0);
                factions[fid] = {
                    id: fid, name: fid === playerFacId ? 'Игрок' : 'ИИ',
                    ap: 10, money: totalEcon * 2, econ: totalEcon, pop: totalPop,
                    color: facRegions[0].color, countryName: facRegions[0].name
                };
            });

            document.getElementById('player-faction').innerText = `Фракция: ${factions[playerFacId].countryName}`;
            
            regionsData.forEach(r => {
                r.owner = r.faction; 
                r.garrison = r.econ * 10;
                
                const polygon = L.polygon(r.coords, { color: '#020617', weight: 1.5, fillColor: r.color, fillOpacity: 0.7 }).addTo(map);
                polygon.on('click', () => handleRegionClick(r.id));
                regionLayers[r.id] = polygon;
                
                if (r.econ >= 150 || r.faction === playerFacId) {
                    let cLat = r.coords.reduce((sum, p) => sum + p[0], 0) / r.coords.length;
                    let cLng = r.coords.reduce((sum, p) => sum + p[1], 0) / r.coords.length;
                    createDivision(r.owner, r.id, cLat, cLng, 15000);
                }
            });

            updateUI();
            addLog('Глобальная карта инициализирована. Создавайте дивизии, прокладывайте маршруты, побеждайте.', true);
        }

        function handleRegionClick(regionId) {
            if (isTargeting && selectedDivision) {
                setDivisionOrder(selectedDivision, regionId);
                isTargeting = false;
                document.getElementById('btn-order-move').innerText = "Отдать приказ: Вторжение/Марш";
                document.getElementById('btn-order-move').classList.remove('btn-target');
                return;
            }

            selectedRegion = regionsData.find(r => r.id === regionId);
            document.getElementById('division-panel').classList.remove('active');
            
            document.getElementById('diplomacy-panel').style.display = 'flex';
            setTimeout(() => document.getElementById('diplomacy-panel').classList.add('active'), 10);
            updateDiploUI();
        }

        function handleDivisionClick(divId) {
            if (isTargeting) return;
            selectedDivision = divisions.find(d => d.id === divId);
            if(selectedDivision.owner !== playerFacId) return;

            document.getElementById('diplomacy-panel').classList.remove('active');
            
            document.getElementById('division-panel').style.display = 'flex';
            setTimeout(() => document.getElementById('division-panel').classList.add('active'), 10);
            updateDivUI();

            document.querySelectorAll('.army-icon').forEach(el => el.classList.remove('army-selected'));
            selectedDivision.marker._icon.querySelector('.army-icon').classList.add('army-selected');
        }

        function updateDiploUI() {
            if(!selectedRegion) return;
            const ownerId = selectedRegion.owner;
            const targetFac = factions[ownerId];
            const myFac = factions[playerFacId];
            const isMe = ownerId === playerFacId;
            
            document.getElementById('country-name').innerText = targetFac.countryName;
            document.getElementById('region-name').innerText = selectedRegion.name;
            document.getElementById('diplo-econ').innerText = Math.floor(selectedRegion.econ);
            document.getElementById('diplo-garrison').innerText = Math.floor(selectedRegion.garrison);

            const status = getStatus(playerFacId, ownerId);
            document.getElementById('diplo-status').innerText = isMe ? 'Ваша территория' : (status === 'war' ? 'ВОЙНА' : 'Мир');
            document.getElementById('diplo-status').style.color = status === 'war' ? '#ef4444' : '#10b981';

            document.getElementById('btn-recruit').style.display = isMe ? 'block' : 'none';
            document.getElementById('btn-improve').style.display = !isMe ? 'block' : 'none';
            document.getElementById('btn-alliance').style.display = (!isMe && status !== 'war') ? 'block' : 'none';
            document.getElementById('btn-war').style.display = (!isMe && status !== 'war') ? 'block' : 'none';
        }

        function updateDivUI() {
            if(!selectedDivision) return;
            document.getElementById('div-strength').innerText = Math.floor(selectedDivision.strength);
            let orderText = selectedDivision.targetRegionId ? `Движение в ${regionsData.find(r=>r.id === selectedDivision.targetRegionId).name}` : 'Удержание';
            document.getElementById('div-order').innerText = orderText;
            document.getElementById('btn-order-cancel').style.display = selectedDivision.targetRegionId ? 'block' : 'none';
        }

        function createDivision(ownerId, regionId, lat, lng, strength) {
            let divId = divIdCounter++;
            let isPlayer = ownerId === playerFacId;
            let iconHtml = `<div class="army-icon ${!isPlayer ? 'army-enemy' : ''}">${Math.floor(strength/1000)}k</div>`;
            let divIcon = L.divIcon({ className: 'custom-div-icon', html: iconHtml, iconSize: [24, 24], iconAnchor: [12, 12] });
            
            let marker = L.marker([lat, lng], { icon: divIcon }).addTo(map);
            marker.on('click', () => handleDivisionClick(divId));

            divisions.push({ id: divId, owner: ownerId, regionId: regionId, lat: lat, lng: lng, strength: strength, marker: marker, targetRegionId: null, orderLine: null });
        }

        function recruitDivision() {
            const myFac = factions[playerFacId];
            if (myFac.ap < 3 || myFac.money < 150) { addLog("❌ Недостаточно ресурсов (нужно ⚡3, 💰150)."); return; }
            myFac.ap -= 3; myFac.money -= 150;
            
            let centerLat = selectedRegion.coords.reduce((sum, p) => sum + p[0], 0) / selectedRegion.coords.length;
            let centerLng = selectedRegion.coords.reduce((sum, p) => sum + p[1], 0) / selectedRegion.coords.length;

            createDivision(playerFacId, selectedRegion.id, centerLat, centerLng, 15000);
            addLog(`⚔️ Дивизия сформирована в ${selectedRegion.name}.`);
            updateUI(); updateDiploUI();
        }

        function startTargeting() {
            isTargeting = true;
            document.getElementById('btn-order-move').innerText = "Кликните по региону на карте...";
            document.getElementById('btn-order-move').classList.add('btn-target');
        }

        function setDivisionOrder(div, targetRegId) {
            div.targetRegionId = targetRegId;
            if (div.orderLine) map.removeLayer(div.orderLine);
            let targetReg = regionsData.find(r => r.id === targetRegId);
            let tLat = targetReg.coords.reduce((sum, p) => sum + p[0], 0) / targetReg.coords.length;
            let tLng = targetReg.coords.reduce((sum, p) => sum + p[1], 0) / targetReg.coords.length;
            div.orderLine = L.polyline([[div.lat, div.lng], [tLat, tLng]], { color: '#f59e0b', weight: 2, className: 'order-line' }).addTo(map);
            updateDivUI();
        }

        function cancelOrder() {
            if(selectedDivision && selectedDivision.orderLine) {
                map.removeLayer(selectedDivision.orderLine);
                selectedDivision.orderLine = null;
                selectedDivision.targetRegionId = null;
                updateDivUI();
            }
        }

        function doDiplo(action) {
            const ownerId = selectedRegion.owner;
            const myFac = factions[playerFacId];
            if (myFac.ap < (action==='improve'?2:5)) { addLog("❌ Недостаточно ОД."); return; }
            myFac.ap -= (action==='improve'?2:5);

            if (action === 'war') {
                setStatus(playerFacId, ownerId, 'war');
                addLog(`🚨 ВЫ ОБЪЯВИЛИ ВОЙНУ ${factions[ownerId].countryName.toUpperCase()}!`);
            } else if (action === 'alliance') {
                setStatus(playerFacId, ownerId, 'alliance');
                addLog(`🛡️ Альянс с ${factions[ownerId].countryName} заключен.`);
            }
            updateUI(); updateDiploUI();
        }

        function updateUI() {
            const p = factions[playerFacId];
            document.getElementById('player-money').innerText = Math.floor(p.money);
            document.getElementById('player-ap').innerText = p.ap;
            document.getElementById('turn-counter').innerText = currentTurn;

            regionsData.forEach(r => regionLayers[r.id].setStyle({ fillColor: factions[r.owner].color }));
            divisions.forEach(d => {
                let isPlayer = d.owner === playerFacId;
                d.marker.setIcon(L.divIcon({ 
                    className: 'custom-div-icon', 
                    html: `<div class="army-icon ${!isPlayer ? 'army-enemy' : ''}">${Math.floor(d.strength/1000)}k</div>`, 
                    iconSize: [24, 24], iconAnchor: [12, 12] 
                }));
            });
        }

        function nextTurn() {
            document.getElementById('diplomacy-panel').classList.remove('active');
            document.getElementById('division-panel').classList.remove('active');
            selectedDivision = null; isTargeting = false;

            let combats = {};
            divisions.forEach(div => {
                if (div.targetRegionId) {
                    let targetReg = regionsData.find(r => r.id === div.targetRegionId);
                    if (targetReg.owner === div.owner || getStatus(div.owner, targetReg.owner) === 'alliance') {
                        executeMove(div, targetReg);
                    } else if (getStatus(div.owner, targetReg.owner) === 'war') {
                        if (!combats[targetReg.id]) combats[targetReg.id] = { attackers: [] };
                        combats[targetReg.id].attackers.push(div);
                    } else {
                        if (div.owner === playerFacId) addLog(`❌ Приказ отменен: нет состояния войны с ${factions[targetReg.owner].countryName}.`);
                        if (div.orderLine) map.removeLayer(div.orderLine);
                        div.targetRegionId = null; div.orderLine = null;
                    }
                }
            });

            for (let regId in combats) {
                let targetReg = regionsData.find(r => r.id === regId);
                let atkDivs = combats[regId].attackers;
                let defDivs = divisions.filter(d => d.regionId === targetReg.id && d.owner === targetReg.owner);
                
                let atkPower = atkDivs.reduce((sum, d) => sum + d.strength, 0);
                let defPower = targetReg.garrison + defDivs.reduce((sum, d) => sum + d.strength, 0);

                if (atkPower > defPower * 1.1) {
                    if(atkDivs.some(d => d.owner === playerFacId)) addLog(`🚩 ПОБЕДА! Войска захватили ${targetReg.name}!`);
                    targetReg.owner = atkDivs[0].owner;
                    targetReg.garrison = 5000;
                    defDivs.forEach(d => d.strength = 0);
                    atkDivs.forEach(div => { div.strength -= defPower * 0.2; executeMove(div, targetReg); });
                } else {
                    if(atkDivs.some(d => d.owner === playerFacId)) addLog(`💀 ПОРАЖЕНИЕ. Наступление на ${targetReg.name} отбито.`);
                    atkDivs.forEach(div => {
                        div.strength *= 0.5;
                        if (div.orderLine) map.removeLayer(div.orderLine);
                        div.targetRegionId = null; div.orderLine = null;
                    });
                    targetReg.garrison -= atkPower * 0.2;
                    defDivs.forEach(d => d.strength -= atkPower * 0.1);
                }
            }

            divisions.forEach(d => {
                if(d.strength < 1000) {
                    if (d.orderLine) map.removeLayer(d.orderLine);
                    map.removeLayer(d.marker);
                }
            });
            divisions = divisions.filter(d => d.strength >= 1000);

            Object.values(factions).forEach(f => {
                f.money += f.econ;
                f.ap = 10;
                if (f.id !== playerFacId && f.money > 400 && Math.random() > 0.6) {
                    let myRegs = regionsData.filter(r => r.owner === f.id);
                    if (myRegs.length > 0) {
                        f.money -= 150;
                        let reg = myRegs[Math.floor(Math.random() * myRegs.length)];
                        let cLat = reg.coords.reduce((sum, p) => sum + p[0], 0) / reg.coords.length;
                        let cLng = reg.coords.reduce((sum, p) => sum + p[1], 0) / reg.coords.length;
                        createDivision(f.id, reg.id, cLat, cLng, 15000);
                    }
                }
            });

            currentTurn++;
            updateUI();
            addLog(`--- Ход ${currentTurn} завершен ---`, true);
        }

        function executeMove(div, targetReg) {
            let tLat = targetReg.coords.reduce((sum, p) => sum + p[0], 0) / targetReg.coords.length;
            let tLng = targetReg.coords.reduce((sum, p) => sum + p[1], 0) / targetReg.coords.length;
            div.lat = tLat; div.lng = tLng; div.regionId = targetReg.id;
            div.marker.setLatLng([tLat, tLng]);
            if (div.orderLine) map.removeLayer(div.orderLine);
            div.targetRegionId = null; div.orderLine = null;
        }
    </script>
</body>
</html>
